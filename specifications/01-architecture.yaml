product: AgentScope
spec_version: 3.0.0
runtime:
  kind: static_single_page_application
  language: TypeScript
  frontend: Vanilla TypeScript
  bundler: Vite
  rendering: DOM SVG sequence diagrams and HTML inspectors
  routing: Single entry point with hash-based navigation
  data: Statically imported JSON scenarios and fixtures bundled by Vite
  runtime_backend: false
  api_keys: false
  external_services: false
  static_asset_loading: Allow same-origin loading of the application shell and built
    assets only.
  runtime_api_requests: 0
modules:
  scenario_registry: Validates bundled JSON and expands the composition before playback
  playback_engine: Deterministically reduces ordered events into snapshots
  diagram_renderer: Displays lifelines, phases, arrows, request/response pairs
  inspector: Displays exact logical payload, transport framing, rationale and notes
  context_inspector: Separately displays agent working state and model-visible messages
  payload_annotations: Explain each payload's fields in place, including where tracked
    values come from and go (replaces the lineage view, issue 49)
  rag_engine: Pure functions for chunking, demo embeddings, scoring, filtering, reranking
    and evidence-based answer composition (05-rag-scenarios.yaml)
  rag_visualizer: Chunking and simplified 2D embedding projection
  comparison_view: Synchronizes two simulations by semantic phase
participants:
  description: Single registry. Scenarios reference these IDs only. Each participant has a
    label and a unique short_label, which names it where room is scarce (02 phone_steps.rows);
    both validators require both, non-empty, and the short labels unique.
  registry:
  - id: user
    label: User
    short_label: User
    kind: person
  - id: agent
    label: Agent (host application / RAG orchestrator)
    short_label: Agent
    kind: application
    note: The same participant runs MCP tool calls and RAG retrieval.
  - id: llm
    label: LLM provider
    short_label: LLM provider
    kind: external_service
  - id: mcp-client
    label: MCP client
    short_label: MCP client
    kind: library
    note: Runs inside the agent process in these scenarios.
  - id: mcp-server
    label: Example Bank MCP server
    short_label: MCP server
    kind: service
  - id: rest-api
    label: Example Bank REST API
    short_label: REST API
    kind: service
  - id: database
    label: Core ledger
    short_label: Core ledger
    kind: datastore
  - id: embedding-model
    label: Embedding model
    short_label: Embedding model
    kind: external_service
  - id: vector-db
    label: Vector database
    short_label: Vector database
    kind: datastore
  - id: document-store
    label: Document store
    short_label: Document store
    kind: datastore
  - id: repository
    label: Document repository
    short_label: Repository
    kind: datastore
  - id: pipeline
    label: Ingestion pipeline
    short_label: Pipeline
    kind: application
  - id: parser
    label: Parser
    short_label: Parser
    kind: library
  - id: chunker
    label: Chunker
    short_label: Chunker
    kind: library
boundaries:
- from: user
  to: agent
  type: UI event
- from: agent
  to: llm
  type: Simulated provider-neutral model API over HTTPS
- from: agent
  to: mcp-client
  type: In-process method call
- from: mcp-client
  to: mcp-server
  type: Simulated MCP JSON-RPC over Streamable HTTP (revision 2026-07-28)
- from: mcp-server
  to: rest-api
  type: Simulated REST over HTTPS
- from: rest-api
  to: database
  type: Illustrative internal query
- from: agent
  to: embedding-model
  type: Illustrative model API
- from: agent
  to: vector-db
  type: Illustrative query API
- from: agent
  to: document-store
  type: Illustrative query API (optional step)
- from: pipeline
  to: embedding-model
  type: Illustrative model API
- from: pipeline
  to: vector-db
  type: Illustrative upsert API
source_of_truth:
  scenario: Event data and fixtures; no independent hardcoded payloads in UI
  state: Initial snapshot plus deterministic event reducer
  view: Derived from current snapshot and selected event
  derived_payloads: RAG events listed in a scenario's derived_events have their payload,
    explanation and tracked values recomputed by rag_engine from fixtures and parameters. The YAML shows the base scenario's default-parameter values.
repo_layout:
- specifications/
- specifications/tools/validate_specs.py
- specifications/tools/requirements.txt
- specifications/tools/mcp-schema-2026-07-28.json
- specifications/tools/LICENSE-mcp-schema
- index.html
- vite.config.ts
- playwright.config.ts
- eslint.config.js
- tsconfig.json
- tsconfig.node.json
- package.json
- package-lock.json
- src/main.ts
- src/styles/
- src/design/
- src/engine/
- src/diagram/
- src/inspectors/
- src/scenarios/
- src/fixtures/
- src/components/
- public/sw.js
- public/licenses/
- public/brand/
- tests/unit/
- tests/e2e/
- ".github/workflows/ci.yml"
- scripts/
- dist/
delivery:
- Source code
- Static offline build
- Scenario fixtures
- Automated tests
- README
deployment:
  build: Install locked dependencies with npm ci and the validator's Python requirements,
    validate the specifications against the vendored MCP schema, lint, run unit tests,
    run npm run build (type check, then Vite), then run the browser tests against the
    built site served under the base path.
  tooling: Node.js 22.18 or later (runs TypeScript scripts directly).
    TypeScript 6.0 (typescript-eslint does not yet support 7.x), Vite 8, Vitest,
    Playwright, ESLint, Prettier. Exact versions are pinned in package.json.
  workflows: One workflow, ci.yml, runs on pull requests, pushes to main and manual
    dispatch. One job installs, checks, builds dist once and runs the browser tests
    against that dist. Only runs on main other than pull requests (a push or a manual
    dispatch from main) upload that tested dist and deploy it; pull requests and manual
    runs from other branches never deploy. A failed check blocks deployment. Superseded
    pull request runs are cancelled; deployments of main run one at a time, and a newer
    one waits rather than cancelling one in progress (a waiting run is replaced by a
    newer one, so the latest commit deploys).
  github_pages: Use GitHub Actions as the Pages source. Upload dist as the Pages artifact
    and deploy it with the official Pages actions.
  base_path: Use /<repo>/ for a project site and / for a root site or custom domain.
    Deployable runs take the base path from the repository's Pages configuration, so a
    custom domain needs no code change; other runs build for /agentscope/ to exercise
    subpath hosting. The browser tests serve the build under the same base path. Resolve
    asset, navigation and service worker URLs within the configured base.
  version_stamp: The built page carries <meta name="agentscope-version"> with the commit
    SHA it was built from in CI ("dev" for local builds); the browser tests check it.
  post_deploy_check: After each deployment, fetch the live page and every script and link
    it references, the asset manifest, the service worker and every file the manifest
    lists. Fail the workflow when any of them does not return 200, when a listed file's
    bytes do not match its integrity digest, when any reference or listed file points
    outside the base path (including other origins), or when the page's or the
    manifest's version stamp differs from the deployed commit (a stale deployment). Network errors and stale responses are retried for about a minute first.
  offline: Bundle all scenarios, documents, fonts, brand images and visuals locally. On HTTPS or
    localhost, a base-scoped service worker precaches the complete versioned build
    from a build-generated asset manifest. Report offline readiness after successful
    caching and activation. Serve the cached shell and assets on reload and keep cache
    cleanup scoped to this app. First hosted visit requires connectivity.
  offline_mechanics:
    asset_manifest: The build writes asset-manifest.json to dist with the version stamp,
      one combined hash over the paths and bytes of every listed file and the bytes of the
      service worker template (so a changed worker gets a new cache even when no other
      file changed), and the list of
      every file in dist except asset-manifest.json and sw.js (scenarios, fonts, scripts,
      styles, licences, brand images, the page), each as a path relative to the base with its
      Subresource Integrity digest (sha256).
    service_worker: The build generates sw.js at the root of dist with that manifest
      inlined, so every build that changes any file changes the worker and browsers
      install the new version. The page registers it with the base path as its scope;
      the development server registers nothing.
    cache: One cache per build, named agentscope:<scope URL>:<version>:<hash>. Install
      fetches the base URL (with the digest of index.html) and every listed file past
      the HTTP cache with its integrity digest, and fails if any of them fails or does
      not match, so a stale file from a CDN never enters the cache and the browser tries
      again at its next update check. A redirected response is stored as a plain
      response, so navigations can use it. A worker only activates with a complete
      cache; a new worker activates at once and takes control of open pages.
    cleanup: 'Activation deletes only caches whose name starts with agentscope:<scope URL>:
      other than the current one and the newest previous one (the last created, in Cache
      Storage order), so a tab still running the previous build can load its files; caches
      of other apps and other scopes on the same origin are kept.'
    serving: Precached GET requests in the scope, and navigations to the base URL or
      index.html with any hash, are answered from the current cache. Any other GET
      request in the scope, and a miss, is looked up in this scope's other caches
      (newest first) and then sent to the network. Requests outside the scope and other
      methods go to the network untouched, as do only-if-cached requests whose mode is
      not same-origin (the browser refuses to fetch those). The first load after a deployment therefore
      shows the previous build while the new worker installs, and the next load shows
      the current one; there is no update notice (signal-to-noise).
    readiness: Once a worker is activated, the page asks it to confirm that every listed
      file is in its cache; only a confirmed answer shows the indicator (02-ui-ux.yaml
      layout offline_indicator). If the worker the page waited for becomes redundant
      (replaced by a newer one), the page asks the registration's active worker again
      before deciding.
    failed_load: 'If a lazily loaded part of the app (the #/design specimen) fails to load,
      the page shows an error naming it and suggesting a reload, announced as an alert,
      never a blank page.'
