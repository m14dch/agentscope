product: AgentScope
spec_version: 3.0.0
title: AgentScope — See how AI systems work, step by step
description: Offline interactive protocol and context-flow simulator for MCP, RAG
  and agent workflows.
audience:
  primary: Experienced software engineers new to AI integration
  prerequisites:
  - HTTP
  - REST
  - JSON
  - authentication
  - distributed systems
learning_outcomes:
- Trace each protocol request and response
- Distinguish model intent from agent execution
- Explain MCP per-request versioning, server discovery, tool discovery and tool execution
- Explain RAG ingestion, indexing, retrieval and generation
- Inspect model-visible context separately from agent state
- Identify transport, authentication and trust boundaries
- Compare MCP and RAG and understand how they compose
modules:
- id: mcp
  label: MCP
- id: rag
  label: RAG
- id: compare
  label: Compare
- id: combined
  label: Combined
constraints:
  offline: true
  no_backend: true
  no_real_llm: true
  no_credentials: true
  deterministic: true
  desktop_first: true
  tablet_supported: true
  phone_supported: true
  no_external_services: true
  no_api_keys: true
  browser_only: true
non_goals:
- Production MCP server
- Real vector database
- Live model playground
- Generic UML editor
shared_domain:
  name: Example Bank (fictional)
  api_base: https://api.example-bank.test
  mcp_endpoint: https://mcp.example-bank.test/mcp
  customer:
    id: '123'
    name: Alex Example
    balance:
      amount: 12500.75
      currency: CHF
    account_type: Everyday
  documents:
  - id: everyday-account.md
    used_by: RAG index
  - id: savings-account.md
    used_by: RAG index
  - id: account-opening.md
    used_by: RAG index
  - id: authentication.md
    used_by: RAG index (distractor)
  - id: balance-api.md
    used_by: RAG index (distractor)
  - id: release-notes.md
    used_by: RAG index (partly relevant)
  - id: openapi.yaml
    used_by: MCP resource in mcp-resources; not indexed
  - id: community-faq.md
    used_by: Untrusted document in rag-prompt-injection only
  fixture_locations:
    rag_documents: 05-rag-scenarios.yaml fixtures.documents
    openapi_yaml: 04-mcp-scenarios.yaml fixtures.openapi_yaml
primary_questions:
  mcp: What is the current balance of my bank account?
  rag: What are the conditions for opening and maintaining a bank account?
  combined: What is my current account balance, and would another account type offer
    better conditions?
implementation_priority:
- simulation-engine
- mcp-happy-path
- context-and-lineage
- rag-ingestion
- rag-retrieval
- comparison
- errors-and-polish
