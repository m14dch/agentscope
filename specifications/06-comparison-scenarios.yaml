          version: '1.2'
        - citation: 5
          chunkId: savings-account@1.2-c50o10-001
          documentId: savings-account.md
          version: '1.2'
      explanation: Show the answer. The balance links to the tool result; each citation opens its chunk.
      tracked_values:
