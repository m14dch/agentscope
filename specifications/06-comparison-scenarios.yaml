          content: |-
            Your current balance is CHF 12,500.75 (source: get_customer_balance tool). You have an Everyday account. Opening an account: anyone aged 18 or over who lives in Switzerland can open an account online [1]; you need a valid passport or identity card and a Swiss address [1]; the Everyday account needs no initial deposit [1]; the Savings account needs an initial deposit of at least CHF 100 [2]. Keeping an account: the Everyday account costs CHF 5 per month, has no minimum balance, pays no interest [3] and can be closed at any time without a fee [4]; the Savings account has no monthly fee, pays 0.50% annual interest and has no minimum balance [5]; accounts without any activity for 24 months are closed after a written notice [2]. Using the accounts: the Everyday account includes a debit card for payments and cash withdrawals [3] and has free domestic transfers [4]; the Savings account has no debit card and cannot be used for card payments [5]. The retrieved evidence does not cover the Savings account's withdrawal rules and transfers between the accounts. Whether the Savings account would be better depends on how you use your money: it would avoid the CHF 5 monthly fee and earn 0.50% annual interest, but it has no debit card, so it suits money you rarely need rather than everyday card payments.

