          documentId: account-opening.md
          version: '1.2'
        - citation: 2
          chunkId: account-opening@1.2-c50o10-002
          documentId: account-opening.md
          version: '1.2'
        - citation: 3
          chunkId: everyday-account@1.2-c50o10-001
