        paths:
        - messages.0
        values:
          messages.0.role: 'system: written by the agent, not by the user'
          messages.0.content: includes customer ID 123 and the account type from the session
      - heading: Question and documents
        sentence: The question and the retrieved chunks travel together in one user message, each chunk
          in a document block that names its source.
        paths:
        - messages.1
        values:
          messages.1.role: 'user: the question and its evidence'
          messages.1.content: the question, then one document block per retained chunk
      - heading: Tool definitions
        sentence: The model can only ask for the tools listed here, and it sees only their name, description
          and input schema.
        paths:
        - tools
        values:
          tools.0.name: a tool for the customer's profile
          tools.1.name: a tool for the account balance
          tools.1.description: what the model reads to decide whether to use the tool
          tools.1.parameters: 'JSON Schema the arguments must match: one customerId string'
    - id: c-05
      phase: planning
      sender: llm
      receiver: agent
      operation: Return requested tool call
      protocol: LLM_API
      transport: https
      execution_type: NETWORK
      message_type: RESPONSE
      pair_id: c-04
      payload:
        message:
          role: assistant
          tool_calls:
          - id: demo-call-1
            name: get_customer_balance
            arguments:
              customerId: '123'
        stop_reason: tool_use
      explanation: 'Simulated model output: the model asks the agent to run the balance tool; account terms
        came from retrieval, not from a tool.'
      tracked_values:
        customerId: '123'
      carries:
      - a request to run get_customer_balance, not an answer
      - 'the arguments the model filled in: customer ID 123'
      - a call id that the tool result must refer to
      annotations:
      - heading: Tool call
        sentence: Instead of text, the model returns a request that the agent run one of the offered tools.
        paths:
        - message
        values:
          message.role: 'assistant: the model''s turn'
          message.tool_calls.0.id: call id; the tool message with the result must repeat it
          message.tool_calls.0.name: the tool the model chose from the definitions
          message.tool_calls.0.arguments.customerId: copied from the system prompt; the agent checks it
            against the signed-in customer
      - heading: Stop reason
        sentence: The stop reason tells the agent why the model stopped and what it expects next.
        paths:
        - stop_reason
        values:
          stop_reason: 'tool_use: the model waits for the tool''s result'
  - copy:
      scenario: mcp-balance
      from: mcp-12
      to: mcp-25
      phase_map:
        context: tool-context
  - insert:
    - id: c-06
      phase: generation
      sender: agent
      receiver: llm
      operation: Submit full conversation with tool result
      protocol: LLM_API
      transport: https
      execution_type: NETWORK
      message_type: REQUEST
      pair_id: c-07
      payload:
        messages:
        - role: system
          content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
            the available tools for current account data and never guess balances. The customer's current
