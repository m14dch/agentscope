  expanded_event_count: 35
  required_boundaries:
  - RAG retrieval does not invoke the banking balance API
  - MCP supplies the simulated current balance from the bank fixture. RAG supplies published account terms.
  - Tool output and retrieved documents are lower-trust content
  - The final response combines both sources and keeps their provenance distinct
