product: AgentScope
spec_version: 2.0.0
compare:
  id: compare-rag-mcp
  left_scenario: rag-query
  right_scenario: mcp-balance
  left_question: What are the conditions for the different bank accounts you offer?
  right_question: What is the current balance of my bank account?
  synchronization: By semantic phases, not equal step numbers
  phases:
  - user-request
  - information-acquisition
  - context-assembly
  - model-generation
  - answer
  show:
  - Data source
  - Freshness expectations
  - Model-visible context
  - Actions vs retrieval
  - Trust boundaries
combined:
  id: combined-balance-explanation
  question: What is my current account balance, and would another account type offer
    better conditions?
  participants:
  - user
  - agent
  - embedding-model
  - vector-db
  - llm
  - mcp-client
  - mcp-server
  - rest-api
  - database
  ordered_operations:
  - Reuse MCP initialization and tools/list discovery before tool invocation.
  - Receive combined question and resolve authenticated fictional customer and current
    account type from demo context.
  - Embed an account-conditions query and retrieve terms for Everyday and Savings
    using the RAG fixtures.
  - Submit question, demo account context, retrieved evidence and tool definitions
    to the simulated model.
  - Simulated model requests balance tool. Agent validates tool and account authorization.
  - Replay MCP tools/call, simulated REST GET and tool result using the MCP fixture.
  - Store the tool result in agent state and submit it with retained context in a
    subsequent model request.
  - Return CHF 12,500.75 and cite Everyday and Savings terms. Explain the trade-off
    between fees, interest and payment or withdrawal access. Qualify suitability based
    on user needs and flag missing evidence.
  required_boundaries:
  - RAG retrieval does not invoke banking balance API
  - MCP supplies the simulated current balance from the bank fixture. RAG supplies
    published account terms.
  - Tool output and retrieved documents are lower-trust content
  - Final response combines both sources
  composition:
    reuse:
    - mcp-balance
    - rag-query
    balance_source: MCP tool result
    terms_source: Retrieved account terms chunks
    model_visibility: Each source becomes visible when submitted to the model. Preserve
      distinct tool and document provenance.
  account_comparison: Everyday supports debit card payments. Savings offers lower
    fees and interest with more limited withdrawals. Which is better depends on how
    the customer uses the account.
conceptual_rules:
- MCP is a protocol; RAG is an architectural pattern
- MCP can expose a RAG search tool
- MCP resources may provide documents used as context
- RAG can retrieve fresh sources; MCP can expose static resources
