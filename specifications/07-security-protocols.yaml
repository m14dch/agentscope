product: AgentScope
spec_version: 3.0.0
mcp:
  pinned_protocol_revision: '2026-07-28'
  primary_transport: Streamable HTTP
  reference: https://modelcontextprotocol.io/specification/2026-07-28
  validation:
  - Every request carries params._meta with io.modelcontextprotocol/protocolVersion
    and io.modelcontextprotocol/clientCapabilities, plus clientInfo
  - server/discover request and DiscoverResult schema
  - tools/list schema, including ttlMs and cacheScope
  - tools/call request and result schema, including structuredContent matching outputSchema
  - Every result carries resultType
  - Streamable HTTP POST carries one message, accepts JSON and SSE, and mirrors the
    body in MCP-Protocol-Version, Mcp-Method and (for tools/call and resources/read)
    Mcp-Name headers
  do_not_assume:
  - Every MCP message is its own TCP connection
  - MCP needs an initialize handshake or a protocol-level session (removed in 2026-07-28)
  - MCP automatically converts OpenAPI
  - LLM directly calls MCP server
  - MCP client always runs in separate process
  - MCP server inherits user identity or forwards the user's token to its backend
  - Tool result automatically becomes model-visible
  - Tool annotations or serverInfo are trustworthy
# Each boundary has a human label, the heading of its entry on the Security tab (02
# inspector.security_tab); the id stays in the data only (issue 76). Both validators require
# a non-empty label.
trust_boundaries:
- id: user-to-agent
  label: User → Agent
  risk: Untrusted user input
  mitigation: Validate requests and permissions
- id: agent-to-llm
  label: Agent → LLM provider
  risk: Sensitive context disclosure
  mitigation: Send only authorized data and only the fields the task needs
- id: agent-to-mcp
  label: Agent → MCP server
  risk: Unauthorized tool invocation
  mitigation: Tool allowlists, input validation, authorization of arguments against
    the authenticated identity, user approval for sensitive actions
- id: mcp-to-rest
  label: MCP server → REST API
  risk: Credential and authorization misuse
  mitigation: Distinct backend credentials, least privilege, no token passthrough,
    redacted demo tokens
- id: tool-to-llm
  label: Tool result → LLM provider
  risk: Prompt injection or sensitive data in tool output
  mitigation: Treat tool results as data, keep them in tool messages, preserve instruction
    hierarchy
- id: rag-to-llm
  label: Retrieved text → LLM provider
  risk: Prompt injection from retrieved text
  mitigation: Treat retrieved text as untrusted data, wrap it with provenance and trust
    labels, preserve instruction hierarchy
- id: vector-search
  label: Vector search
  risk: Cross-user document leakage
  mitigation: Document-level access filters applied inside the search
error_taxonomy:
  tool_execution: Successful JSON-RPC response with MCP tool result isError=true (backend
    failures, invalid argument values, business rule failures)
  protocol: 'JSON-RPC error object: -32602 unknown tool or malformed request, -32601
    method not found (HTTP 404), -32020 header mismatch (HTTP 400), -32022 unsupported
    protocol version (HTTP 400)'
  transport: HTTP failure or connection problem; not equivalent to tool failure
  model: Provider API failure or refusal
demo_policy:
  all_data_fictional: true
  never_real_tokens: true
  redact_auth_headers: true
  no_external_network: true
  label_internal_calls_as_illustrative: true
  runtime_api_keys: false
  simulated_wire_messages_only: true
  runtime_external_services: false
