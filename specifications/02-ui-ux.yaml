product: AgentScope
spec_version: 3.0.0
design:
  sources:
  - specifications/design-handover.md (Principiae decides how information is communicated;
    Sanzo Wada No. 303 decides how it looks)
  - Jean-luc Doumont, Trees, maps, and theorems (summaries at https://principiae.be/X0100.php#Summaries)
  - Swiss Style (International Typographic Style)
  handover_decisions:
  - Palette is Sanzo Wada No. 303 with the handover's supporting colours, plus one derived
    ink-muted and one darker peach for small text, both needed for contrast.
  - Diagrams sit on the light reading surface; the dark olive surface is not used (owner
    decision), so one set of colour rules applies everywhere.
  - Peach Red marks the current step (one exception, retained chunks in the retrieval
    charts, is recorded in the decision "Retained chunks keep the accent in the score plot and the
    projection (issue 15)" below);
    Naples Yellow marks what the learner selected or tracks. Error red is close to Peach Red in hue, so errors always carry a × and a text
    naming them.
  - The RAG question changes to the handover's question and the communication layer
    (learning questions, takeaways) was added to the scenario data
    (issue 22).
  - Self-hosted fonts stay because the app must work offline; no other dependency is
    added for the design.
  - Supporting colours are introduced only when a need appears (handover 4.1). Information
    and success are not used yet.
  - 'The page is White, not the handover''s Cream (issue 47, user testing): the cream tint
    carries no information, so paper is #ffffff, the handover''s White for reading surfaces,
    and one surface serves page and reading alike. Every contrast rule still holds and each
    on-paper ratio rises slightly (ink 13.6, ink-muted 6.0, accent-text 5.2, error 5.9,
    accent 3.4 : 1); no other token changes. The approved wordmark keeps its own dark badge,
    which reads on white as it did on cream.'
  - The approved silver-reticle wordmark and its favicon of issue 38 are the only brand
    marks. They are fixed images in public/brand/ and keep their own colours; they are not
    recoloured to the tokens, and their colours are not used anywhere else. The app is
    light only, so the header uses the light variant; the dark variant ships for a dark
    background but is not shown.
  - 'Retained chunks keep the accent in the score plot and the projection (issue 15),
    although handover 4.2 reserves Peach Red for the current step: inside a retrieval chart
    the retained chunks are what to look at now. The charts sit below the diagram and inspector, apart from
    the diagram''s current arrow and the current group''s accent bar above it, and they show
    the outcome of the current step itself (the selection made at the step that applies top K
    and the threshold), so the accent in both places points at the same thing. The accent is never the only
    signal there: retained points are filled and their rows say "retained" with the rank in
    words. Nothing is retained, and nothing is in the accent, before the step that applies
    top K and the threshold.'
  - 'The four playback buttons Reset, Previous step, Play or Pause and Next step show the standard
    media icons (issue 48). They are functional controls, not decorative icons: the icon is the
    control''s face, as on any media player, and replaces a row of text labels. Each keeps a text
    name for assistive technology and shows its name and key in words while it has focus, so
    nothing depends on recognising the icon or on hover (controls.row).'
  - 'Annotated payloads replace the Lineage tab (issue 49, user testing: "What is the lineage?
    Why is it useful?"). The question the tab answered, where a value such as the customer ID
    or the balance comes from and where it goes, is now answered in place: the annotation
    bullet of a tracked value says where it travels, with links to those steps
    (inspector.annotations.travel). The Lineage tab, the selection of a tracked value and the
    marks that selection put on the diagram, the step list and the retrieval charts are removed:
    the bullets name the few steps that matter, so marking every occurrence added nothing a
    learner asked for. The word lineage no longer appears in the interface.'
  - 'Three zoom levels replace the architecture/protocol switch (issue 51): the first screen showed
    up to seven lifelines and phase groups, and the very basic idea was missing. The Overview merges
    participants into a few parties and tells the scenario in 3 to 5 plain sentences; Architecture and
    Protocol are the former modes. The Overview names no protocol, so a first-time visitor meets the
    idea before the machinery (zoom_levels).'
  - 'Phones get one column of steps (issue 50, user testing: "Phone layout is unusable"), taken
    from tls12.xargs.org: the page order is the order of the exchange, every step is a closed
    full-width row with its direction glyph, and opening it shows the explanation and the raw
    message; several can be open and "Open all" opens them all. Its structure is adopted, its
    decoration is not: rows are separated by hairline rules, with no rounded bars, fills,
    shadows or illustrations, and the glyph is never the only signal (phone_steps). The column
    replaces the step list, the bottom bar, the menu and the automatic page scrolling of issue 30,
    which fitted the desktop structure onto a phone. Desktop and tablet keep the sequence diagram:
    with up to seven participants a single column only suits a phone.'
  governing_rule: Maximise the signal-to-noise ratio. Viewers already process protocols,
    payloads, context and trust boundaries; anything that carries no information is
    noise and is removed.
  removal_test: For every line, box, colour, label, icon, animation and word, ask what
    the viewer loses if it disappears. If nothing, remove it. Prefer whitespace and
    position to borders and boxes.
  supporting_laws:
  - 'Adapt to the audience: experienced engineers get exact payloads and precise terms,
    without decoration.'
  - 'Use effective redundancy: state each step''s message in words and show it in the
    diagram. Colour is never the only carrier of meaning.'
  grid: 12 columns on an 8 px baseline. Flush-left, ragged-right, asymmetric. Diagram
    and inspector share alignment lines. Side margin 16 px on phones, 24 px on tablets,
    48 px on desktops; gutter 16 px, 24 px from tablet width.
  typography:
    text: Inter (variable, self-hosted, OFL), Latin subset
    code: JetBrains Mono (variable, self-hosted, OFL), Latin subset
    sizes: 'Three only: small 13/16 px for labels and metadata, text 16/24 px, title
      24/32 px. At most two per region.'
    leading: 'Text that is read as sentences has a line height of at least 1.5: text 16/24 px;
      small text that forms a sentence above the diagram (the simulated statement) 13/20 px.
      Labels and metadata keep 13/16 px.'
    block_spacing: 'Between the blocks above the diagram, on the 8 px grid: the header row,
      8 px, the simulated statement, 24 px, the learning question, 8 px, the headline, 24 px,
      the controls.'
    weights: 400 and 600 only
    hierarchy: Size, weight and position; never colour alone
    figures: Tabular figures for numbers; numbers right-aligned in tables
  colour:
    tokens:
      paper: '#ffffff'
      ink: '#253122'
      ink-muted: '#5c6658'
      rule: '#b6bfc1'
      accent: '#f15a30'
      accent-text: '#bc4625'
      selection: '#fbe6a0'
      error: '#b73535'
    names:
      paper: White (supporting)
      ink: Deep Slate Olive (Wada 303)
      ink-muted: Derived from Deep Slate Olive for secondary text
      rule: Neutral Gray (Wada 303)
      accent: Peach Red (Wada 303)
      accent-text: Darker Peach Red for small text
      selection: Naples Yellow (Wada 303)
      error: Error (supporting)
    use:
    - Paper (white) is the page and the reading surface, and every band that hides what
      passes beneath it (the participant header, the group text in the diagram).
    - Ink carries text and data. Ink-muted carries secondary text, past-step labels and the
      boundary of every interactive control drawn with a border (buttons, the segmented zoom
      control, toggles, selects). A hovered button takes a 1 px ink border. A pressed toggle
      has a 2 px ink boundary (its ink border and an ink line just inside it) and weight 600,
      so pressed differs from unpressed and from hovered by more than colour; while it has
      keyboard focus the focus ring takes the place of the inner line. The segments of a
      segmented control share their borders by overlapping them, so a pressed or hovered
      segment shows its boundary on all four sides. Rule (Neutral Gray) carries structure
      only (lifelines, axes, separators, section and row rules, table borders, the inspector
      divider, the open picker list), never text, meaning or the boundary of a control
      (WCAG 1.4.11).
    - 'Controls drawn without a border (tabs, links, folds, the rows of phone_steps) are
      identified by their text and its underline or weight, not by a boundary. The sliders
      (the step slider, the RAG parameters) keep the browser''s own appearance with only
      accent-color set to ink: thumb and filled part are ink, and the unfilled track is the
      user agent''s, which WCAG 1.4.11 exempts as appearance determined by the user agent.
      Each slider''s value is also given as text (the position line "Step k of n", the
      parameter''s output beside it), so nothing depends on seeing the track.'
    - 'The focus ring is a 2 px outline 2 px outside the control, in accent (3.36:1 on paper).
      On or inside a selection background it is ink, because accent reaches only 2.71:1 on
      Naples Yellow: the focus indicator reaches 3:1 against every background it sits on.'
    - 'Accent (Peach Red) marks what to look at now: the current step and its pair, and
      retained chunks. It is used for lines and marks; text in that role uses accent-text.'
    - Selection (Naples Yellow) is a background for what the learner selected or tracks,
      such as tracked values in a payload, always together with an ink underline so the mark does not
      depend on colour. Never put accent marks on selection.
    - Error is used only for the app's own errors (an unknown route, invalid scenario data), always
      with a × and a text naming the error. No scenario shows a failure (03 one_scenario_per_use_case).
    - No other colour values exist outside the tokens, and no large saturated areas. The
      only exception is the approved brand images (layout brand); their colours stay inside
      those image files and never appear in styles, scripts or markup.
    - 'Contrast on paper: ink, ink-muted, accent-text and error reach 4.5:1; accent reaches
      3:1 for marks. Ink on selection reaches 4.5:1. Every visible border of a button, select
      or tab reaches 3:1 against the background behind it (WCAG 1.4.11); rule (1.87:1) does
      not, which is why it never draws a control.'
    - Enforcement - the source is scanned for hex values and colour functions outside the
      tokens, and a browser test checks every computed colour on rendered pages (default,
      focused and selected states, pseudo-elements and SVG gradient stops) is a token or
      transparent, none or a context paint, and that no shadow or gradient is used. The
      source scan skips exactly public/brand/agentscope-silver-light.svg,
      agentscope-silver-dark.svg and agentscope-silver-favicon.svg; the browser test needs no
      exception, because an image's own colours are not computed CSS colours.
    - No shadows, gradients, rounded cards, decorative icons, logos or background textures,
      apart from the one wordmark and favicon of layout brand.
      Light theme only in v1.
  labels_and_charts:
  - Label data directly next to what it names; no legends.
  - 'Underlines have two meanings only: solid ink on Naples Yellow marks a tracked or
    selected value; dotted ink-muted marks a control that folds or expands content.'
  - Every arrow carries a short text label (for example "MCP · tools/call").
  - Scores are dots on a 0–1 scale with the threshold as one labelled line; retained
    chunks use the accent, filled, and say "retained" in words (handover_decisions). No
    bars from an arbitrary origin; no gridlines unless they answer a question.
  - The 2D projection is a plain scatter plot with points labelled directly and axes
    named by meaning; on phones, where the labels cannot fit, its compact form names the
    points in a list tied to the plot (rag_retrieval.projection).
  - Charts fit the available width with text at its real size. Only sequence diagrams
    keep a fixed scale and scroll horizontally, from 48rem (768 px) up where they do not
    fit; below 48rem they become the column of steps (phone_steps), and the RAG projection
    takes its compact form (rag_retrieval.projection), so nothing scrolls horizontally on
    a phone.
  - Figures expose their text to assistive technology; scrollable regions are named
    and keyboard-focusable.
  motion: Motion only shows causality (an arrow draws from sender to receiver). Nothing
    else animates; with reduced motion nothing animates.
  writing:
  - Each step's explanation is the message, one sentence, shown first; details on demand.
  - Titles are messages or plain nouns, never filler such as "Overview" or "Details".
  - 'Structure stays shallow and narrow: at most 3 levels and 5 items per level.'
  specimen: 'The route #/design shows type, colours, each arrow kind, a payload block
    and a score plot, so the system can be reviewed on the live site. It is not linked
    from the app.'
navigation:
  tabs:
  - MCP
  - RAG
  - Compare
  - Combined
  default: MCP
  tab_contents:
    MCP: 04-mcp-scenarios.yaml mcp-balance
    RAG: 05-rag-scenarios.yaml rag-query, then rag-index
    Compare: 06-comparison-scenarios.yaml compare
    Combined: 06-comparison-scenarios.yaml combined
  routes: '#/<tab>/<scenario>/<step>, with /architecture or /protocol appended at those zoom
    levels (zoom_levels; for example #/mcp/mcp-balance/14/protocol); an address without a level
    is the Overview. Missing parts take defaults: the tab''s first scenario, step 0, the Overview.
    The step always numbers events, at every level; at the Overview the cursor rests at the end of
    a stage, so a step inside a stage opens the Overview at the end of that stage and the address
    is replaced with it (zoom_levels.cursor_mapping). An address ending in /overview opens the
    Overview and is replaced with the address without a level. A step beyond the scenario is clamped. An unknown tab or
    scenario shows an error naming it, with a link to the tab. Stepping replaces the
    history entry; changing tab or scenario adds one. Parameters are not part of the route,
    so a step number refers to the events played at the scenario''s default parameters.'
  earlier_routes: 'Before issue 51 an address without a level meant the architecture view. It
    now means the Overview, the level new learners start at: such an old link opens the stage
    holding its step, on every tab Compare included, from which zooming in returns to the stage''s
    events. Old /protocol addresses keep their meaning; /architecture is new.'
  removed_scenarios: 'Addresses of the variants removed in issue 46 still open: a removed scenario
    shows its base scenario at step 0 at the same zoom level, and the address is replaced with the
    base scenario''s (step 0, because a variant''s step numbers named other events). On MCP,
    mcp-resources, mcp-not-found, mcp-unauthorized, mcp-jsonrpc-error and mcp-multiple-tools
    open mcp-balance; on RAG, rag-stale, rag-no-match, rag-conflict, rag-hybrid and
    rag-prompt-injection open rag-query; on Combined, combined-missing-terms opens
    combined-balance-explanation. On another tab such an ID is unknown.'
  route_steps: 'While the parameters differ from the defaults, the address shows the step at
    which the current event is played at the defaults; if it is not played there, the step of
    the nearest earlier current event that is, else 0. A step read from the address names the
    event played at that step at the defaults; the cursor goes to that event, or if it is not
    played now to the nearest earlier default event that is, else to 0.'
  scenario_picker: 'Only RAG has two scenarios, so only RAG has a picker: one menu "Scenario:
    <title>" listing rag-query and rag-index by title, the current one marked, so the learner
    switches between asking the question and building the index it searches. MCP and Combined
    have one scenario each and no picker; the learning question names what they show.'
layout:
  desktop:
  - 'Top bar: navigation and scenario'
  - 'Main: resizable sequence diagram + payload inspector'
  - 'Below the learning question: the control row (controls.row), the playback buttons, the
    play speed and the timeline side by side'
  - 'Bottom: a collapsible model-context panel, collapsed at start,
    in rag-index the ingestion panel (rag_ingestion), in rag-query the retrieval panel
    (rag_retrieval) and, in the Combined scenario, the answer''s provenance (combined_answer). Where
    a tracked value comes from and goes is told in the payload''s annotations
    (inspector.annotations.travel), not in a panel or tab of its own'
  - 'Header: one persistent statement that everything is simulated and nothing leaves
    the browser'
  - 'Above the diagram: the scenario''s learning question and headline'
  - Bottom panels appear only once they have content
  brand: 'The header starts with the wordmark (public/brand/agentscope-silver-light.svg, the
    variant for the light paper; light theme only) as the page''s level-1 heading, an image
    with the text alternative "AgentScope" that links to #/. It is 40 px high (five baseline
    units; 32 px, four units, on phones, layout.phone), its badge flush with the left alignment line and the baseline of its lettering
    on the baseline of the header row, so it does not crowd the tabs, the controls or the
    simulated statement. index.html declares agentscope-silver-favicon.svg as an
    image/svg+xml icon. Both URLs resolve against the base path, are served from the app''s
    own files and are precached like every other file of the build.'
  source_link: 'A text link "GitHub" to https://github.com/m14dch/agentscope ends the header
    row, after the tabs and the controls there; it opens in the same tab, has no icon and is
    styled like the tabs (ink, no underline). On phones (layout.phone.header) it ends the
    wordmark row. It is an ordinary link: nothing is fetched from GitHub, so the app
    stays free of external requests.'
  offline_indicator: 'After the service worker has cached the build and activated (01-architecture.yaml
    deployment offline_mechanics readiness), the header''s simulated statement ends with "Available
    offline." in the same small ink-muted text. Nothing is shown before that, nor where no service
    worker runs (the development server, insecure origins); there is no progress or error message.'
  tablet: Stack inspector below horizontally scrollable diagram
  breakpoint: Side by side from 64rem; stacked below; the phone layout below 48rem
  max_width: 'The page does not use more width than its content needs. The header, the
    simulated statement, the learning question and headline, the control row and the panels
    below the workspace lie in a column at most 90rem (1440 px) wide, side margins included,
    centred; beyond it the paper is empty on both sides. Only the workspace of the MCP, RAG
    and Combined tabs (the diagram region with the splitter and the inspector) may be wider,
    and only as far as its diagram needs: at most the diagram''s natural width plus the
    splitter and the inspector, and never wider than the screen less its side margins; it is
    centred on the same axis and never narrower than the column. A diagram that fits the
    column (rag-query) keeps the column''s width; one that needs more (mcp-balance) gets it,
    so at 1920 px it does not scroll sideways. The natural width is the widest layout of the
    scenario at its current parameters (the Protocol level with every step shown, or the current
    layout if wider), so the workspace does not change width while stepping. The same width
    holds at every zoom level: the Overview''s merged lifelines are narrower than the Protocol
    layout, so zooming does not change the workspace either, except where the current level''s
    layout is wider than the Protocol one (a long group takeaway), which may widen it on a
    change of level, never while stepping. Compare stays
    in the column, its panes included: two panes side by side would gain little and pull
    their text out of the column, so each pane''s diagram scrolls inside its region. Below
    64rem, where the inspector stacks, nothing changes. Running text keeps a measure of
    about 45–75 characters: the learning question and headline are at most 36rem wide.'
  phone:
    breakpoint: Below 48rem (768 px), which includes a desktop browser zoomed to 200%; from
      48rem the tablet and desktop layouts apply unchanged. Crossing 48rem (a window resized or
      zoomed) lays the page out again at the same address, and focus moves to the page's heading
      (the learning question), as after a change of page.
    principle: One column that reads top to bottom, and only the page scrolls. Nothing scrolls
      horizontally, on the page or inside any region, in any tab, scenario, zoom level or panel,
      from 360 px wide; no region scrolls on its own and nothing is fixed to the screen.
    header: 'The wordmark (32 px high) with the GitHub link at the end of its row
      (layout.source_link), then the tabs, then on RAG the scenario picker
      (navigation.scenario_picker), then the simulated statement. The picker''s list opens in place
      and pushes the page down, so it closes only on a scenario choice, its own summary or Escape:
      a tap elsewhere keeps it open and does what it taps, without the page moving under the
      finger. There is no menu: the zoom control is in the column''s intro (phone_steps.intro) and
      there is no play speed.'
    presentation: Each scenario and Compare is the column of steps (phone_steps) in place of the
      control row, the diagram, the inspector and the panels below them.
    touch_targets: 'Every control outside running text (buttons, tabs, links of the header,
      toggles, sliders, the rows of phone_steps) is at least 44 × 44 px. Links and buttons inside
      a sentence (citations, step links, the step links in annotation bullets) and folds inside code are exempt, as
      in WCAG 2.5.8.'
    panels: Every panel stacks into one column inside the row it belongs to
      (phone_steps.inline_panels); the projection takes its compact form
      (rag_retrieval.projection).
    input: Nothing depends on hover. Focus and the focus order work as on desktop, for a learner
      with a hardware keyboard; the keys are those of phone_steps.keyboard.
  splitter: 'The boundary between diagram and inspector is a separator that resizes them by
    pointer drag or, when focused, the arrow keys; the inspector keeps 20rem to 60% of the
    width. Its width is a share of the workspace up to the column''s width (layout.max_width),
    so a workspace widened for its diagram gives all its extra width to the diagram. A drag
    sets the inspector to the distance from the pointer to the workspace''s right edge; each
    arrow key changes it by 2% of the workspace up to the column''s width. The separator''s
    value and label ("Inspector <n>% of the width") give the share of the workspace the
    inspector takes on screen, and its minimum the share 20rem takes.'
  timeline: A step slider from 0 to the number of steps, labelled with the step and its
    phase, and the position line "Step <k> of <n> · <phase>" beside it, both in the control
    row after the playback buttons (controls.row), never at the bottom of the page
  minimum_lifeline_width_px: 110
diagram:
  participants: Scenario-defined and ordered; labels from the participant registry
    (01-architecture.yaml)
  arrows: One per actual logical message or explicitly labeled internal operation
  encoding:
    principle: Protocol is shown by the arrow's text label and line style, not by hue.
    network: solid ink line, 1.5 px
    in_process: thin solid ink-muted line, 1 px
    simulated_internal: dashed ink-muted line, 1 px (4 px dash, 3 px gap)
    request: filled arrowhead
    response: open arrowhead
    current_and_pair: accent line, 2 px, and the label in weight 600, so the current step
      stays distinct in greyscale
  labels: 'Each arrow carries its operation as a direct text label, prefixed with the
    protocol for messages that cross a protocol boundary: MCP, HTTP, LLM API and DB (for
    example MCP · tools/call). The prefix is left out when the operation already starts
    with it (HTTP 200 OK). In-process, RAG-internal and UI steps show the operation only.'
  layout:
    lifeline_spacing: At least 110 px; wider gaps only where an arrow label needs the room,
      up to 240 px. From 48rem, where it does not fit, the diagram scrolls horizontally;
      below 48rem it is the column of steps (phone_steps).
    rows: One row per event in order, so labels never share a row. The label sits above
      its arrow, starting at the arrow's left end; a label longer than its arrow extends
      to the right and the diagram widens to fit it.
    self_arrows: An event whose sender is its receiver loops to the right of its lifeline,
      with the label to the right of the loop.
    participant_labels: Registry labels at the top of each lifeline, wrapped to the lifeline
      spacing. While the diagram region scrolls vertically they stay at its top on a paper band
      that hides what passes beneath, so every lifeline stays named; they scroll horizontally
      with their lifelines, and the current step is scrolled clear of them. They come before
      the diagram in reading order, so assistive technology meets them before the steps.
  visibility:
    past: line keeps its kind's style; label in ink-muted
    current: emphasized
    future: hidden at the Protocol level; rows keep their space so the layout does not move
      as the cursor advances
  pair_highlighting: true
  auto_scroll_to_current: Keep the current step (or current group) in view; scroll
    smoothly, or instantly with reduced motion
  accessible_without_color: true
  rendering: SVG lifelines, arrows and labels generated from ordered event data. The
    header states once that everything is simulated; arrows carry no per-arrow simulation
    label.

zoom_levels:
  principle: 'Like a change of altitude (issue 51): the learner starts from the very basics and zooms
    in to the architecture, then to the protocol. Every level shows the same scenario at the same
    place; only the detail changes. Overview, Architecture and Protocol replace the former
    architecture and protocol modes.'
  levels:
  - overview
  - architecture
  - protocol
  default_level: overview
  overview: 'The very basics, before any protocol name: the scenario''s parties (03
    overview_fields.parties) as merged lifelines labelled by party, and its 3 to 5 stages (03
    overview_fields.stages) as blocks in order, each holding its sentence. The parties'' names head
    the diagram as its "Parties" (where the other levels name their participants), and the parties
    spread across the width of the diagram region: the gap between two lifelines grows from 200 px
    to fill the region, up to 360 px, so a wide workspace (layout.max_width) does not leave the
    Overview in one corner. A stage block spans the lifelines of the parties its events touch, as
    a group does, and widens only to fit its sentence; lifelines pass under its text. The current stage, the one holding the cursor''s event, is marked
    like the current group: a 3 px accent bar along its left edge and its sentence in weight 600. All
    stages are shown from step 0, so the whole story reads at once; there are no arrows, protocol
    names, step numbers or payloads. The inspector shows the current stage''s sentence as its message
    line (before the first stage, the scenario''s question and "Nothing has happened yet. Next runs
    the first stage.") and no step details; the parameters and
    the panels below the workspace (model context, ingestion, retrieval, the
    Combined answer) appear from Architecture on. The learning question heads the page at every level.
    The headline names the mechanism and its protocol (for example MCP), so it is shown from
    Architecture on, where it states what the groups show; at the Overview the stage sentences carry
    the message.'
  architecture: 'Conceptual level: collapse each scenario phase into one expandable group
    headed by its takeaway (the phase label is secondary). Shows the learning question, the
    headline and plain explanations.'
  architecture_groups: 'Groups follow the events in order: one group per consecutive run
    of a phase''s events, so a phase that resumes after another (the MCP tool call around
    its backend call) appears again, captioned as continued and without repeating its
    takeaway. A phase without events has no group. A group spans at least the lifelines
    its events touch and widens only to fit its takeaway. The group holding the current
    step is the current group: an accent bar and its takeaway in weight 600. A group expands or collapses on click, Enter or Space; expanded, it shows its
    events up to the cursor with the Protocol styling. The current step is visible without
    a click: when the cursor enters a group (stepping forward or back, a jump, a link to a
    step), that group expands, so the current group is always expanded unless the learner
    collapsed it while it was current. A group the cursor expanded collapses again when the
    cursor leaves it, so the level stays one takeaway per phase; a group the learner
    collapsed reopens only when the cursor enters it again; a group the learner expanded keeps
    its state while the learner steps. At step 0 (and after Reset) no group is current and only
    the groups the learner expanded are open. The same holds in each Compare pane, where a waiting pane (compare_view.timeline)
    has no current group. Lifelines pass under a group''s takeaway and caption, not
    through them.'
  protocol: 'Technical level: show all individual events with exact logical messages;
    the inspector holds payloads and boundaries.'
  stepping: 'The Overview steps stage by stage: the cursor rests at the last event of a stage (the
    state once the stage has happened), Next and Play move to the last event of the next stage,
    Previous to the last event of the previous stage or to step 0, and a stage without played
    events is passed over. The slider runs over the stages, from 0 to their number, and the
    position line reads "Stage <s> of <m>". Architecture and Protocol step event by event: at
    Architecture the current group is expanded (architecture_groups), so its events are what Next
    walks through, and the position line reads "Step <k> of <n> · <phase label>" as before.'
  cursor_mapping: 'One cursor for every level: a stage covers the events of its phases, a group a run
    of one phase''s events. Zooming keeps the learner''s place. Zooming in from the Overview moves the
    cursor to the first event of the current stage, so the learner watches that stage happen; zooming
    out to the Overview moves it to the last event of the stage holding the current event; between
    Architecture and Protocol the cursor stays on its event. Step 0 stays step 0. A pure function
    maps the cursor both ways, and a unit test checks it for every scenario.'
  control: 'One zoom control replaces the architecture/protocol switch: a group "Zoom" of three
    buttons, Overview, Architecture and Protocol, the current one pressed (aria-pressed), at the start
    of the control row (controls.row); below 48rem it is in the column''s intro (phone_steps.intro). The
    keys + (or =) zoom in and - zooms out (controls.keyboard). A change of level keeps focus on the
    control that made it, and a polite live region announces the level and the position, for example
    "Architecture. Step 9 of 28 · Model chooses a tool; agent validates." or "Overview. Stage 2 of
    4."; stepping announces nothing there. Where focus sat in what the level hides, it moves to
    the zoom control''s pressed button.'
  scrolling: Only a cursor change or a change of level scrolls, and only the diagram's own
    scroll region, never the page (on phones, phone_steps.scrolling); toggling a group or laying out again keeps the scroll
    position. It scrolls only as far as needed to bring the current step into view, or the current
    group when it is collapsed (in an expanded current group, the step inside it, together with the
    group's start when both fit in the region), or the current stage, horizontally never past its
    left edge, so an arrow that fits keeps both its sender and its receiver in view. Keyboard focus
    stays on the same group or region across steps. Arrow keys scroll the diagram region while it
    has focus.
  switch_preserves_position: true
phone_steps:
  principle: 'Below 48rem (layout.phone) a scenario is one column of steps that reads top to
    bottom, as tls12.xargs.org shows a TLS connection (issue 50; handover_decisions): the order of
    the page is the order of the exchange, so reading down the page is stepping through it. Every
    unit of the current zoom level is listed from the start, as a closed row; opening a row shows
    what the inspector and the panels show for it on wider screens. Desktop and tablet keep the
    sequence diagram.'
  intro: 'In this order: the learning question (the level-2 heading); from Architecture on the
    headline (zoom_levels.overview); the zoom control (zoom_levels.control); in a scenario with
    parameters, from Architecture on, a fold "Parameters" (a button with aria-expanded, dotted
    underline like every fold, closed at start) over the parameter controls (rag_controls); then,
    at Architecture and Protocol, the buttons "Open all" and "Close all" side by side. Nothing
    else comes before the rows.'
  rows:
    overview: 'The stages in order as a numbered list, each its sentence and below it the parties
      its events involve in small ink-muted text (for example "Assistant · Bank systems"). The
      Overview has nothing more to show for a stage, so its stages are not rows that open: the
      whole story reads at once, and the zoom control leads further in.'
    architecture: 'One row per group of zoom_levels.architecture_groups, in order: its takeaway
      (for a continued run its phase label followed by "continued"), and below it in small
      ink-muted text the caption: the phase label and the number of steps (for a continued run
      only the number, as its title already names the phase).'
    protocol: 'One row per played event, in order: the step number in small ink-muted text, the
      direction glyph, the operation label (diagram.labels), and below the label the two
      participants by their short registry label (01 participants.registry short_label) in small
      ink-muted text, "Agent → MCP server"; a computation inside one participant names it once,
      followed by "· nothing sent". Where a short label differs from the full label, the opened
      body starts with the participants by their full labels in small ink-muted text.'
    glyph: '→ for a request or action sent to another participant (the filled arrowhead of the
      diagram), ← for a response or result (the open arrowhead), ↻ for a computation inside one
      participant (its sender is its receiver), which sends nothing: a loop, as the diagram draws
      a self-call. It sits in a column of its
      own in ink and is hidden from assistive technology, which hears "request", "response" or
      "nothing sent" in its place. It is never the only signal: the participants line states
      the direction.'
    control: 'Each row of Architecture and Protocol is one full-width button inside a list
      item, with aria-expanded and aria-controls naming its body; a hairline rule separates the
      rows. Activating it (pointer, Enter or Space) opens or closes its body directly below it,
      and focus stays on it. Several rows can be open. Open all opens every row and Close all
      closes every one; neither moves focus. An open row''s title is in weight 600. At start no
      row is open except the one the address names (address).'
  body:
    protocol: 'In this order: the inspector for the event (inspector): its explanation without the sender → receiver line the
      row already shows, the carries list (inspector.carries), then its tabs, the payload with its
      Annotations toggle (inspector.annotations); then the panels the event holds
      (inline_panels). The tabs show directly: the row is the fold.'
    architecture: 'The group''s events in order, each its step number, operation label and
      participants as in a Protocol row, and its explanation (inspector.message_line), as plain
      text; then the panels its events hold (inline_panels). Payloads are at Protocol.'
  inline_panels: 'A panel sits in the row of the step it explains, not below the page, and shows
    what it shows at that step on wider screens: the model context (context_panel) as a fold
    "Model context" (aria-expanded, closed at start) in the row of every LLM API request; in
    rag-index the ingestion panel (rag_ingestion) at index-07, which computes the vectors; in
    rag-query the scores and the projection (rag_retrieval.scores, rag_retrieval.projection) at
    retrieve-06, where top K and the threshold decide, the prompt (rag_retrieval.prompt) at
    retrieve-10, the request that sends it, and the answer (rag_retrieval.answer) at retrieve-12;
    in the Combined scenario the answer''s provenance (combined_answer) at c-08. At Architecture
    they follow the group''s events. A jump link in the inspector or a panel opens the row of its
    step and scrolls it to the top of the screen.'
  stepping: 'There is no control row: no step slider, Reset, Previous, Play, Next or play speed.
    The page order already is the sequence and the learner reads at their own pace, so stepping
    controls would only add a second way to move through the same rows.'
  keyboard: 'Tab reaches the rows in page order, and Enter or Space opens or closes the focused
    one. + (or =) and - zoom as on wider screens (controls.keyboard, keyboard_scope); the arrow
    keys and Space keep their browser meaning (scrolling the page, pressing the focused button).'
  address: 'The step of the address (navigation.routes) is the last row the learner opened: its
    event at Protocol, the first event of its group at Architecture; closing a row leaves it.
    Opening a page at a step opens the row holding that step (at Architecture the group holding
    it), scrolls the page at once so the row starts 48 px below the top of the screen, keeping the
    end of what comes before it in sight, and moves focus to the row''s button. At the Overview
    the address holds the stage as on wider screens (zoom_levels.cursor_mapping).'
  zoom: 'A change of level keeps the place (zoom_levels.cursor_mapping): the row holding the
    mapped step opens (none at step 0), the others are closed, focus stays on the zoom control and
    the page does not scroll. A polite live region announces the level and the number of rows, for
    example "Protocol. 28 steps." or "Overview. 4 stages."'
  parameters: 'A parameter change recomputes the events (controls.action_rules.parameter_change)
    and rebuilds the rows; the rows of events still played stay open, and the fold and focus stay.'
  scrolling: 'Only the page scrolls, and it scrolls by itself only for an address or a jump link
    (address, inline_panels), at once. Opening, closing, Open all, Close all, a change of level and
    a parameter leave it where it is. No region scrolls on its own and nothing is fixed to the
    screen, so nothing covers the content.'
  design: 'Swiss rules (handover_decisions): flush left, hairline rules between rows and no other
    frame, no rounded bars, fills, shadows or illustrations. An open row is marked by the weight of
    its title and the body below it.'
  compare: 'Compare is one column too, interleaved by semantic phase: the heading
    (compare_view.layout), the zoom control, Open all and Close all from Architecture on, then each
    semantic phase in order as a level-3 heading with its label, followed by the units of the level
    in it, RAG''s first and then MCP''s. Each unit says "RAG" or "MCP" in small ink-muted text
    before its title, so the scenario is read as text, not colour. The units are those of the level,
    by the semantic phase they belong to (compare_view.timeline): stages at the Overview (each by
    the semantic phase of its first phase), groups at Architecture, events at Protocol. A scenario
    without units in a phase shows its placeholder (06 compare.placeholders) as a plain line marked
    the same way. An opened Compare row shows the explanation (a group: its events as at
    Architecture) and a link "Inspect step <k> in <tab>" to the scenario''s own route at that step
    and level, where its payloads and panels are. From Architecture on the aspects follow
    (compare_view.layout). Opening rows leaves the address; a change of level changes only its
    level suffix, and the compare step stays (compare_view.route).'
learning:
  interaction: 'Each scenario follows the handover''s pattern (6.1): show the learning
    question and headline, the participants, one step, the highlighted interaction, its
    message, then the technical details on demand. No question interrupts the steps: Next
    always runs exactly one step, and Play runs from the start to the end without stopping.'
  simulated_behaviour: Model output is labelled as simulated wherever it appears; nothing
    suggests a live decision. The explanation of every response the model sends (LLM API
    responses from the LLM provider, tool-call requests included) starts with "Simulated model
    output".
controls:
  actions:
  - next
  - previous
  - play
  - pause
  - reset
  - jump_to_step
  action_rules:
    reset: Return to the initial state before any step and pause
    previous: Recompute the previous snapshot; never undo side effects
    play: Advance one step per interval until the last step, then pause
    manual_navigation: Next, previous and jump keep playback running and restart
      the interval
    parameter_change: The cursor stays on the same event if that event is still played;
      otherwise it moves to the nearest earlier event that is still played, or to 0. Optional
      steps that a parameter adds or removes before the cursor therefore change the step
      number, not the event
  step_interval_ms: 1500
  step_interval_rule: At speed s, one step every step_interval_ms / s milliseconds; reduced
    motion keeps the interval and removes animated transitions
  speeds:
  - 0.5
  - 1
  - 2
  - 4
  speed_control: 'One menu (a select) labelled "Play speed" offers the speeds as 0.5×, 1×, 2× and
    4×, 1× chosen at first. It sets the interval of Play: at once while playing, else the next
    time Play runs. There are no separate speed buttons.'
  row: 'One row below the learning question, in this order: the zoom control (zoom_levels.control),
    Reset, Previous step, Play or Pause, Next step, the play speed (speed_control), then the timeline (layout.timeline): the step slider,
    taking the remaining width but at least 12rem, and the position line. The four buttons show the standard media
    icons, inline SVG in ink at 24 px: a circular arrow (Reset), a bar and a triangle pointing left
    (Previous step), a triangle pointing right (Play) or two bars (Pause), and a triangle pointing
    right and a bar (Next step). Each button is named in text (Reset, Previous step, Play or Pause,
    Next step), declares its key of controls.keyboard (aria-keyshortcuts; Reset has none) and,
    while it has focus, shows its name and key in small text: below the button, clear of the
    rule under the row, so it covers neither the position line nor the slider; nothing depends
    on hover.
    While playing, Play shows the Pause icon and is named Pause. When the row is too narrow, the
    timeline wraps onto its own line directly below the buttons. Below 48rem there is no control
    row: the zoom control is in the column''s intro and nothing steps (phone_steps.stepping).'
  keyboard:
    ArrowRight: next
    ArrowLeft: previous
    Space: toggle play/pause
    +: zoom in (= also, the same key without Shift on many keyboards)
    '-': zoom out
  keyboard_scope: The keys act anywhere on the page except where focus needs them itself
    (Space on buttons, links and menus; the arrow keys on text fields, the play speed, the step slider,
    the splitter, the inspector tabs and the diagram's scroll region; + and - on text fields and
    menus). With Ctrl or Cmd, + and - stay the browser's page zoom.
  reduced_motion: true
inspector:
  message_line: Always visible above the tabs. The event's explanation, then sender →
    receiver and operation. Replaces separate Overview and Explanation tabs.
  earlier_revision: 'On a server/discover request the Payload tab ends with a collapsed
    control, "Compare with the initialize handshake of revision 2025-11-25", underlined
    dotted like other folds. Opened, it shows the summary and each message of 04-mcp-scenarios.yaml
    protocol.earlier_revision_handshake (sender → receiver, operation, request or status
    line, headers, payload), each labelled with that revision. It starts collapsed and
    is the only place the earlier messages are shown.'
  carries: 'Directly below the message line, when the event has carries (03 event_schema):
    the lead "It carries" in small ink-muted text, then the phrases as a bulleted list in text
    size, in their order. It is part of the step''s message, so it comes before the tabs on
    phones too (phone_steps.body).'
  annotations:
    toggle: 'When the event has annotations that fit its payload (03 annotation_rules), the
      Payload tab''s tool row (pair link, Copy) holds a toggle "Annotations" (a button with
      aria-expanded and aria-controls naming the payload block, dotted underline like other
      folds). It is closed at start and kept as the learner left it while stepping, for every
      step that has annotations. Closed, the payload shows as before (folding). An event
      without annotations, or whose annotations do not fit its derived payload, shows no toggle.'
    open: 'Open, the payload is split into its annotation groups in order. Each group shows its
      JSON lines first, as in the closed payload (syntax colours, indentation) but unfolded,
      so the raw message still reads top to bottom. A line inside a changed message or member
      (changed_fields) is marked as a whole line, since there is no branch to mark; tracked
      values are marked as in the closed payload. The
      concatenated lines of all groups are exactly JSON.stringify(payload, null, 2). Below
      the lines comes the group''s callout: a text block set off by a hairline rule on its left
      and indented 16 px, with no card, fill, shadow, rounded corner or illustration. It holds
      the heading in text size, weight 600 (a level-3 heading, so assistive technology can move
      between groups), the sentence, then one bullet per value in the order written: the value
      in the code face, then a dash and its meaning. A string value longer than 40 characters
      is cut to its first 36 and an ellipsis; an object or array shows as {…} or […] with its
      member count ("[…] 2 items"), an empty one as {} or []. Boilerplate (jsonrpc, _meta) is a group of its own with its
      sentence instead of a silent fold.'
    travel: 'A bullet whose value equals one of the event''s tracked values (03 lineage) ends
      with a second line in small text that says where the value travels. It starts with the
      origin: "From <origin>" when the value comes from the scenario''s initial state (03
      lineage.origins, for example "From the signed-in session"), else "First seen at step <k>
      (<sender> → <receiver>)", or "First seen here", for the first played event that tracks
      the value (participants by their registry label without its parenthetical, the
      participant alone for a self-call). Then, in step order and each only when it is a later
      step than k (any step for an origin in the initial state), the steps that matter: " ·
      reaches the model at step <m>" for the first played LLM request that tracks it, " · the
      model repeats it at step <w>" for the first LLM response that tracks it (the model only
      repeats a value it was given; it never produces one), " · the agent
      checks it at step <c>" for the first event after w that is the agent''s own action
      (INTERNAL, agent to agent) and tracks it, and " · sent to <receiver> at step <t>" for the
      first MCP or HTTP event that tracks it; "here" stands for the current step. Each step
      number is a link that jumps there. Later steps are named too, because where a value goes
      is what the line teaches, and a link may point to any step. Values inside a longer string are not
      matched.'
    phone: 'The same on phones, inside an opened row (phone_steps.body): lines and callouts wrap
      and stack in one column, nothing scrolls sideways at 390 px or at 200% zoom, and the toggle
      is at least 44 × 44 px (layout.phone.touch_targets). The toggle is kept as the learner left
      it for every row opened afterwards.'
    copy: Copy still copies the raw payload as formatted JSON, open or closed.
  tabs:
  - Payload
  - Transport
  - Security
  empty_tabs: Hidden when the step has nothing for them (for example Transport on
    in-process calls)
  simulation_note: One line on illustrated network exchanges stating that the exchange
    is simulated
  payload_features:
  - syntax highlighting
  - copy
  - expand/collapse JSON
  - correlated request/response
  - repeated boilerplate (jsonrpc, _meta, repeated headers) folded to one line that
    expands on click; never hidden
  - fields that changed or that hold a tracked value (03 lineage) are highlighted with the
    selection background and an ink underline
  - annotations (inspector.annotations)
  transport_tab: Show simulated wire envelopes separately from logical payloads, including
    the MCP headers mirrored from the body (MCP-Protocol-Version, Mcp-Method, Mcp-Name).
    In-process calls have no transport envelope.
  security_tab: Lists the event's security_boundaries with risk and mitigation from
    07-security-protocols.yaml.
  tab_rules: The tabs follow the ARIA tabs pattern (arrow keys move between tabs while
    one has focus). The chosen tab stays chosen while stepping as long as the step has
    content for it; otherwise the first tab with content shows. A step with no content
    for any tab shows the message line only. The inspector is rebuilt only when the step
    changes; then focus stays on the equivalent control (the same tab, fold or button).
  syntax: 'JSON without hue: keys and punctuation in ink-muted, values in ink, so the
    data reads first. Long values wrap; code never needs horizontal scrolling at 200%
    zoom.'
  folding: 'Objects and arrays expand and collapse; all start expanded except folded
    boilerplate: the top-level jsonrpc member and every _meta member of MCP messages, folded to one line naming
    them, and in Transport the headers identical to those of the previous network request
    from the same sender, folded to one line counting them.'
  changed_fields: On an LLM request, the messages and fields that the previous LLM request
    of the scenario did not have are highlighted; on other events nothing is marked as
    changed. Leaf values equal to one of the event's tracked values are highlighted the
    same way.
  redaction: Values containing <REDACTED…> are shown as stored, followed by the label
    redacted.
  pair_link: A request links to its response and a response to its request by step
    number; the link jumps there.
  technical_notes: Shown below the payload, only when present.
  copy: Copies the payload as formatted JSON.
context_panel:
  layout: Agent state and model-visible context side by side; only the change since
    the previous step is highlighted, in place
  rule: Tool results and retrieved text are not model-visible until a subsequent model
    request includes them
  agent_state: 'The agent''s working memory as a list, oldest first: each entry''s step,
    description and value. An entry stays labelled "not yet seen by the model" until an
    LLM request after the step that stored it contains its value (any string of eight or
    more characters in the value appears in that request), so content the agent keeps to
    itself never counts as seen. Entries stored from the model''s own response, and entries
    whose value has no such string, carry no label. Descriptions state what was stored,
    not whether the model saw it.'
  model_visible: 'What the model saw in its latest request: each message with its role
    and content, then the number of tool definitions. Before the first request: "The
    model has not seen anything yet."'
  highlight: Entries added and messages new since the previous step have the selection
    background; nothing else is marked.
  shown_when: The panel exists only for scenarios whose initial state has agent_state
    or model_visible_messages.
  provenance: 'Tool data and document evidence are told apart by a label at the start of
    their item, in weight 600, and by their place, never by colour alone; the label and the
    separator after it never break apart. In agent state an entry stored from a tool result or
    a tool message says "Tool data", and a non-empty list of retained chunks says "Document
    evidence". In the model-visible context a tool message says "Tool data · <tool> result",
    naming the tool of its tool call. A message carrying document blocks shows
    its own text first, then each block below it in prompt order as "Document evidence ·
    <document ID> v<version> · chunk <chunk ID>", followed by the block''s text. Other entries and messages carry no source
    label.'
compare_view:
  shown_in: The Compare tab (navigation.tab_contents), built from 06-comparison-scenarios.yaml compare.
  layout: 'The headline (at the Overview compare.overview_headline, which names no protocol), the
    shared control row (controls.row, with the shared slider and the
    compare step as its timeline), the semantic phase labels, then two panes: the left scenario
    (rag-query, headed RAG) and the right scenario (mcp-balance, headed MCP), side by side from 64rem
    and stacked below, left first. Then, from Architecture on (the aspects name the protocols), one
    row per entry of compare.aspects: its label in small ink-muted text beside its sentence, the label
    above the sentence below 48rem. Nothing makes the
    page scroll horizontally at any width; each diagram scrolls inside its own region, and below
    48rem Compare is one column of steps interleaved by semantic phase (phone_steps.compare).'
  pane: 'Each pane shows its scenario''s question, its position ("Step <k> of <n> · <scenario phase
    label>", at the Overview "Stage <s> of <m>", or "No stage in <phase> · <s> of <m> played" for a
    waiting pane) with its own step slider, over the stages at the Overview, the current event''s
    explanation with sender → receiver and operation (inspector.message_line; at the Overview the
    current stage''s sentence), its sequence diagram, and a link "Inspect step <k> in <tab>" (at the
    Overview "Inspect in <tab>", without a step number) to the scenario''s own route at that step and
    zoom level, where the inspector, the context panel and the
    RAG panels are. Compare has no inspector, panels or splitter of its own.'
  timeline: 'The shared timeline follows 06 semantic_phases in order. Compare step 0 is before any
    event, both panes at step 0. Each semantic phase then lasts as many compare steps as the pane with
    more events in it has: at its j-th step each pane is at its j-th event of that phase, or stays on
    its last event of the phase when it has no more, saying "Done with <phase>; <other pane>
    continues." A phase in which neither pane has events has no steps. A pane without events in the
    phase (counted at the default parameters) keeps its events so far but shows no position from an
    earlier phase: its position line reads "No step in <phase> · <k> of <n> played", its diagram marks
    no current step or group, and its placeholder (06 compare.placeholders, which the validators require
    for exactly these phases) replaces the message. Both panes therefore always show the same semantic
    phase. This needs each scenario''s events to visit the semantic phases in their order, which a unit
    test checks. At the Overview the panes step by stage: each stage counts as one event of the
    semantic phase of its first phase, and a pane rests at the last event of its stage, so the two
    stories run side by side stage by stage under the same rules and placeholders (for example MCP
    learns the bank''s actions while RAG shows "The documents were indexed earlier, in the RAG tab''s indexing scenario."). A stage can
    cover several semantic phases (the answer stage: context assembly, model generation and answer),
    so at the Overview a compare step is labelled with every semantic phase its panes'' stages cover,
    from the first to the last: the position line reads "Stage <s> of <m> · Context assembly to
    Answer", every covered phase of the phase line is in weight 600 and marked current, and the live
    region names the same range.'
  controls: 'One set of shared controls drives the timeline, in the order and form of controls.row:
    Reset, Previous step, Play or Pause, Next step, the play speed, the shared slider and the compare
    step, with the keys of controls.keyboard, under controls.action_rules (Play advances one compare
    step per interval). Next therefore steps whichever panes still have events in
    the current phase, and moves both to the next phase once neither has. A shared slider jumps to any
    compare step. A pane''s own slider moves that pane: the position becomes the first compare step at
    which that pane is at the chosen step, and the other pane follows to the same semantic phase.'
  phase_line: 'Above the panes, the compare step ("Step <s> of <m> · <phase label>", at the
    Overview "Stage <s> of <m> · <phase range>", in the control row) and below the row the semantic phase labels in order, the current one in weight 600 and marked as the current step for assistive
    technology; the others in ink-muted. Before step 1 no phase is current.'
  defaults: 'Both scenarios play at their default parameters; Compare offers no parameter controls.
    The zoom control in the control row sets both
    diagrams; the Overview is the default, so Compare starts with the two stories side by side.
    Zooming keeps the place of the first pane that has a step in the current semantic phase (the
    left unless it waits), mapped as in zoom_levels.cursor_mapping; the other pane follows to the
    same semantic phase, as with a pane''s own slider.'
  route: '#/compare/<compare id>/<compare step>[/architecture|/protocol], for example
    #/compare/compare-rag-mcp/12/architecture. The compare step counts the timeline of events at every
    level, as a scenario''s step counts events (navigation.routes): at the Overview the address holds
    the first compare step of events at which the leading pane (zoom_levels mapping above) is at the
    end of its current stage, and a step read from an address opens the Overview at the stage that
    holds the leading pane''s event there. An earlier address without a level, which meant
    Architecture, therefore opens the stage containing its step and is replaced with it
    (navigation.earlier_routes).
    Missing parts take defaults and a step beyond the timeline is clamped (navigation.routes); stepping
    replaces the history entry.'
  accessibility: 'Each pane is a region named by its tab label (RAG, MCP); each pane''s slider is
    labelled "<tab> step" with its position as value text. One polite live region announces the phase
    and both positions after each manual change of position while paused, and once when playback pauses
    or ends; it stays quiet while playing. For example "Information acquisition. RAG step 6 of 10. MCP
    step 14 of 28.", "Information acquisition. RAG step 6 of 10, done with this phase. MCP step 16 of
    28." or, for a pane with a placeholder, "Preparation. RAG: The documents were indexed earlier, in the RAG tab''s indexing scenario. MCP
    step 4 of 28." Controls keep focus while stepping.'
rag_controls:
  top_k:
    min: 1
    max: 8
    default: 5
  similarity_threshold:
    min: 0
    max: 1
    step: 0.01
    default: 0.7
  reranking:
    default: false
  keyword_retrieval:
    default: false
  fetch_full_documents:
    default: false
  chunk_size_words:
    options:
    - 25
    - 50
    - 100
    default: 50
  overlap_words:
    options:
    - 0
    - 10
    - 20
    default: 10
  placement: 'A row of labelled option groups below the playback controls, shown from step
    0 in the scenarios that have the parameters (chunk size and overlap in rag-index; top K,
    threshold, reranking, keyword retrieval and fetch full documents in rag-query). A change recomputes the derived events at once (controls.action_rules.parameter_change);
    the values are not part of the route and return to their defaults with a new scenario.'
  control_kinds: 'Options (chunk size, overlap) and top K are groups of pressed buttons, one
    per value (top K 1 to 8). The threshold is a slider from min to max in steps of 0.01
    whose value is shown beside it with 2 decimals (Python rounding, as 05 writes thresholds).
    Reranking, keyword retrieval and fetch full documents are toggle buttons (pressed when on).
    Each control keeps keyboard focus while the scenario recomputes; the slider moves with
    the arrow keys, which then do not step the scenario (controls.keyboard_scope).'
rag_ingestion:
  shown_in: rag-index, below the diagram and inspector, from the step that returns the chunks (index-05);
    its chunk IDs and vectors are read from the played index-05 and index-07 events, so the
    screen always equals them.
  layout: 'Three columns from 64rem, stacked below: the source document (chosen with a
    Document menu), its chunks, and the selected chunk. The first chunk is selected at start;
    after a parameter change the selection moves to the chunk of the same document that holds
    the previously selected chunk''s first word.'
  overlap: 'The words the selected chunk shares with its previous and its next chunk are
    set in weight 600 in place: in the document, in the selected chunk''s text and in the
    neighbour''s text. One line beside the chunk list states each shared range in words, for
    example "Words 40–49 are also in everyday-account@1.2-c50o10-002.", so overlap depends
    neither on colour nor on weight alone. The selected chunk''s words in the document and its
    entry in the list have the selection background and an ink underline.'
  focus: When the panel disappears (stepping back before index-05) while it holds focus, focus
    moves to the step slider.
  chunk: 'The selected chunk''s metadata (the record fields of index-08 plus its chunk ID
    and word count), then, from index-07 on, one row per named dimension: the lexicon words
    found with their counts, the sum before normalizing (0.1 plus their weights), and the
    value; below them, the length of the vector of sums that each sum is divided by. Before
    index-07 it names the step that computes the vector.'
  embedding_note: Above the vector, the principle of 05-rag-scenarios.yaml that the demo
    embedding stands in for a learned model, as written there (two plain sentences).
rag_retrieval:
  shown_in: 'Scenarios that derive retrieve-12, the answer (rag-query; the
    Combined scenario derives only retrieve-05 and retrieve-06 and has no panel), below the
    diagram and inspector, from the step that returns the scored chunks (retrieve-05). Scores, the
    threshold, the selection, the prompt and the answer are read from the played events
    (retrieve-03, retrieve-05, hybrid-02, hybrid-03, retrieve-06, retrieve-09, retrieve-10,
    retrieve-12), so the screen always equals them and shows nothing a later step decides;
    chunk text and vectors come from the index the scenario searches (05
    derived_event_rules.inputs at the current parameters), as retrieve-05''s technical note
    says.'
  sections: The scores, then the projection, then the prompt, then the answer, stacked so
    each chart has the full width at its real text size. A section appears from the step
    that produces its content; until then it is absent, not empty.
  scores: 'A dot plot (labels_and_charts): one row per chunk in retrieve-05''s order, labelled
    with its chunk ID, its dot at the cosine score on a 0–1 track at least 12rem wide with the
    score written beside it (4 decimals), on the side away from the threshold so the line stays
    continuous. From retrieve-06 the threshold is one vertical line labelled "threshold
    <value>" (2 decimals) and each row states its outcome in words: "retained, rank <n>" (the
    order in which the prompt carries it) or retrieve-06''s discard reason; retained dots are
    filled in the accent, the others hollow. Before retrieve-06 a line names the step that
    applies top K and the threshold. Once hybrid-02 is reached each hit shows its keyword
    score, and once hybrid-03 is reached each candidate shows its reranker score. With reranking (retrieve-06 rerank),
    one sentence below says that the <k> best by reranker score are retained, so a retained
    chunk can score lower than a dropped one. The outcome wraps within its column; no text
    leaves its column. The threshold''s label keeps clear of the top end of its line.'
  projection: 'A plain scatter plot of 05 fixtures.projection_2d (x = cost − rules, y = product
    − technical, both from −1 to 1, equal scales): the axes are named by meaning at their
    ends (rules ← → cost, technical ↓ ↑ product), every chunk point and the question''s point
    (retrieve-03) are labelled directly (in the compact form below, only the question''s
    point), and retained points are filled in the accent. At rag-query''s chunking (05
    derived_event_rules.inputs) no two chunks share a vector, so every point has its own
    label. A label sits right or left of its point; where it would overlap another label,
    a point, the question''s mark, an axis, an axis name or a leader line, it moves up or down
    by a line, nearest first, beside a leader line kept as short as that allows: of the
    candidate layouts in which every label fits (several horizontal positions of the plot and
    orders of placement), the one whose leaders are shortest is drawn. A leader line crosses
    no label, point, axis name or other leader line. The plot keeps a side of at least 260
    px and only the room its outermost labels need on each side. Each point is exposed to
    assistive technology as an image named by its chunk ID, coordinates and whether it is
    retained. One sentence below states that the projection is fixed and conceptual and that
    scores are computed in all dimensions. The plot fits the available width with text at its
    real size. Where no layout with a side of at least 260 px places every label within the
    width (phones, below 768 px), the plot takes a compact form instead of scrolling: the
    square plot at the available width (side at most 360 px) with its axes, their names and
    every point marked as above, only the question labelled at its point; then, below it, a
    list of the chunk points in score order, each with its label, its
    position named by the axes with 2 decimals (for example "everyday-account@1.2 · 001: rules
    0.31, product 0.62"; a coordinate that rounds to 0.00 is written "on the rules–cost axis"
    or "on the technical–product axis" instead of a value) and "retained" in words when it
    is. Each line is a toggle button (pressed: weight 600) that marks its point on the plot
    with an ink ring; tapping a point presses its line, and one line is pressed at a time. In the compact form the list carries the points
    for assistive technology and the plot is hidden from it, so nothing is announced twice.
    The compact form shows where the retained chunks lie relative to the question; the list
    names every point without a key.'
  prompt: 'From retrieve-09, "Prompt before and after retrieval": retrieve-09 prompt_before
    and retrieve-09 prompt_after filled in (its system message, and its user_template with
    the question and one document block per item of its document_blocks and retrievedText,
    written as retrieve-10 writes them) side by side (two columns from 64rem, stacked
    below), each message with its role. Until retrieve-10 a line says the prompt is assembled
    and the model has not seen it; from retrieve-10 it names the step that sent it. Each
    document block is set apart with its ID, version, chunk and trust.'
  answer: 'From retrieve-12, the answer (labelled simulated, learning.simulated_behaviour) with
    each [n] as a button that never breaks from the punctuation after it, then the source
    lines exactly as 05 answer_rules writes them. A citation opens its evidence below the
    answer, next to the source document: the document''s normalized text with the chunk''s
    words marked with the selection background and an ink underline, beside the chunk''s text
    and metadata; a parent document (fetch_full_documents) opens as the whole document. One
    citation is open at a time; activating it again closes it. The open citation is pressed
    and keeps focus while the panel rebuilds; a citation that no longer exists after a
    parameter change closes.'
  focus: When the panel rebuilds while it holds focus, focus stays on the same control or,
    if that control is gone, moves to the panel's heading. When the panel disappears
    (stepping back before retrieve-05) while it holds focus, focus moves to the step slider,
    as in rag_ingestion.
combined_answer:
  shown_in: 'The Combined scenario, below the diagram and inspector, from the step that
    displays the answer (c-08); absent before. The answer and its sources are read from the
    played c-08, the balance from the played tools/call result (mcp-23) and chunk text from the
    index the scenario searches, so the screen always equals the events.'
  title: Where each part of the answer comes from
  statements: 'The answer, labelled simulated (learning.simulated_behaviour), as its statements
    in answer order, each with its source as a label in a column of its own to the left (above
    the statement below 64rem), so label and position carry the provenance and colour does not.
    The statements are the parts the engine composes the answer from (06
    answer_composition.rule, 05 answer_rules), recomputed for the scenario as its derived events
    are, never found by parsing the text: "Tool data · MCP" for an intro sentence whose source
    is tool, "Session context" for one whose source is session, "Document evidence · RAG" for
    each group sentence, "Not in the evidence" for the sentence naming the unsupported aspects,
    and "Comparison" for the comparison sentence. Joined by single spaces, the
    statements are exactly the answer of c-08; where they are not, the answer is shown as one
    unlabelled statement.'
  links: 'The balance in the tool statement is a button that opens the tool result below the
    statements: the tool and its arguments (the tools/call request), the result''s
    structuredContent, the step of the tools/call result as a jump link, and the step of the
    first model request that contains the result. Each [n] is a citation button that opens its
    chunk next to its source document, as rag_retrieval.answer does, and never breaks from the
    punctuation after it. One of them is open at a time; activating it again closes it; the open
    one is pressed and keeps focus while the panel rebuilds.'
  sources: 'Below the statements the sources, in the order of the statements: "Tool data" with
    "<tool> result, returned at step <n>" (a jump link), then "Documents" with the source lines
    exactly as 05 answer_rules writes them.'
  focus: As rag_retrieval.focus, with this panel's heading and the step slider.
accessibility:
- Keyboard operable controls
- Visible focus
- Semantic labels
- Reduced-motion preference
- Readable code at 200% zoom
