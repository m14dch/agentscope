product: AgentScope
spec_version: 3.0.0
design:
  sources:
  - specifications/design-handover.md (Principiae decides how information is communicated;
    Sanzo Wada No. 303 decides how it looks)
  - Jean-luc Doumont, Trees, maps, and theorems (summaries at https://principiae.be/X0100.php#Summaries)
  - Swiss Style (International Typographic Style)
  handover_decisions:
  - Palette is Sanzo Wada No. 303 with the handover's supporting colours, plus one derived
    ink-muted and one darker peach for small text, both needed for contrast.
  - Diagrams sit on the light reading surface; the dark olive surface is not used (owner
    decision), so one set of colour rules applies everywhere.
  - Peach Red marks the current step (one exception, retained chunks in the retrieval
    charts, is recorded in the decision "Retained chunks keep the accent in the score plot and the
    projection (issue 15)" below);
    Naples Yellow marks what the learner selected or tracks. Error red is close to Peach Red in hue, so errors always carry a × and a text
    label naming the kind.
  - The RAG question changes to the handover's question and the communication layer
    (learning questions, takeaways, prediction prompts) was added to the scenario data
    (issue 22).
  - Self-hosted fonts stay because the app must work offline; no other dependency is
    added for the design.
  - Supporting colours are introduced only when a need appears (handover 4.1). White
    reading surfaces, information and success are not used yet; white on cream (1.05:1)
    would add a near-invisible box that carries no information.
  - The approved silver-reticle wordmark and its favicon of issue 38 are the only brand
    marks. They are fixed images in public/brand/ and keep their own colours; they are not
    recoloured to the tokens, and their colours are not used anywhere else. The app is
    light only, so the header uses the light variant; the dark variant ships for a dark
    background but is not shown.
  - 'Retained chunks keep the accent in the score plot and the projection (issue 15),
    although handover 4.2 reserves Peach Red for the current step: inside a retrieval chart
    the retained chunks are what to look at now. The charts sit below the timeline, apart from
    the diagram''s current arrow and the current group''s accent bar above it, and they show
    the outcome of the current step itself (the selection made at the step that applies top K
    and the threshold), so the accent in both places points at the same thing. The accent is never the only
    signal there: retained points are filled and their rows say "retained" with the rank in
    words. Nothing is retained, and nothing is in the accent, before the step that applies
    top K and the threshold. A lineage selection marks a chunk''s label with the selection
    background and ink underline, never its dot, so no accent mark sits on selection.'
  governing_rule: Maximise the signal-to-noise ratio. Viewers already process protocols,
    payloads, context and trust boundaries; anything that carries no information is
    noise and is removed.
  removal_test: For every line, box, colour, label, icon, animation and word, ask what
    the viewer loses if it disappears. If nothing, remove it. Prefer whitespace and
    position to borders and boxes.
  supporting_laws:
  - 'Adapt to the audience: experienced engineers get exact payloads and precise terms,
    without decoration.'
  - 'Use effective redundancy: state each step''s message in words and show it in the
    diagram. Colour is never the only carrier of meaning.'
  grid: 12 columns on an 8 px baseline. Flush-left, ragged-right, asymmetric. Diagram
    and inspector share alignment lines. Side margin 16 px on phones, 24 px on tablets,
    48 px on desktops; gutter 16 px, 24 px from tablet width.
  typography:
    text: Inter (variable, self-hosted, OFL), Latin subset
    code: JetBrains Mono (variable, self-hosted, OFL), Latin subset
    sizes: 'Three only: small 13/16 px for labels and metadata, text 16/24 px, title
      24/32 px. At most two per region.'
    weights: 400 and 600 only
    hierarchy: Size, weight and position; never colour alone
    figures: Tabular figures for numbers; numbers right-aligned in tables
  colour:
    tokens:
      paper: '#fff9ea'
      ink: '#253122'
      ink-muted: '#5c6658'
      rule: '#b6bfc1'
      accent: '#f15a30'
      accent-text: '#bc4625'
      selection: '#fbe6a0'
      error: '#b73535'
    names:
      paper: Cream (supporting)
      ink: Deep Slate Olive (Wada 303)
      ink-muted: Derived from Deep Slate Olive for secondary text
      rule: Neutral Gray (Wada 303)
      accent: Peach Red (Wada 303)
      accent-text: Darker Peach Red for small text
      selection: Naples Yellow (Wada 303)
      error: Error (supporting)
    use:
    - Paper (cream) is the page and the reading surface.
    - Ink carries text and data. Ink-muted carries secondary text and past-step labels.
      Rule (Neutral Gray) carries structure only (lifelines, axes, separators), never
      text or meaning.
    - 'Accent (Peach Red) marks what to look at now: the current step and its pair, and
      retained chunks. It is used for lines and marks; text in that role uses accent-text.'
    - Selection (Naples Yellow) is a background for what the learner selected or tracks,
      such as lineage values, always together with an ink underline so the mark does not
      depend on colour. Never put accent marks on selection.
    - Error is used only for errors, always with a × and a text label naming the kind.
    - No other colour values exist outside the tokens, and no large saturated areas. The
      only exception is the approved brand images (layout brand); their colours stay inside
      those image files and never appear in styles, scripts or markup.
    - 'Contrast on paper: ink, ink-muted, accent-text and error reach 4.5:1; accent reaches
      3:1 for marks. Ink on selection reaches 4.5:1.'
    - Enforcement - the source is scanned for hex values and colour functions outside the
      tokens, and a browser test checks every computed colour on rendered pages (default,
      focused and selected states, pseudo-elements and SVG gradient stops) is a token or
      transparent, none or a context paint, and that no shadow or gradient is used. The
      source scan skips exactly public/brand/agentscope-silver-light.svg,
      agentscope-silver-dark.svg and agentscope-silver-favicon.svg; the browser test needs no
      exception, because an image's own colours are not computed CSS colours.
    - No shadows, gradients, rounded cards, decorative icons, logos or background textures,
      apart from the one wordmark and favicon of layout brand.
      Light theme only in v1.
  labels_and_charts:
  - Label data directly next to what it names; no legends.
  - 'Underlines have two meanings only: solid ink on Naples Yellow marks a tracked or
    selected value; dotted ink-muted marks a control that folds or expands content.'
  - Every arrow carries a short text label (for example "MCP · tools/call").
  - Scores are dots on a 0–1 scale with the threshold as one labelled line; retained
    chunks use the accent, filled, and say "retained" in words (handover_decisions). No
    bars from an arbitrary origin; no gridlines unless they answer a question.
  - The 2D projection is a plain scatter plot with points labelled directly and axes
    named by meaning; on phones, where the labels cannot fit, its compact form names the
    points in a list tied to the plot (rag_retrieval.projection).
  - Charts fit the available width with text at its real size. Only sequence diagrams
    keep a fixed scale and scroll horizontally, from 48rem (768 px) up where they do not
    fit; below 48rem they become the step list (diagram.phone_list), and the RAG projection
    takes its compact form (rag_retrieval.projection), so nothing scrolls horizontally on
    a phone.
  - Figures expose their text to assistive technology; scrollable regions are named
    and keyboard-focusable.
  motion: Motion only shows causality (an arrow draws from sender to receiver). Nothing
    else animates; with reduced motion nothing animates.
  writing:
  - Each step's explanation is the message, one sentence, shown first; details on demand.
  - Titles are messages or plain nouns, never filler such as "Overview" or "Details".
  - 'Structure stays shallow and narrow: at most 3 levels and 5 items per level.'
  specimen: 'The route #/design shows type, colours, each arrow kind, a payload block
    and a score plot, so the system can be reviewed on the live site. It is not linked
    from the app.'
navigation:
  tabs:
  - MCP
  - RAG
  - Compare
  - Combined
  default: MCP
  tab_contents:
    MCP: 04-mcp-scenarios.yaml scenarios, then its variants
    RAG: 05-rag-scenarios.yaml rag-query, rag-index, then its variants
    Compare: 06-comparison-scenarios.yaml compare
    Combined: 06-comparison-scenarios.yaml combined, then its variants
  routes: '#/<tab>/<scenario>/<step>, with /protocol appended in protocol mode (for example
    #/mcp/mcp-balance/14/protocol). Missing parts take defaults: the tab''s first scenario,
    step 0, architecture mode. A step beyond the scenario is clamped. An unknown tab or
    scenario shows an error naming it, with a link to the tab. Stepping replaces the
    history entry; changing tab or scenario adds one. Parameters are not part of the route,
    so a step number refers to the events played at the scenario''s default parameters.'
  route_steps: 'While the parameters differ from the defaults, the address shows the step at
    which the current event is played at the defaults; if it is not played there, the step of
    the nearest earlier current event that is, else 0. A step read from the address names the
    event played at that step at the defaults; the cursor goes to that event, or if it is not
    played now to the nearest earlier default event that is, else to 0.'
  scenario_picker: One menu per tab listing its scenarios by title; each variant shows
    its lesson on a second line. The current scenario is marked.
layout:
  desktop:
  - 'Top bar: navigation, scenario, architecture/protocol toggle'
  - 'Main: resizable sequence diagram + payload inspector'
  - 'Bottom: execution timeline + a collapsible model-context panel, collapsed at start,
    in rag-index the ingestion panel (rag_ingestion), in rag-query and its variants the
    retrieval panel (rag_retrieval), in rag-stale and rag-conflict, the version panel
    (rag_controls.version_panel) and, in the Combined scenario and its variants, the answer''s
    provenance (combined_answer). Lineage lives in the inspector''s
    Lineage tab and in the diagram (lineage_selection), not in a panel of its own'
  - 'Header: one persistent statement that everything is simulated and nothing leaves
    the browser'
  - 'Above the diagram: the scenario''s learning question and headline'
  - Bottom panels appear only once they have content; until then only the timeline shows
  brand: 'The header starts with the wordmark (public/brand/agentscope-silver-light.svg, the
    variant for the light paper; light theme only) as the page''s level-1 heading, an image
    with the text alternative "AgentScope" that links to #/. It is 40 px high (five baseline
    units; 32 px, four units, on phones, layout.phone), its badge flush with the left alignment line and the baseline of its lettering
    on the baseline of the header row, so it does not crowd the tabs, the controls or the
    simulated statement. index.html declares agentscope-silver-favicon.svg as an
    image/svg+xml icon. Both URLs resolve against the base path, are served from the app''s
    own files and are precached like every other file of the build.'
  offline_indicator: 'After the service worker has cached the build and activated (01-architecture.yaml
    deployment offline_mechanics readiness), the header''s simulated statement ends with "Available
    offline." in the same small ink-muted text. Nothing is shown before that, nor where no service
    worker runs (the development server, insecure origins); there is no progress or error message.'
  tablet: Stack inspector below horizontally scrollable diagram
  breakpoint: Side by side from 64rem; stacked below; the phone layout below 48rem
  phone:
    breakpoint: Below 48rem (768 px), which includes a desktop browser zoomed to 200%; from
      48rem the tablet and desktop layouts apply unchanged.
    principle: One column that reads top to bottom. Nothing scrolls horizontally, on the
      page or inside any region, in any tab, scenario, mode or panel, from 360 px wide.
    header: 'The wordmark (32 px high), then on its row a disclosure "Menu" (dotted underline
      like every fold); below them the tabs and the simulated statement, always visible.
      The menu holds the scenario picker''s list of scenarios (shown in place, without the
      picker''s own fold), the architecture/protocol switch, the speeds, Start and Reset, each
      group labelled in small ink-muted text. These controls move into the menu; none is
      duplicated. It opens below the wordmark row and pushes the page down; it closes on
      Escape anywhere on the page while it is open (focus returns to it), a pointer press
      outside it, a scenario choice or a change of view (focus returns to it).'
    controls: 'A bar fixed to the bottom edge of the screen, within thumb reach: the position
      ("Step <k> of <n> · <phase>", the line the timeline shows from 48rem), then Previous,
      Play or Pause and Next side by side in equal widths. It stays in place while the page
      scrolls; the page ends with room for it (and for the safe area at the screen''s bottom
      edge), and focused elements scroll clear of it. In
      Compare it holds the compare step and the shared Previous, Play or Pause and Next. The
      step sliders stay where they are.'
    touch_targets: 'Every control outside running text (buttons, tabs, the menu and its
      entries, toggles, sliders) is at least 44 × 44 px. Links and buttons inside a sentence
      (citations, step links, the lineage jumps) and folds inside code are exempt, as in WCAG
      2.5.8.'
    presentation: The diagram region shows the step list (diagram.phone_list) and scrolls
      vertically only; it is 30% of the screen's height (at least 9rem), so the stepping area
      (the step list, then the prediction prompt, the message line and the error line below
      it) fits above the bottom bar.
    stepping_area: 'After a change of step or of the prediction prompt (not a parameter
      change, a lineage selection or a fold), if the step list''s region does not start inside
      the screen or the last of the prompt, the message line and the error line ends below the
      top of the bottom bar, the page scrolls at once (no animation) so the region starts 8 px
      below the top of the screen, as far as the page can scroll. The current row or group is
      then in view inside the region, whose list scrolls at once too
      (diagram.auto_scroll_to_current), so the learner sees the current step, any prediction
      prompt and the message without scrolling. An explicit step action (Next, Previous,
      Continue, Play or Pause, Start, Reset, the keys, a step slider or a jump link) always
      does this, even when the learner had scrolled down to read the payload: it brings the
      stepping area back. A step made by Play does it only while the learner has not scrolled
      the page since the last explicit step action. A scroll of the page counts as the
      learner''s only when it follows their input within a second (a wheel, a touch that moves, a
      scrolling key that nothing else handled, or a press on the scrollbar); scrolls the browser
      makes by itself (scroll anchoring, clamping when content shrinks) and the page''s own
      jumps never count. Once the learner scrolls during Play, its steps leave the page where it
      is until the next explicit step action. In Compare, after a change of compare step the
      same rules bring the panes whose step changed on screen above the bar: when both panes
      changed and their current rows fit on screen together, both current rows; otherwise the
      lower changed pane''s message and current row, its message starting 8 px below the top
      of the screen when it is above it, else its current row ending 8 px above the bar. A pane
      that waits through a phase or is done with it did not change. This is the only case in
      which the page scrolls by itself (modes.scrolling).'
    inspector: 'Below the diagram region, in this order: the prediction prompt when shown
      (learning.prediction), the message line and the error line, always visible; then a
      toggle "Step details" (aria-expanded, dotted underline) over the tabs, collapsed at
      start and kept as the learner left it while stepping. Long values and code wrap; no
      tab scrolls sideways.'
    panels: Every panel below the timeline stacks into one column; the projection takes its
      compact form (rag_retrieval.projection).
    input: Nothing depends on hover. Focus, the keys of controls.keyboard and the focus
      order work as on desktop, for a learner with a hardware keyboard.
  splitter: The boundary between diagram and inspector is a separator that resizes them
    by pointer drag or, when focused, the arrow keys; the inspector keeps 20rem to 60% of
    the width
  timeline: A step slider from 0 to the number of steps, labelled with the step and its
    phase
  minimum_lifeline_width_px: 110
diagram:
  participants: Scenario-defined and ordered; labels from the participant registry
    (01-architecture.yaml)
  arrows: One per actual logical message or explicitly labeled internal operation
  encoding:
    principle: Protocol is shown by the arrow's text label and line style, not by hue.
    network: solid ink line, 1.5 px
    in_process: thin solid ink-muted line, 1 px
    simulated_internal: dashed ink-muted line, 1 px (4 px dash, 3 px gap)
    request: filled arrowhead
    response: open arrowhead
    current_and_pair: accent line, 2 px, and the label in weight 600, so the current step
      stays distinct in greyscale
    error: error line; the label starts with × and names the kind from error_events
  labels: 'Each arrow carries its operation as a direct text label, prefixed with the
    protocol for messages that cross a protocol boundary: MCP, HTTP, LLM API and DB (for
    example MCP · tools/call). The prefix is left out when the operation already starts
    with it (HTTP 200 OK). In-process, RAG-internal and UI steps show the operation only.'
  layout:
    lifeline_spacing: At least 110 px; wider gaps only where an arrow label needs the room,
      up to 240 px. From 48rem, where it does not fit, the diagram scrolls horizontally;
      below 48rem it is the step list (phone_list).
    rows: One row per event in order, so labels never share a row. The label sits above
      its arrow, starting at the arrow's left end; a label longer than its arrow extends
      to the right and the diagram widens to fit it.
    self_arrows: An event whose sender is its receiver loops to the right of its lifeline,
      with the label to the right of the loop.
    participant_labels: Registry labels at the top of each lifeline, wrapped to the lifeline
      spacing. While the diagram region scrolls vertically they stay at its top on a paper band
      that hides what passes beneath, so every lifeline stays named; they scroll horizontally
      with their lifelines, and the current step is scrolled clear of them. They come before
      the diagram in reading order, so assistive technology meets them before the steps.
  visibility:
    past: line keeps its kind's style; label in ink-muted
    current: emphasized
    future: hidden in protocol mode; rows keep their space so the layout does not move
      as the cursor advances
  phone_list: 'Below 48rem (layout.phone) the diagram is a one-dimensional list in the same
    region, from the same events, visibility, marks and expanded groups as the diagram.
    Protocol mode lists each reached event in order (future steps are not listed, so the
    current step is the last row): its step number in small ink-muted text, its arrow label
    (labels, error_events), and below it the sender and the receiver by registry label,
    joined by a short arrow 32 px long drawn with the event''s encoding (line kind, filled or
    open head, the accent for the current step and its pair, the error colour for an error).
    A self-call names its participant once, followed by a short loop. Each row names its two
    participants, so there are no lifelines and no participant header. Architecture mode
    stacks the groups of modes.architecture_groups as flat sections in order, separated by a
    hairline rule, with no frame: each section is one full-width button with the takeaway,
    then the caption below it; the current group has a 3 px accent bar along its left edge
    and its takeaway in weight 600; an expanded group lists its reached events below its
    button, as protocol mode does. A selected lineage value marks a row''s label, or a
    collapsed group''s caption, as in the diagram. The region scrolls vertically only and
    keeps the current row or group in view (auto_scroll_to_current, modes.scrolling).'
  pair_highlighting: true
  auto_scroll_to_current: Keep the current step (or current group) in view; scroll
    smoothly, or instantly with reduced motion and in the step list of phones
    (layout.phone.stepping_area)
  accessible_without_color: true
  rendering: SVG lifelines, arrows and labels generated from ordered event data. The
    header states once that everything is simulated; arrows carry no per-arrow simulation
    label.
  error_events: 'An error arrow marks where a failure occurs on the wire, with its kind
    from 07-security-protocols.yaml error_taxonomy: protocol error when the payload is a
    JSON-RPC response with an error object; tool execution error when an MCP result has
    isError true; transport error for any other HTTP response with status 4xx or 5xx;
    model error for an LLM API response with status 4xx or 5xx. The label reads × <kind>
    error · <operation>. Steps that only hand the failure on inside the agent are not
    error arrows; their explanation says what happens.'

modes:
  architecture: 'Conceptual level: collapse each scenario phase into one expandable group
    headed by its takeaway (the phase label is secondary). Shows the learning question,
    the headline and plain explanations.'
  architecture_groups: 'Groups follow the events in order: one group per consecutive run
    of a phase''s events, so a phase that resumes after another (the MCP tool call around
    its backend call) appears again, captioned as continued and without repeating its
    takeaway. A phase without events has no group. A group spans at least the lifelines
    its events touch and widens only to fit its takeaway. The group holding the current
    step is the current group: an accent bar and its takeaway in weight 600. A group whose
    reached events include an error adds × and the error kind to its caption, in the error
    colour. A group expands or collapses on click, Enter or Space; expanded, it shows its
    events up to the cursor with protocol-mode styling. Expansion is kept while the learner
    steps through the scenario. Lifelines pass under a group''s takeaway and caption, not
    through them.'
  scrolling: Only a cursor change or a mode switch scrolls, and only the diagram's own
    scroll region, never the page (on phones the page also scrolls to keep the stepping area
    in view, layout.phone.stepping_area); toggling a group or laying out again keeps the scroll
    position. It scrolls only as far as needed to bring the current step or group into view,
    horizontally never past its left edge, so an arrow that fits keeps both its sender and
    its receiver in view. Keyboard focus stays on the same group or region across steps. Arrow
    keys scroll the diagram region while it has focus.
  protocol: 'Technical level: show all individual events with exact logical messages;
    the inspector holds payloads, boundaries and errors.'
  default_mode: architecture
  switch_preserves_position: true
learning:
  interaction: 'Each scenario follows the handover''s pattern (6.1): show the learning
    question and headline, the participants, an optional prediction, one step, the highlighted
    interaction, its message, then the technical details on demand.'
  prediction: When the next event carries a prediction prompt, show the prompt before
    the step runs, together with a Continue control. The step itself answers it; nothing
    is scored and the prompt never blocks keyboard navigation.
  prediction_rules: Next (button or →) on a step whose next event has a prediction shows
    the prompt instead of advancing; Next or Continue then runs the step. Play pauses
    there and shows the prompt. Previous, jump, start and reset never show a prompt.
  simulated_behaviour: Model output is labelled as simulated wherever it appears; nothing
    suggests a live decision. The explanation of every response the model sends (LLM API
    responses from the LLM provider, tool-call requests included) starts with "Simulated model
    output".
controls:
  actions:
  - start
  - next
  - previous
  - play
  - pause
  - reset
  - jump_to_step
  action_rules:
    start: Go to the first step; playback keeps its status
    reset: Return to the initial state before any step and pause
    previous: Recompute the previous snapshot; never undo side effects
    play: Advance one step per interval until the last step, then pause
    manual_navigation: Next, previous, start and jump keep playback running and restart
      the interval
    parameter_change: The cursor stays on the same event if that event is still played;
      otherwise it moves to the nearest earlier event that is still played, or to 0. Optional
      steps that a parameter adds or removes before the cursor therefore change the step
      number, not the event
  step_interval_ms: 1500
  step_interval_rule: At speed s, one step every step_interval_ms / s milliseconds; reduced
    motion keeps the interval and removes animated transitions
  speeds:
  - 0.5
  - 1
  - 2
  - 4
  keyboard:
    ArrowRight: next
    ArrowLeft: previous
    Space: toggle play/pause
  keyboard_scope: The keys act anywhere on the page except where focus needs them itself
    (Space on buttons, links and menus; the arrow keys on text fields, the step slider,
    the splitter, the inspector tabs and the diagram's scroll region)
  reduced_motion: true
inspector:
  message_line: Always visible above the tabs. The event's explanation, then sender →
    receiver and operation. Replaces separate Overview and Explanation tabs.
  error_line: 'On a step that is an error arrow (diagram.error_events), one more line follows
    the message line: × and the kind in the error colour and weight 600 (for example "×
    tool execution error"), then that kind''s definition from 07-security-protocols.yaml
    error_taxonomy in ink. The sender → receiver line then shows the operation without
    the error mark, so the kind is stated once. Steps that only hand a failure on carry
    no error line.'
  earlier_revision: 'On a server/discover request the Payload tab ends with a collapsed
    control, "Compare with the initialize handshake of revision 2025-11-25", underlined
    dotted like other folds. Opened, it shows the summary and each message of 04-mcp-scenarios.yaml
    protocol.earlier_revision_handshake (sender → receiver, operation, request or status
    line, headers, payload), each labelled with that revision. It starts collapsed and
    is the only place the earlier messages are shown.'
  tabs:
  - Payload
  - Transport
  - Security
  - Lineage
  empty_tabs: Hidden when the step has nothing for them (for example Transport on
    in-process calls)
  simulation_note: One line on illustrated network exchanges stating that the exchange
    is simulated
  payload_features:
  - syntax highlighting
  - copy
  - expand/collapse JSON
  - correlated request/response
  - repeated boilerplate (jsonrpc, _meta, repeated headers) folded to one line that
    expands on click; never hidden
  - fields that changed or that lineage tracks are highlighted with the selection background
    and an ink underline
  transport_tab: Show simulated wire envelopes separately from logical payloads, including
    the MCP headers mirrored from the body (MCP-Protocol-Version, Mcp-Method, Mcp-Name).
    In-process calls have no transport envelope.
  security_tab: Lists the event's security_boundaries with risk and mitigation from
    07-security-protocols.yaml.
  lineage_tab: 'Lists the event''s tracked_values: each key once, with its value or values,
    each followed by its occurrences (lineage_selection.occurrences) and a toggle that
    selects it.'
  tab_rules: The tabs follow the ARIA tabs pattern (arrow keys move between tabs while
    one has focus). The chosen tab stays chosen while stepping as long as the step has
    content for it; otherwise the first tab with content shows. A step with no content
    for any tab shows the message line only. The inspector is rebuilt only when the step
    changes; then focus stays on the equivalent control (the same tab, fold or button).
  syntax: 'JSON without hue: keys and punctuation in ink-muted, values in ink, so the
    data reads first. Long values wrap; code never needs horizontal scrolling at 200%
    zoom.'
  folding: 'Objects and arrays expand and collapse; all start expanded except folded
    boilerplate: the top-level jsonrpc member and every _meta member of MCP messages, folded to one line naming
    them, and in Transport the headers identical to those of the previous network request
    from the same sender, folded to one line counting them.'
  changed_fields: On an LLM request, the messages and fields that the previous LLM request
    of the scenario did not have are highlighted; on other events nothing is marked as
    changed. Leaf values equal to one of the event's tracked values are highlighted the
    same way.
  redaction: Values containing <REDACTED…> are shown as stored, followed by the label
    redacted.
  pair_link: A request links to its response and a response to its request by step
    number; the link jumps there.
  technical_notes: Shown below the payload, only when present.
  copy: Copies the payload as formatted JSON.
context_panel:
  layout: Agent state and model-visible context side by side; only the change since
    the previous step is highlighted, in place
  rule: Tool results and retrieved text are not model-visible until a subsequent model
    request includes them
  agent_state: 'The agent''s working memory as a list, oldest first: each entry''s step,
    description and value. An entry stays labelled "not yet seen by the model" until an
    LLM request after the step that stored it contains its value (any string of eight or
    more characters in the value appears in that request), so content the agent keeps to
    itself never counts as seen. Entries stored from the model''s own response, and entries
    whose value has no such string, carry no label. Descriptions state what was stored,
    not whether the model saw it.'
  model_visible: 'What the model saw in its latest request: each message with its role
    and content, then the number of tool definitions. Before the first request: "The
    model has not seen anything yet."'
  highlight: Entries added and messages new since the previous step have the selection
    background; nothing else is marked.
  shown_when: The panel exists only for scenarios whose initial state has agent_state
    or model_visible_messages.
  provenance: 'Tool data and document evidence are told apart by a label at the start of
    their item, in weight 600, and by their place, never by colour alone; the label and the
    separator after it never break apart. In agent state an entry stored from a tool result or
    a tool message says "Tool data", and a non-empty list of retained chunks says "Document
    evidence". In the model-visible context a tool message says "Tool data · <tool> result",
    naming the tool of its tool call. The outcome of the MCP tools/call that produced it
    qualifies both: a result with isError true is "Tool data · error result" in agent state
    and "Tool data · <tool> error result" in the context, still data from the tool; a call that
    failed at the protocol level (a JSON-RPC error response, such as an unknown tool) returned
    no tool data and says "Tool call failed" in agent state and "Tool call failed · <tool>" in
    the context. A message carrying document blocks shows
    its own text first, then each block below it in prompt order as "Document evidence ·
    <document ID> v<version> · chunk <chunk ID>" (with "· untrusted" for an untrusted
    document), followed by the block''s text. Other entries and messages carry no source
    label.'
lineage_selection:
  select: 'In the Lineage tab each tracked value can be selected (a toggle button); one
    value at a time. Escape or selecting it again clears the selection. It stays while
    stepping through the scenario and is cleared when the scenario changes.'
  diagram: Every reached step whose tracked_values include the selected value gets the
    selection background behind its label and an ink underline, in both modes; a
    collapsed group containing such a step shows the mark on its caption.
  payload: With a selection, only fields equal to the selected value are highlighted;
    without one, all of the step's tracked values are.
  occurrences: The Lineage tab lists, for each value, the step where it first appeared
    and the later steps up to the current one as jump links, at most five, followed by
    how many more there are; selecting the value marks every one of them in the diagram,
    so a long list adds no information. Steps after the current one are not revealed.
compare_view:
  shown_in: The Compare tab (navigation.tab_contents), built from 06-comparison-scenarios.yaml compare.
  layout: 'The headline, the shared controls, the phase line, then two panes: the left scenario
    (rag-query, headed RAG) and the right scenario (mcp-balance, headed MCP), side by side from 64rem
    and stacked below, left first. Then one row per entry of compare.aspects: its label in small
    ink-muted text beside its sentence, the label above the sentence below 48rem. Nothing makes the
    page scroll horizontally at any width; each diagram scrolls inside its own region, and below
    48rem each pane''s diagram is the step list (diagram.phone_list), the shared Previous, Play or
    Pause and Next sit in the bottom bar and the speeds, Start, Reset and the mode switch in the
    menu (layout.phone).'
  pane: 'Each pane shows its scenario''s question, its position ("Step <k> of <n> · <scenario phase
    label>") with its own step slider, the current event''s explanation with sender → receiver and
    operation (inspector.message_line), its sequence diagram, and a link "Inspect step <k> in <tab>"
    to the scenario''s own route at that step and mode, where the inspector, the context panel and the
    RAG panels are. Compare has no inspector, panels or splitter of its own.'
  timeline: 'The shared timeline follows 06 semantic_phases in order. Compare step 0 is before any
    event, both panes at step 0. Each semantic phase then lasts as many compare steps as the pane with
    more events in it has: at its j-th step each pane is at its j-th event of that phase, or stays on
    its last event of the phase when it has no more, saying "Done with <phase>; <other pane>
    continues." A phase in which neither pane has events has no steps. A pane without events in the
    phase (counted at the default parameters) keeps its events so far but shows no position from an
    earlier phase: its position line reads "No step in <phase> · <k> of <n> played", its diagram marks
    no current step or group, and its placeholder (06 compare.placeholders, which the validators require
    for exactly these phases) replaces the message. Both panes therefore always show the same semantic
    phase. This needs each scenario''s events to visit the semantic phases in their order, which a unit
    test checks.'
  controls: 'One set of shared controls drives the timeline: Start (compare step 1), Previous, Play or
    Pause, Next, Reset, the speeds and the keys of controls.keyboard, under controls.action_rules (Play
    advances one compare step per interval). Next therefore steps whichever panes still have events in
    the current phase, and moves both to the next phase once neither has. A shared slider jumps to any
    compare step. A pane''s own slider moves that pane: the position becomes the first compare step at
    which that pane is at the chosen step, and the other pane follows to the same semantic phase.'
  phase_line: 'Above the panes, the compare step ("Step <s> of <m> · <phase label>") and the semantic
    phase labels in order, the current one in weight 600 and marked as the current step for assistive
    technology; the others in ink-muted. Before step 1 no phase is current.'
  defaults: 'Both scenarios play at their default parameters; Compare offers no parameter controls.
    Prediction prompts are not shown in Compare, since a shared step would answer a question asked in
    one pane only; each scenario''s own tab shows them. The mode switch in the top bar sets both
    diagrams; architecture mode is the default, so each narrower pane starts from the phase groups.'
  route: '#/compare/<compare id>/<compare step>[/protocol], for example #/compare/compare-rag-mcp/12.
    Missing parts take defaults and a step beyond the timeline is clamped (navigation.routes); stepping
    replaces the history entry.'
  accessibility: 'Each pane is a region named by its tab label (RAG, MCP); each pane''s slider is
    labelled "<tab> step" with its position as value text. One polite live region announces the phase
    and both positions after each manual change of position while paused, and once when playback pauses
    or ends; it stays quiet while playing. For example "Information acquisition. RAG step 6 of 10. MCP
    step 14 of 28.", "Information acquisition. RAG step 6 of 10, done with this phase. MCP step 16 of
    28." or, for a pane with a placeholder, "Preparation. RAG: Index built earlier by rag-index. MCP
    step 4 of 28." Controls keep focus while stepping.'
rag_controls:
  top_k:
    min: 1
    max: 8
    default: 5
  similarity_threshold:
    min: 0
    max: 1
    step: 0.01
    default: 0.7
  reranking:
    default: false
  keyword_retrieval:
    default: false
  fetch_full_documents:
    default: false
  chunk_size_words:
    options:
    - 25
    - 50
    - 100
    default: 50
  overlap_words:
    options:
    - 0
    - 10
    - 20
    default: 10
  version_panel: 'In rag-stale and rag-conflict, show source and indexed document versions
    side by side: below the timeline from step 0, a section "Source and indexed versions"
    lists every official document with its source version (05 fixtures.documents) and the
    versions the index holds, or "not indexed". For each document whose indexed versions
    differ from or add to its source version, the source text and each other indexed text
    stand side by side (two columns from 64rem, stacked below), with the words that differ
    in weight 600 and one sentence stating the difference in words, for example "Version
    1.0 says ''CHF 7 per month'' where version 1.2 says ''CHF 5 per month''."'
  placement: 'A row of labelled option groups below the playback controls, shown from step
    0 in the scenarios that have the parameters (chunk size and overlap in rag-index; top K,
    threshold, reranking, keyword retrieval and fetch full documents in rag-query and its
    variants). A change recomputes the derived events at once (controls.action_rules.parameter_change);
    the values are not part of the route and return to their defaults with a new scenario.'
  control_kinds: 'Options (chunk size, overlap) and top K are groups of pressed buttons, one
    per value (top K 1 to 8). The threshold is a slider from min to max in steps of 0.01
    whose value is shown beside it with 2 decimals (Python rounding, as 05 writes thresholds).
    Reranking, keyword retrieval and fetch full documents are toggle buttons (pressed when on).
    Each control keeps keyboard focus while the scenario recomputes; the slider moves with
    the arrow keys, which then do not step the scenario (controls.keyboard_scope).'
rag_ingestion:
  shown_in: rag-index, below the timeline, from the step that returns the chunks (index-05);
    its chunk IDs and vectors are read from the played index-05 and index-07 events, so the
    screen always equals them.
  layout: 'Three columns from 64rem, stacked below: the source document (chosen with a
    Document menu), its chunks, and the selected chunk. The first chunk is selected at start;
    after a parameter change the selection moves to the chunk of the same document that holds
    the previously selected chunk''s first word.'
  overlap: 'The words the selected chunk shares with its previous and its next chunk are
    set in weight 600 in place: in the document, in the selected chunk''s text and in the
    neighbour''s text. One line beside the chunk list states each shared range in words, for
    example "Words 40–49 are also in everyday-account@1.2-c50o10-002.", so overlap depends
    neither on colour nor on weight alone. The selected chunk''s words in the document and its
    entry in the list have the selection background and an ink underline.'
  focus: When the panel disappears (stepping back before index-05) while it holds focus, focus
    moves to the step slider.
  chunk: 'The selected chunk''s metadata (the record fields of index-08 plus its chunk ID
    and word count), then, from index-07 on, one row per named dimension: the lexicon words
    found with their counts, the sum before normalizing (0.1 plus their weights), and the
    value; below them, the length of the vector of sums that each sum is divided by. Before
    index-07 it names the step that computes the vector.'
  embedding_note: Above the vector, the principle of 05-rag-scenarios.yaml that the demo
    embedding stands in for a learned model, as written there (two plain sentences).
rag_retrieval:
  shown_in: 'Scenarios that derive retrieve-12, the answer (rag-query and its variants; the
    Combined scenario derives only retrieve-05 and retrieve-06 and has no panel), below the
    timeline, from the step that returns the scored chunks (retrieve-05). Scores, the
    threshold, the selection, the prompt and the answer are read from the played events
    (retrieve-03, retrieve-05, hybrid-02, hybrid-03, retrieve-06, retrieve-09, retrieve-10,
    retrieve-12), so the screen always equals them and shows nothing a later step decides;
    chunk text and vectors come from the index the scenario searches (05
    derived_event_rules.inputs at the current parameters), as retrieve-05''s technical note
    says.'
  sections: The scores, then the projection, then the prompt, then the answer, stacked so
    each chart has the full width at its real text size. A section appears from the step
    that produces its content; until then it is absent, not empty.
  scores: 'A dot plot (labels_and_charts): one row per chunk in retrieve-05''s order, labelled
    with its chunk ID, its dot at the cosine score on a 0–1 track at least 12rem wide with the
    score written beside it (4 decimals), on the side away from the threshold so the line stays
    continuous. From retrieve-06 the threshold is one vertical line labelled "threshold
    <value>" (2 decimals) and each row states its outcome in words: "retained, rank <n>" (the
    order in which the prompt carries it) or retrieve-06''s discard reason; retained dots are
    filled in the accent, the others hollow. Before retrieve-06 a line names the step that
    applies top K and the threshold. Once hybrid-02 is reached each hit shows its keyword
    score, and once hybrid-03 is reached each candidate shows its reranker score. A chunk of
    an untrusted document says "untrusted" in its row. With reranking (retrieve-06 rerank),
    one sentence below says that the <k> best by reranker score are retained, so a retained
    chunk can score lower than a dropped one. The outcome wraps within its column; no text
    leaves its column. The threshold''s label keeps clear of the top end of its line.'
  projection: 'A plain scatter plot of 05 fixtures.projection_2d (x = cost − rules, y = product
    − technical, both from −1 to 1, equal scales): the axes are named by meaning at their
    ends (rules ← → cost, technical ↓ ↑ product), every chunk point and the question''s point
    (retrieve-03) are labelled directly (in the compact form below, only the question''s
    point), and retained points are filled in the accent. Chunks
    with identical vectors and the same outcome (both retained, or both dropped for the same
    reason; the versions of one chunk in rag-conflict)
    share one label at their common point, naming each version once (for example
    "savings-account@1.0/1.2 · 001"); each chunk is still its own point for assistive
    technology. A label sits right or left of its point; where it would overlap another label,
    a point, the question''s mark, an axis, an axis name or a leader line, it moves up or down
    by a line, nearest first, beside a leader line kept as short as that allows: of the
    candidate layouts in which every label fits (several horizontal positions of the plot and
    orders of placement), the one whose leaders are shortest is drawn. A leader line crosses
    no label, point, axis name or other leader line. The plot keeps a side of at least 260
    px and only the room its outermost labels need on each side. A lineage-selected
    chunk''s label has the selection background and an ink underline. Each point is exposed to
    assistive technology as an image named by its chunk ID, coordinates and whether it is
    retained. One sentence below states that the projection is fixed and conceptual and that
    scores are computed in all dimensions. The plot fits the available width with text at its
    real size. Where no layout with a side of at least 260 px places every label within the
    width (phones, below 768 px), the plot takes a compact form instead of scrolling: the
    square plot at the available width (side at most 360 px) with its axes, their names and
    every point marked as above, only the question labelled at its point; then, below it, a
    list of the chunk points in score order, each with its label (shared labels as above), its
    position named by the axes with 2 decimals (for example "everyday-account@1.2 · 001: rules
    0.31, product 0.62"; a coordinate that rounds to 0.00 is written "on the rules–cost axis"
    or "on the technical–product axis" instead of a value) and "retained" in words when it
    is. Each line is a toggle button (pressed: weight 600) that marks its point on the plot
    with an ink ring; tapping a point presses its line, and one line is pressed at a time. A
    lineage-selected chunk''s line has the selection background and ink underline on its
    label, and its point the ink ring too. In the compact form the list carries the points
    for assistive technology and the plot is hidden from it, so nothing is announced twice.
    The compact form shows where the retained chunks lie relative to the question; the list
    names every point without a key.'
  prompt: 'From retrieve-09, "Prompt before and after retrieval": retrieve-09 prompt_before
    and retrieve-09 prompt_after filled in (its system message, and its user_template with
    the question and one document block per item of its document_blocks and retrievedText,
    written as retrieve-10 writes them) side by side (two columns from 64rem, stacked
    below), each message with its role. Until retrieve-10 a line says the prompt is assembled
    and the model has not seen it; from retrieve-10 it names the step that sent it. Each
    document block is set apart with its ID, version, chunk and trust; an untrusted block
    starts with the words "Untrusted document" in weight 600, and the instruction injected
    into it (05 fixtures.untrusted_documents injected_instruction) is set in weight 600 and
    followed by "(instruction inside a document: treated as data)".'
  answer: 'From retrieve-12, the answer (labelled simulated, learning.simulated_behaviour) with
    each [n] as a button that never breaks from the punctuation after it, then the source
    lines exactly as 05 answer_rules writes them. A citation opens its evidence below the
    answer, next to the source document: the document''s normalized text with the chunk''s
    words marked with the selection background and an ink underline, beside the chunk''s text
    and metadata; a parent document (fetch_full_documents) opens as the whole document. One
    citation is open at a time; activating it again closes it. The open citation is pressed
    and keeps focus while the panel rebuilds; a citation that no longer exists after a
    parameter change closes.'
  focus: When the panel rebuilds while it holds focus, focus stays on the same control or,
    if that control is gone, moves to the panel's heading. When the panel disappears
    (stepping back before retrieve-05) while it holds focus, focus moves to the step slider,
    as in rag_ingestion.
combined_answer:
  shown_in: 'The Combined scenario and its variants, below the timeline, from the step that
    displays the answer (c-08); absent before. The answer and its sources are read from the
    played c-08, the balance from the played tools/call result (mcp-23) and chunk text from the
    index the scenario searches, so the screen always equals the events.'
  title: Where each part of the answer comes from
  statements: 'The answer, labelled simulated (learning.simulated_behaviour), as its statements
    in answer order, each with its source as a label in a column of its own to the left (above
    the statement below 64rem), so label and position carry the provenance and colour does not.
    The statements are the parts the engine composes the answer from (06
    answer_composition.rule, 05 answer_rules), recomputed for the scenario as its derived events
    are, never found by parsing the text: "Tool data · MCP" for an intro sentence whose source
    is tool, "Session context" for one whose source is session, "Document evidence · RAG" for
    each group sentence and each conflict sentence, "Not in the evidence" for the sentence
    naming the unsupported aspects or the no-evidence answer, "Note" for the injection note, and
    "Comparison" for the comparison sentence, if one applies. Joined by single spaces, the
    statements are exactly the answer of c-08; where they are not, the answer is shown as one
    unlabelled statement.'
  links: 'The balance in the tool statement is a button that opens the tool result below the
    statements: the tool and its arguments (the tools/call request), the result''s
    structuredContent, the step of the tools/call result as a jump link, and the step of the
    first model request that contains the result. Each [n] is a citation button that opens its
    chunk next to its source document, as rag_retrieval.answer does, and never breaks from the
    punctuation after it. One of them is open at a time; activating it again closes it; the open
    one is pressed and keeps focus while the panel rebuilds.'
  sources: 'Below the statements the sources, in the order of the statements: "Tool data" with
    "<tool> result, returned at step <n>" (a jump link), then "Documents" with the source lines
    exactly as 05 answer_rules writes them.'
  gap: In a variant whose evidence lacks terms (combined-missing-terms), the "Not in the
    evidence" statement names them and the comparison statement says that no comparison is
    made; the gap is stated in words like every other statement.
  focus: As rag_retrieval.focus, with this panel's heading and the step slider.
accessibility:
- Keyboard operable controls
- Visible focus
- Semantic labels
- Reduced-motion preference
- Readable code at 200% zoom
