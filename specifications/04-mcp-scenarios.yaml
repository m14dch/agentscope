      sender: agent
      receiver: mcp-client
      operation: Use cached tool list
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: ACTION
      payload:
        tools:
        - get_balance
        source: cache
      explanation: The agent reuses a tools/list result from earlier whose ttlMs has not expired, so no
        tools/list request is sent.
      technical_notes:
      - ttlMs is a freshness hint, not a guarantee. Clients that need change notifications open a subscriptions/listen
        stream.
  - op: remove
    events:
    - mcp-05
    - mcp-06
    - mcp-07
  - op: patch
    event: mcp-08
    set:
      payload:
        tools:
        - name: get_balance
