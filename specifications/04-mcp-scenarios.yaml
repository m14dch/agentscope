      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-25
    set:
      payload:
        role: tool
        tool_call_id: demo-call-1
        content: Balance service temporarily unavailable (backend authentication failed).
        is_error: true
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-26
    set:
      payload.messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: What is the current balance of my bank account?
      - role: assistant
