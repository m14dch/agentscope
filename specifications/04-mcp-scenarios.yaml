product: AgentScope
spec_version: 3.0.0
protocol:
  revision: '2026-07-28'
  transport: Streamable HTTP
  reference: https://modelcontextprotocol.io/specification/2026-07-28
  schema: https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/2026-07-28/schema.json
  why_pinned: The latest published revision when this specification was written. Pinning keeps every envelope
    checkable against one schema. Re-validate all payloads before moving to a newer revision.
  example_profile: Stateless Streamable HTTP with application/json responses. SSE response streams, subscriptions/listen
    and multi round-trip requests are outside this trace.
  earlier_revisions: Revisions up to 2025-11-25 started with an initialize request, a notifications/initialized
    notification (answered with an empty HTTP 202) and an optional Mcp-Session-Id. Revision 2026-07-28
    removed the handshake and protocol-level sessions. The inspector for mcp-02 may show the legacy handshake
    for comparison, clearly labelled as an earlier revision.
  earlier_revision_handshake:
    revision: '2025-11-25'
    summary: 'Revision 2025-11-25 needed two HTTP exchanges before the first tool call: initialize and
      its result with an Mcp-Session-Id, then the notifications/initialized notification, answered with
      an empty 202.'
    messages:
    - operation: initialize
      sender: mcp-client
      receiver: mcp-server
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      payload:
        jsonrpc: '2.0'
        id: 1
        method: initialize
        params:
          protocolVersion: '2025-11-25'
          capabilities: {}
          clientInfo:
            name: agentscope-demo
            version: 1.0.0
    - operation: initialize result
      sender: mcp-server
      receiver: mcp-client
      http:
        status: 200
        headers:
          Content-Type: application/json
          Mcp-Session-Id: demo-session-7f3a
      payload:
        jsonrpc: '2.0'
        id: 1
        result:
          protocolVersion: '2025-11-25'
          capabilities:
            tools: {}
            resources: {}
          serverInfo:
            name: example-bank-mcp
            version: 1.0.0
          instructions: Example Bank tools return live account data for the authenticated customer.
    - operation: notifications/initialized
      sender: mcp-client
      receiver: mcp-server
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          MCP-Protocol-Version: '2025-11-25'
          Mcp-Session-Id: demo-session-7f3a
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      payload:
        jsonrpc: '2.0'
        method: notifications/initialized
    - operation: HTTP 202 Accepted
      sender: mcp-server
      receiver: mcp-client
      http:
        status: 202
        headers: {}
      payload: null
endpoints:
  mcp_server: https://mcp.example-bank.test/mcp
  rest_api: https://api.example-bank.test
tool_mapping:
  source: Manually implemented adapter informed by the OpenAPI document
  automatic_conversion: false
credentials:
  mcp_access_token: Issued to the agent for the MCP server (audience https://mcp.example-bank.test/mcp),
    subject = authenticated demo customer. Shown only as <REDACTED_MCP_ACCESS_TOKEN>.
  backend_service_token: The MCP server's own least-privilege credential for the REST API (scope balances:read
    and customers:read). Shown only as <REDACTED_BACKEND_SERVICE_TOKEN>.
  rule: The MCP server never forwards the MCP access token to the REST API (no token passthrough).
scenarios:
- id: mcp-balance
  title: Check my current account balance
  question: What is the current balance of my bank account?
  learning_question: How does an AI assistant obtain your live account balance?
  headline: MCP lets the model obtain live account information through a tool on the bank's MCP server,
    which the agent invokes through its MCP client.
  initial_state:
    mcp_state:
      server: null
      discovered_tools: []
    agent_state: []
    model_visible_messages: []
    authenticated_demo_customer_id: '123'
  participants:
  - user
  - agent
  - llm
  - mcp-client
  - mcp-server
  - rest-api
  - database
  phases:
  - id: setup
    label: Client setup and optional discovery
    semantic_phase: preparation
    takeaway: The agent's MCP client can ask the bank's MCP server what it supports before using it.
  - id: discovery
    label: Tool discovery
    semantic_phase: preparation
    takeaway: The client learns which tools the server offers; the agent converts them for the model.
  - id: question
    label: User question
    semantic_phase: user-request
    takeaway: The question reaches the agent, not the model or the MCP server.
  - id: planning
    label: Model chooses a tool; agent validates
    semantic_phase: information-acquisition
    takeaway: The model only asks for a tool; the agent decides whether that request is allowed.
  - id: tool
    label: MCP tool call
    semantic_phase: information-acquisition
    takeaway: The MCP client calls the tool on the MCP server; MCP carries the request, it holds no bank
      data.
  - id: backend
    label: REST backend
    semantic_phase: information-acquisition
    takeaway: The MCP server reads the balance from the bank's REST API with its own credentials.
  - id: context
    label: Add tool result to conversation
    semantic_phase: context-assembly
    takeaway: The agent adds the tool result to its stored conversation; the model still has not seen
      it.
  - id: generation
    label: Final model request
    semantic_phase: model-generation
    takeaway: The agent sends the whole conversation, now including the balance, back to the model.
  - id: answer
    label: Answer
    semantic_phase: answer
    takeaway: The simulated answer reports exactly the balance the tool returned.
  events:
  - id: mcp-01
    scenario_id: mcp-balance
    phase: setup
    sequence: 1
    sender: agent
    receiver: mcp-client
    operation: Create MCP client
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      endpoint: https://mcp.example-bank.test/mcp
      transport: streamable_http
      protocolVersion: '2026-07-28'
      clientInfo:
        name: agentscope-demo
        version: 1.0.0
    explanation: The agent (host application) creates an MCP client for the Example Bank MCP server endpoint
      https://mcp.example-bank.test/mcp. The client is a library inside the agent process.
    technical_notes:
    - No connection is opened yet. Streamable HTTP sends each JSON-RPC message as its own HTTP POST.
    - Revision 2026-07-28 has no initialize handshake and no protocol-level session.
  - id: mcp-02
    scenario_id: mcp-balance
    phase: setup
    sequence: 2
    sender: mcp-client
    receiver: mcp-server
    operation: server/discover
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '1'
    pair_id: mcp-03
    payload:
      jsonrpc: '2.0'
      id: 1
      method: server/discover
      params:
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: server/discover
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: 'Optional: ask the server which protocol versions, capabilities and identity it offers.
      A client may skip this and call any method directly.'
    technical_notes:
    - Every request carries the protocol version and client capabilities in params._meta, and the MCP-Protocol-Version
      header must match _meta.
    - This replaces the initialize/initialized handshake of revisions up to 2025-11-25.
    security_boundaries:
    - agent-to-mcp
  - id: mcp-03
    scenario_id: mcp-balance
    phase: setup
    sequence: 3
    sender: mcp-server
    receiver: mcp-client
    operation: server/discover result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '1'
    pair_id: mcp-02
    payload:
      jsonrpc: '2.0'
      id: 1
      result:
        resultType: complete
        supportedVersions:
        - '2026-07-28'
        capabilities:
          tools: {}
          resources: {}
        instructions: Example Bank tools return live account data for the authenticated customer.
        ttlMs: 3600000
        cacheScope: public
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The server supports revision 2026-07-28 and offers tools and resources. The client may
      cache this answer for one hour (ttlMs).
    technical_notes:
    - serverInfo is self-reported; clients must not base security decisions on it.
    - Server instructions are text for the model and are lower-trust content.
    - Resources, such as the bank's OpenAPI document, would be listed with resources/list and read with
      resources/read; like tool results they reach the model only if the agent sends them. This scenario
      uses tools only.
    state_changes:
    - path: mcp_state.server
      op: set
      value_ref: payload.result
  - id: mcp-04
    scenario_id: mcp-balance
    phase: discovery
    sequence: 4
    sender: agent
    receiver: mcp-client
    operation: List tools
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    explanation: The agent asks its MCP client for the server's tools so it can offer them to the model.
  - id: mcp-05
    scenario_id: mcp-balance
    phase: discovery
    sequence: 5
    sender: mcp-client
    receiver: mcp-server
    operation: tools/list
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '2'
    pair_id: mcp-06
    payload:
      jsonrpc: '2.0'
      id: 2
      method: tools/list
      params:
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: tools/list
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: Request the tool catalogue.
    security_boundaries:
    - agent-to-mcp
  - id: mcp-06
    scenario_id: mcp-balance
    phase: discovery
    sequence: 6
    sender: mcp-server
    receiver: mcp-client
    operation: tools/list result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '2'
    pair_id: mcp-05
    payload:
      jsonrpc: '2.0'
      id: 2
      result:
        resultType: complete
        tools:
        - name: get_customer
          title: Customer profile
          description: Return the customer's name and account type.
          inputSchema:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
          outputSchema:
            type: object
            properties:
              customerId:
                type: string
              name:
                type: string
              accountType:
                type: string
            required:
            - customerId
            - name
            - accountType
          annotations:
            readOnlyHint: true
        - name: get_customer_balance
          title: Customer balance
          description: Return the current balance of the customer's account.
          inputSchema:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
          outputSchema:
            type: object
            properties:
              customerId:
                type: string
              currency:
                type: string
              balance:
                type: number
            required:
            - customerId
            - currency
            - balance
          annotations:
            readOnlyHint: true
        ttlMs: 300000
        cacheScope: public
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The server returns two read-only tools in a deterministic order. The list may be cached
      for five minutes.
    technical_notes:
    - Tool definitions were written by hand for this server, informed by the bank's OpenAPI document.
      MCP does not convert OpenAPI automatically.
    - annotations such as readOnlyHint are hints from the server, not guarantees.
    state_changes:
    - path: mcp_state.discovered_tools
      op: set
      value_ref: payload.result.tools
  - id: mcp-07
    scenario_id: mcp-balance
    phase: discovery
    sequence: 7
    sender: mcp-client
    receiver: agent
    operation: Return discovered tools
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: RESULT
    payload:
      tools:
      - get_customer
      - get_customer_balance
      cachedForMs: 300000
    explanation: The client hands the tool definitions to the agent and caches them until ttlMs expires.
  - id: mcp-08
    scenario_id: mcp-balance
    phase: discovery
    sequence: 8
    sender: agent
    receiver: agent
    operation: Map tool schemas to provider format
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      tools:
      - name: get_customer
        description: Return the customer's name and account type.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      - name: get_customer_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
    explanation: The agent converts MCP tool definitions into the model provider's tool format. This is
      not an MCP message.
    technical_notes:
    - outputSchema and annotations stay in the agent; only name, description and input schema go to the
      model.
  - id: mcp-09
    scenario_id: mcp-balance
    phase: question
    sequence: 9
    sender: user
    receiver: agent
    operation: Ask current balance
    protocol: UI
    transport: in_process
    execution_type: IN_PROCESS
    message_type: REQUEST
    payload: What is the current balance of my bank account?
    explanation: The signed-in demo customer asks for their balance.
    security_boundaries:
    - user-to-agent
    context_changes:
    - target: agent_state
      action: append
      description: User question received
      value_ref: payload
  - id: mcp-10
    scenario_id: mcp-balance
    phase: planning
    sequence: 10
    sender: agent
    receiver: llm
    operation: Submit messages and tool definitions
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: REQUEST
    pair_id: mcp-11
    payload:
      messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: What is the current balance of my bank account?
      tools:
      - name: get_customer
        description: Return the customer's name and account type.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      - name: get_customer_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
    explanation: The agent sends the conversation and the mapped tool definitions to the model provider.
    security_boundaries:
    - agent-to-llm
    tracked_values:
      customerId: '123'
    context_changes:
    - target: model_visible_messages
      action: set
      value_ref: payload
      description: System prompt, user question and tool definitions become model-visible
  - id: mcp-11
    scenario_id: mcp-balance
    phase: planning
    sequence: 11
    sender: llm
    receiver: agent
    operation: Return requested tool call
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: RESPONSE
    pair_id: mcp-10
    payload:
      message:
        role: assistant
        tool_calls:
        - id: demo-call-1
          name: get_customer_balance
          arguments:
            customerId: '123'
      stop_reason: tool_use
    explanation: 'Simulated model output: the model does not call anything itself; it answers with a request
      that the agent run get_customer_balance.'
    prediction:
      prompt: 'The model has the question and a list of tools. What will it return: an answer or a request?'
    technical_notes:
    - The model may ask for several tools in turn; each result returns through the agent, which resends
      the whole conversation, before the model sees it.
    tracked_values:
      customerId: '123'
    context_changes:
    - target: agent_state
      action: append
      description: Assistant tool-call message stored
      value_ref: payload.message
  - id: mcp-12
    scenario_id: mcp-balance
    phase: planning
    sequence: 12
    sender: agent
    receiver: agent
    operation: Validate requested tool and policy
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      tool: get_customer_balance
      allowlisted: true
      schemaValid: true
      authorizedCustomerId: '123'
      requiresUserApproval: false
    explanation: The agent checks that the tool is on its allowlist, that the arguments match the input
      schema and that customerId equals the authenticated demo identity. Model output is untrusted.
    security_boundaries:
    - agent-to-mcp
    tracked_values:
      customerId: '123'
  - id: mcp-13
    scenario_id: mcp-balance
    phase: tool
    sequence: 13
    sender: agent
    receiver: mcp-client
    operation: Invoke selected tool
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      name: get_customer_balance
      arguments:
        customerId: '123'
    explanation: The agent asks the MCP client to call the validated tool.
    tracked_values:
      customerId: '123'
  - id: mcp-14
    scenario_id: mcp-balance
    phase: tool
    sequence: 14
    sender: mcp-client
    receiver: mcp-server
    operation: tools/call
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '3'
    pair_id: mcp-23
    payload:
      jsonrpc: '2.0'
      id: 3
      method: tools/call
      params:
        name: get_customer_balance
        arguments:
          customerId: '123'
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: tools/call
        Mcp-Name: get_customer_balance
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: Call the balance tool over Streamable HTTP.
    prediction:
      prompt: 'Who sends the tool call to the MCP server: the model or the MCP client?'
    technical_notes:
    - Mcp-Method and Mcp-Name mirror the body so gateways can route without parsing JSON; the server rejects
      mismatches with HTTP 400 and error -32020.
    - JSON-RPC IDs only need to be unique among the client's outstanding requests.
    security_boundaries:
    - agent-to-mcp
    tracked_values:
      customerId: '123'
  - id: mcp-15
    scenario_id: mcp-balance
    phase: tool
    sequence: 15
    sender: mcp-server
    receiver: mcp-server
    operation: Validate headers, token and arguments
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      headersMatchBody: true
      tokenAudience: https://mcp.example-bank.test/mcp
      argumentsValid: true
    explanation: The server checks that the headers match the body, that the MCP access token was issued
      for this server and that the arguments satisfy the tool's input schema.
    security_boundaries:
    - agent-to-mcp
  - id: mcp-16
    scenario_id: mcp-balance
    phase: tool
    sequence: 16
    sender: mcp-server
    receiver: mcp-server
    operation: Authorize and map tool to REST adapter
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      subject: '123'
      requestedCustomerId: '123'
      authorized: true
      adapter: GET /customers/{customerId}/balance
    explanation: The token's subject (demo customer 123) may read customer 123. The hand-written adapter
      maps the tool to GET /customers/{customerId}/balance.
    technical_notes:
    - The MCP server does not pass the MCP access token through to the backend. It uses its own least-privilege
      service credential.
    tracked_values:
      customerId: '123'
  - id: mcp-17
    scenario_id: mcp-balance
    phase: backend
    sequence: 17
    sender: mcp-server
    receiver: rest-api
    operation: GET /customers/123/balance
    protocol: HTTP
    transport: https
    execution_type: NETWORK
    message_type: REQUEST
    pair_id: mcp-21
    http:
      method: GET
      path: /customers/123/balance
      headers:
        Accept: application/json
        Authorization: Bearer <REDACTED_BACKEND_SERVICE_TOKEN>
    explanation: The adapter calls the bank's REST API with a separate backend credential.
    security_boundaries:
    - mcp-to-rest
    tracked_values:
      customerId: '123'
  - id: mcp-18
    scenario_id: mcp-balance
    phase: backend
    sequence: 18
    sender: rest-api
    receiver: rest-api
    operation: Authenticate and authorize
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      tokenValid: true
      scope: balances:read
    explanation: The REST API validates the service token and its balances:read scope.
  - id: mcp-19
    scenario_id: mcp-balance
    phase: backend
    sequence: 19
    sender: rest-api
    receiver: database
    operation: Query current balance
    protocol: DB
    transport: simulated
    execution_type: SIMULATED_INTERNAL
    message_type: REQUEST
    pair_id: mcp-20
    payload:
      query: current_balance
      customerId: '123'
    explanation: Illustrative internal query against the core ledger.
    tracked_values:
      customerId: '123'
  - id: mcp-20
    scenario_id: mcp-balance
    phase: backend
    sequence: 20
    sender: database
    receiver: rest-api
    operation: Return balance
    protocol: DB
    transport: simulated
    execution_type: SIMULATED_INTERNAL
    message_type: RESPONSE
    pair_id: mcp-19
    payload:
      rows:
      - customerId: '123'
        currency: CHF
        balance: 12500.75
    explanation: The ledger returns the current balance.
    tracked_values:
      customerId: '123'
      balance: 12500.75
  - id: mcp-21
    scenario_id: mcp-balance
    phase: backend
    sequence: 21
    sender: rest-api
    receiver: mcp-server
    operation: HTTP 200 OK
    protocol: HTTP
    transport: https
    execution_type: NETWORK
    message_type: RESPONSE
    pair_id: mcp-17
    payload:
      customerId: '123'
      currency: CHF
      balance: 12500.75
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The REST API returns the balance as JSON.
    tracked_values:
      customerId: '123'
      balance: 12500.75
  - id: mcp-22
    scenario_id: mcp-balance
    phase: tool
    sequence: 22
    sender: mcp-server
    receiver: mcp-server
    operation: Wrap REST result as MCP tool result
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    explanation: The adapter returns the data as structuredContent matching the outputSchema, plus the
      same JSON as text for clients that only read content.
    tracked_values:
      customerId: '123'
      balance: 12500.75
  - id: mcp-23
    scenario_id: mcp-balance
    phase: tool
    sequence: 23
    sender: mcp-server
    receiver: mcp-client
    operation: tools/call result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '3'
    pair_id: mcp-14
    payload:
