product: AgentScope
spec_version: 3.0.0
protocol:
  revision: '2026-07-28'
  transport: Streamable HTTP
  reference: https://modelcontextprotocol.io/specification/2026-07-28
  schema: https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/2026-07-28/schema.json
  why_pinned: The latest published revision when this specification was written. Pinning keeps every envelope
    checkable against one schema. Re-validate all payloads before moving to a newer revision.
  example_profile: Stateless Streamable HTTP with application/json responses. SSE response streams, subscriptions/listen
    and multi round-trip requests are outside this trace.
  earlier_revisions: Revisions up to 2025-11-25 started with an initialize request, a notifications/initialized
    notification (answered with an empty HTTP 202) and an optional Mcp-Session-Id. Revision 2026-07-28
    removed the handshake and protocol-level sessions. The inspector for mcp-02 may show the legacy handshake
    for comparison, clearly labelled as an earlier revision.
  earlier_revision_handshake:
    revision: '2025-11-25'
    summary: 'Revision 2025-11-25 needed two HTTP exchanges before the first tool call: initialize and
      its result with an Mcp-Session-Id, then the notifications/initialized notification, answered with
      an empty 202.'
    messages:
    - operation: initialize
      sender: mcp-client
      receiver: mcp-server
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      payload:
        jsonrpc: '2.0'
        id: 1
        method: initialize
        params:
          protocolVersion: '2025-11-25'
          capabilities: {}
          clientInfo:
            name: agentscope-demo
            version: 1.0.0
    - operation: initialize result
      sender: mcp-server
      receiver: mcp-client
      http:
        status: 200
        headers:
          Content-Type: application/json
          Mcp-Session-Id: demo-session-7f3a
      payload:
        jsonrpc: '2.0'
        id: 1
        result:
          protocolVersion: '2025-11-25'
          capabilities:
            tools: {}
            resources: {}
          serverInfo:
            name: example-bank-mcp
            version: 1.0.0
          instructions: Example Bank tools return live account data for the authenticated customer.
    - operation: notifications/initialized
      sender: mcp-client
      receiver: mcp-server
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          MCP-Protocol-Version: '2025-11-25'
          Mcp-Session-Id: demo-session-7f3a
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      payload:
        jsonrpc: '2.0'
        method: notifications/initialized
    - operation: HTTP 202 Accepted
      sender: mcp-server
      receiver: mcp-client
      http:
        status: 202
        headers: {}
      payload: null
endpoints:
  mcp_server: https://mcp.example-bank.test/mcp
  rest_api: https://api.example-bank.test
tool_mapping:
  source: Manually implemented adapter informed by the OpenAPI document
  automatic_conversion: false
credentials:
  mcp_access_token: Issued to the agent for the MCP server (audience https://mcp.example-bank.test/mcp),
    subject = authenticated demo customer. Shown only as <REDACTED_MCP_ACCESS_TOKEN>.
  backend_service_token: The MCP server's own least-privilege credential for the REST API (scope balances:read
    and customers:read). Shown only as <REDACTED_BACKEND_SERVICE_TOKEN>.
  rule: The MCP server never forwards the MCP access token to the REST API (no token passthrough).
scenarios:
- id: mcp-balance
  title: Check my current account balance
  question: What is the current balance of my bank account?
  learning_question: How does an AI assistant obtain your live account balance?
  headline: MCP lets the model obtain live account information through a tool on the bank's MCP server,
    which the agent invokes through its MCP client.
  initial_state:
    mcp_state:
      server: null
      discovered_tools: []
    agent_state: []
    model_visible_messages: []
    authenticated_demo_customer_id: '123'
  participants:
  - user
  - agent
  - mcp-client
  - llm
  - mcp-server
  - rest-api
  - database
  phases:
  - id: setup
    label: Client setup and optional discovery
    semantic_phase: preparation
    takeaway: The agent's MCP client can ask the bank's MCP server what it supports before using it.
  - id: discovery
    label: Tool discovery
    semantic_phase: preparation
    takeaway: The client learns which tools the server offers; the agent converts them for the model.
  - id: question
    label: User question
    semantic_phase: user-request
    takeaway: The question reaches the agent, not the model or the MCP server.
  - id: planning
    label: Model chooses a tool; agent validates
    semantic_phase: information-acquisition
    takeaway: The model only asks for a tool; the agent decides whether that request is allowed.
  - id: tool
    label: MCP tool call
    semantic_phase: information-acquisition
    takeaway: The MCP client calls the tool on the MCP server; MCP carries the request, it holds no bank
      data.
  - id: backend
    label: REST backend
    semantic_phase: information-acquisition
    takeaway: The MCP server reads the balance from the bank's REST API with its own credentials.
  - id: context
    label: Add tool result to conversation
    semantic_phase: context-assembly
    takeaway: The agent adds the tool result to its stored conversation; the model still has not seen
      it.
  - id: generation
    label: Final model request
    semantic_phase: model-generation
    takeaway: The agent sends the whole conversation, now including the balance, back to the model.
  - id: answer
    label: Answer
    semantic_phase: answer
    takeaway: The answer reports exactly the balance the tool returned.
  overview:
    parties:
    - id: you
      label: You
      members: [user]
    - id: assistant
      label: Assistant
      members: [agent, mcp-client, llm]
    - id: bank-systems
      label: Bank systems
      members: [mcp-server, rest-api, database]
    stages:
    - id: prepare
      phases: [setup, discovery]
      sentence: Before any question, the assistant learns which actions the bank's systems offer.
    - id: ask
      phases: [question]
      sentence: You ask the assistant for your current balance.
    - id: fetch
      phases: [planning, tool, backend]
      sentence: The assistant asks the bank's systems, which look up your live balance.
    - id: answer
      phases: [context, generation, answer]
      sentence: The assistant answers with exactly the balance the bank's systems returned.
  events:
  - id: mcp-01
    scenario_id: mcp-balance
    phase: setup
    sequence: 1
    sender: agent
    receiver: mcp-client
    operation: Create MCP client
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      endpoint: https://mcp.example-bank.test/mcp
      transport: streamable_http
      protocolVersion: '2026-07-28'
      clientInfo:
        name: agentscope-demo
        version: 1.0.0
    explanation: The agent (host application) creates an MCP client for the Example Bank MCP server endpoint
      https://mcp.example-bank.test/mcp. The client is a library inside the agent process.
    technical_notes:
    - No connection is opened yet. Streamable HTTP sends each JSON-RPC message as its own HTTP POST.
    - Revision 2026-07-28 has no initialize handshake and no protocol-level session.
  - id: mcp-02
    scenario_id: mcp-balance
    phase: setup
    sequence: 2
    sender: mcp-client
    receiver: mcp-server
    operation: server/discover
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '1'
    pair_id: mcp-03
    payload:
      jsonrpc: '2.0'
      id: 1
      method: server/discover
      params:
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: server/discover
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: 'Optional: ask the server which protocol versions, capabilities and identity it offers.
      A client may skip this and call any method directly.'
    technical_notes:
    - Every request carries the protocol version and client capabilities in params._meta, and the MCP-Protocol-Version
      header must match _meta.
    - This replaces the initialize/initialized handshake of revisions up to 2025-11-25.
    security_boundaries:
    - agent-to-mcp
    carries:
    - 'the method server/discover: what does the server support?'
    - the protocol revision and the client's name, as in every request
    - JSON-RPC id 1, which the response repeats
    annotations:
    - heading: JSON-RPC envelope
      sentence: 'Every MCP message is a JSON-RPC 2.0 message: a request names a method and an id, and
        its response repeats that id.'
      paths:
      - jsonrpc
      - id
      - method
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: unique per request; the response repeats it
        method: asks the server to describe itself; optional
    - heading: Request metadata
      sentence: Revision 2026-07-28 has no handshake that would remember the client, so every request
        repeats the protocol revision and the client's identity here.
      paths:
      - params
      values:
        params._meta["io.modelcontextprotocol/protocolVersion"]: the protocol revision; the MCP-Protocol-Version
          header must repeat it
        params._meta["io.modelcontextprotocol/clientInfo"]: the client's self-reported name and version
        params._meta["io.modelcontextprotocol/clientCapabilities"]: '{} declares no optional client features'
  - id: mcp-03
    scenario_id: mcp-balance
    phase: setup
    sequence: 3
    sender: mcp-server
    receiver: mcp-client
    operation: server/discover result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '1'
    pair_id: mcp-02
    payload:
      jsonrpc: '2.0'
      id: 1
      result:
        resultType: complete
        supportedVersions:
        - '2026-07-28'
        capabilities:
          tools: {}
          resources: {}
        instructions: Example Bank tools return live account data for the authenticated customer.
        ttlMs: 3600000
        cacheScope: public
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The server supports revision 2026-07-28 and offers tools and resources. The client may
      cache this answer for one hour (ttlMs).
    technical_notes:
    - serverInfo is self-reported; clients must not base security decisions on it.
    - Server instructions are text for the model and are lower-trust content.
    - Resources, such as the bank's OpenAPI document, would be listed with resources/list and read with
      resources/read; like tool results they reach the model only if the agent sends them. This scenario
      uses tools only.
    state_changes:
    - path: mcp_state.server
      op: set
      value_ref: payload.result
    carries:
    - the protocol revisions the server supports
    - 'its capabilities: tools and resources'
    - instructions for the model, which are lower-trust text
    - how long the client may cache the answer
    annotations:
    - heading: JSON-RPC envelope
      sentence: The response repeats the request's id, so the client knows which of its requests this
        answers.
      paths:
      - jsonrpc
      - id
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: the id of the server/discover request, repeated
    - heading: Result type
      sentence: MCP says whether the request is finished or the server still needs input from the client.
      paths:
      - result.resultType
      values:
        result.resultType: 'complete: the request finished; the server needs nothing more from the client'
    - heading: Server capabilities
      sentence: The result tells the client which revisions and features the server supports before it
        uses any of them.
      paths:
      - result.supportedVersions
      - result.capabilities
      - result.instructions
      values:
        result.supportedVersions: revisions the server speaks; the client uses 2026-07-28
        result.capabilities.tools: '{} means supported, with no further options: the server offers tools'
        result.capabilities.resources: '{} means supported, with no further options: the server offers
          resources'
        result.instructions: text for the model; lower trust than the agent's own prompt
    - heading: Caching
      sentence: The client may reuse this answer instead of asking again, within these limits.
      paths:
      - result.ttlMs
      - result.cacheScope
      values:
        result.ttlMs: how long the answer may be reused, in milliseconds
        result.cacheScope: 'public: the answer is the same for every user, so a cache may share it'
    - heading: Server metadata
      sentence: MCP keeps the server's self-reported identity in _meta, apart from the result's data.
      paths:
      - result._meta
      values:
        result._meta["io.modelcontextprotocol/serverInfo"]: name and version the server reports about
          itself; not proof of who it is
  - id: mcp-04
    scenario_id: mcp-balance
    phase: discovery
    sequence: 4
    sender: agent
    receiver: mcp-client
    operation: List tools
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    explanation: The agent asks its MCP client for the server's tools so it can offer them to the model.
  - id: mcp-05
    scenario_id: mcp-balance
    phase: discovery
    sequence: 5
    sender: mcp-client
    receiver: mcp-server
    operation: tools/list
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '2'
    pair_id: mcp-06
    payload:
      jsonrpc: '2.0'
      id: 2
      method: tools/list
      params:
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: tools/list
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: Request the tool catalogue.
    security_boundaries:
    - agent-to-mcp
    carries:
    - 'the method tools/list: which tools are there?'
    - the protocol revision and the client's name, as in every request
    - JSON-RPC id 2, which the response repeats
    annotations:
    - heading: JSON-RPC envelope
      sentence: 'Every MCP message is a JSON-RPC 2.0 message: a request names a method and an id, and
        its response repeats that id.'
      paths:
      - jsonrpc
      - id
      - method
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: unique per request; the response repeats it
        method: asks for the server's tool catalogue
    - heading: Request metadata
      sentence: Revision 2026-07-28 has no handshake that would remember the client, so every request
        repeats the protocol revision and the client's identity here.
      paths:
      - params
      values:
        params._meta["io.modelcontextprotocol/protocolVersion"]: the protocol revision; the MCP-Protocol-Version
          header must repeat it
        params._meta["io.modelcontextprotocol/clientInfo"]: the client's self-reported name and version
        params._meta["io.modelcontextprotocol/clientCapabilities"]: '{} declares no optional client features'
  - id: mcp-06
    scenario_id: mcp-balance
    phase: discovery
    sequence: 6
    sender: mcp-server
    receiver: mcp-client
    operation: tools/list result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '2'
    pair_id: mcp-05
    payload:
      jsonrpc: '2.0'
      id: 2
      result:
        resultType: complete
        tools:
        - name: get_customer
          title: Customer profile
          description: Return the customer's name and account type.
          inputSchema:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
          outputSchema:
            type: object
            properties:
              customerId:
                type: string
              name:
                type: string
              accountType:
                type: string
            required:
            - customerId
            - name
            - accountType
          annotations:
            readOnlyHint: true
        - name: get_customer_balance
          title: Customer balance
          description: Return the current balance of the customer's account.
          inputSchema:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
          outputSchema:
            type: object
            properties:
              customerId:
                type: string
              currency:
                type: string
              balance:
                type: number
            required:
            - customerId
            - currency
            - balance
          annotations:
            readOnlyHint: true
        ttlMs: 300000
        cacheScope: public
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The server returns two read-only tools in a deterministic order. The list may be cached
      for five minutes.
    technical_notes:
    - Tool definitions were written by hand for this server, informed by the bank's OpenAPI document.
      MCP does not convert OpenAPI automatically.
    - annotations such as readOnlyHint are hints from the server, not guarantees.
    state_changes:
    - path: mcp_state.discovered_tools
      op: set
      value_ref: payload.result.tools
    carries:
    - 'two tool definitions: name, description, input and output schema'
    - a read-only hint for each tool
    - how long the client may cache the list
    annotations:
    - heading: JSON-RPC envelope
      sentence: The response repeats the request's id, so the client knows which of its requests this
        answers.
      paths:
      - jsonrpc
      - id
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: the id of the tools/list request, repeated
    - heading: Result type
      sentence: MCP says whether the request is finished or the server still needs input from the client.
      paths:
      - result.resultType
      values:
        result.resultType: 'complete: the request finished; the server needs nothing more from the client'
    - heading: 'Tool: get_customer'
      sentence: Each tool has a name the model will use, a description it reads and schemas for its arguments
        and its result.
      paths:
      - result.tools.0
      values:
        result.tools.0.name: the name a tool call must use
        result.tools.0.description: what the model reads to decide whether to use it
    - heading: 'Tool: get_customer_balance'
      sentence: This is the tool the balance question needs, described the same way.
      paths:
      - result.tools.1
      values:
        result.tools.1.name: the name a tool call must use
        result.tools.1.inputSchema: 'arguments: one customerId string and nothing else'
        result.tools.1.outputSchema: the shape of structuredContent in the tool's result
        result.tools.1.annotations.readOnlyHint: the server says the tool only reads; a hint, not a guarantee
    - heading: Caching
      sentence: The client may reuse the list instead of asking again, within these limits.
      paths:
      - result.ttlMs
      - result.cacheScope
      values:
        result.ttlMs: how long the answer may be reused, in milliseconds
        result.cacheScope: 'public: the answer is the same for every user, so a cache may share it'
    - heading: Server metadata
      sentence: MCP keeps the server's self-reported identity in _meta, apart from the result's data.
      paths:
      - result._meta
      values:
        result._meta["io.modelcontextprotocol/serverInfo"]: name and version the server reports about
          itself; not proof of who it is
  - id: mcp-07
    scenario_id: mcp-balance
    phase: discovery
    sequence: 7
    sender: mcp-client
    receiver: agent
    operation: Return discovered tools
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: RESULT
    payload:
      tools:
      - get_customer
      - get_customer_balance
      cachedForMs: 300000
    explanation: The client hands the tool definitions to the agent and caches them until ttlMs expires.
  - id: mcp-08
    scenario_id: mcp-balance
    phase: discovery
    sequence: 8
    sender: agent
    receiver: agent
    operation: Map tool schemas to provider format
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    payload:
      tools:
      - name: get_customer
        description: Return the customer's name and account type.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      - name: get_customer_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
    explanation: The agent converts MCP tool definitions into the model provider's tool format. This is
      not an MCP message.
    technical_notes:
    - outputSchema and annotations stay in the agent; only name, description and input schema go to the
      model.
  - id: mcp-09
    scenario_id: mcp-balance
    phase: question
    sequence: 9
    sender: user
    receiver: agent
    operation: Ask current balance
    protocol: UI
    transport: in_process
    execution_type: IN_PROCESS
    message_type: REQUEST
    payload: What is the current balance of my bank account?
    explanation: The signed-in demo customer asks for their balance.
    security_boundaries:
    - user-to-agent
    context_changes:
    - target: agent_state
      action: append
      description: User question received
      value_ref: payload
  - id: mcp-10
    scenario_id: mcp-balance
    phase: planning
    sequence: 10
    sender: agent
    receiver: llm
    operation: Submit messages and tool definitions
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: REQUEST
    pair_id: mcp-11
    payload:
      messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: What is the current balance of my bank account?
      tools:
      - name: get_customer
        description: Return the customer's name and account type.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      - name: get_customer_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
    explanation: The agent sends the conversation and the mapped tool definitions to the LLM provider.
      The model runs there; the agent reaches it only through the provider's API.
    security_boundaries:
    - agent-to-llm
    tracked_values:
      customerId: '123'
    context_changes:
    - target: model_visible_messages
      action: set
      value_ref: payload
      description: System prompt, user question and tool definitions become model-visible
    carries:
    - the system prompt, with the signed-in customer's ID
    - the user's question
    - the two tool definitions, in the model provider's format
    annotations:
    - heading: System prompt
      sentence: The agent's own instructions come first and tell the model who the customer is and how
        to use the tools.
      paths:
      - messages.0
      values:
        messages.0.role: 'system: written by the agent, not by the user'
        messages.0.content: includes customer ID 123 from the signed-in session
    - heading: Question
      sentence: The user's words reach the model unchanged, as a user message.
      paths:
      - messages.1
      values:
        messages.1.role: 'user: the person asking'
        messages.1.content: the question as the user typed it
    - heading: Tool definitions
      sentence: The model can only ask for the tools listed here, and it sees only their name, description
        and input schema.
      paths:
      - tools
      values:
        tools.0.name: a tool for the customer's profile
        tools.1.name: a tool for the account balance
        tools.1.description: what the model reads to decide whether to use the tool
        tools.1.parameters: 'JSON Schema the arguments must match: one customerId string'
  - id: mcp-11
    scenario_id: mcp-balance
    phase: planning
    sequence: 11
    sender: llm
    receiver: agent
    operation: Return requested tool call
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: RESPONSE
    pair_id: mcp-10
    payload:
      message:
        role: assistant
        tool_calls:
        - id: demo-call-1
          name: get_customer_balance
          arguments:
            customerId: '123'
      stop_reason: tool_use
    explanation: 'Simulated model output: the model does not call anything itself; it answers with a request
      that the agent run get_customer_balance.'
    technical_notes:
    - The model may ask for several tools in turn; each result returns through the agent, which resends
      the whole conversation, before the model sees it.
    tracked_values:
      customerId: '123'
    context_changes:
    - target: agent_state
      action: append
      description: Assistant tool-call message stored
      value_ref: payload.message
    carries:
    - a request to run get_customer_balance, not an answer
    - 'the arguments the model filled in: customer ID 123'
    - a call id that the tool result must refer to
    annotations:
    - heading: Tool call
      sentence: Instead of text, the model returns a request that the agent run one of the offered tools.
      paths:
      - message
      values:
        message.role: 'assistant: the model''s turn'
        message.tool_calls.0.id: call id; the tool message with the result must repeat it
        message.tool_calls.0.name: the tool the model chose from the definitions
        message.tool_calls.0.arguments.customerId: copied from the system prompt; the agent checks it
          against the signed-in customer
    - heading: Stop reason
      sentence: The stop reason tells the agent why the model stopped and what it expects next.
      paths:
      - stop_reason
      values:
        stop_reason: 'tool_use: the model waits for the tool''s result'
  - id: mcp-12
    scenario_id: mcp-balance
