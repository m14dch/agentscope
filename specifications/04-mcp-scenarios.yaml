        isError: true
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
      tracked_values:
        customerId: '123'
      explanation: 'The MCP server returns a tool execution error: isError is true, and the content names
        no credential.'
  - op: patch
    event: mcp-24
    set:
      payload:
        content:
        - type: text
