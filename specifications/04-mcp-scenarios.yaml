variants:
- id: mcp-resources
  title: Read the OpenAPI document as an MCP resource
  lesson: Resources let the agent read documents from the MCP server; they reach the model only if the
    agent sends them.
  extends: mcp-balance
  question: What is the current balance of my bank account?
  operations:
  - op: insert_after
    event: mcp-07
    events:
    - id: res-01
      phase: discovery
      sender: agent
      receiver: mcp-client
      operation: List resources
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: ACTION
      explanation: The agent asks which documents the server exposes as resources.
    - id: res-02
      phase: discovery
      sender: mcp-client
      receiver: mcp-server
      operation: resources/list
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: REQUEST
      correlation_id: '10'
      pair_id: res-03
      payload:
        jsonrpc: '2.0'
        id: 10
        method: resources/list
        params:
          _meta:
            io.modelcontextprotocol/protocolVersion: '2026-07-28'
            io.modelcontextprotocol/clientInfo:
              name: agentscope-demo
              version: 1.0.0
            io.modelcontextprotocol/clientCapabilities: {}
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          MCP-Protocol-Version: '2026-07-28'
          Mcp-Method: resources/list
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
        body_ref: payload
      explanation: Request the resource list.
      security_boundaries:
      - agent-to-mcp
    - id: res-03
      phase: discovery
      sender: mcp-server
      receiver: mcp-client
      operation: resources/list result
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: RESPONSE
      correlation_id: '10'
      pair_id: res-02
      payload:
        jsonrpc: '2.0'
        id: 10
        result:
          resultType: complete
          resources:
          - uri: file:///docs/openapi.yaml
            name: openapi.yaml
            title: Example Bank API description
            mimeType: application/yaml
          ttlMs: 3600000
          cacheScope: public
          _meta:
            io.modelcontextprotocol/serverInfo:
              name: example-bank-mcp
              version: 1.0.0
      http:
        status: 200
        headers:
          Content-Type: application/json
        body_ref: payload
      explanation: The server exposes the bank's OpenAPI document as a read-only resource.
    - id: res-04
      phase: discovery
      sender: mcp-client
      receiver: mcp-server
      operation: resources/read
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: REQUEST
      correlation_id: '11'
      pair_id: res-05
      payload:
        jsonrpc: '2.0'
        id: 11
        method: resources/read
        params:
          uri: file:///docs/openapi.yaml
          _meta:
            io.modelcontextprotocol/protocolVersion: '2026-07-28'
            io.modelcontextprotocol/clientInfo:
              name: agentscope-demo
              version: 1.0.0
            io.modelcontextprotocol/clientCapabilities: {}
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          MCP-Protocol-Version: '2026-07-28'
          Mcp-Method: resources/read
          Mcp-Name: file:///docs/openapi.yaml
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
        body_ref: payload
      explanation: Read the resource. For resources/read, Mcp-Name mirrors params.uri.
      security_boundaries:
      - agent-to-mcp
    - id: res-05
      phase: discovery
      sender: mcp-server
      receiver: mcp-client
      operation: resources/read result
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: RESPONSE
      correlation_id: '11'
      pair_id: res-04
      payload:
        jsonrpc: '2.0'
        id: 11
        result:
          resultType: complete
          contents:
          - uri: file:///docs/openapi.yaml
            mimeType: application/yaml
            text: |
              openapi: 3.1.0
              info:
                title: Example Bank API (fictional)
                version: 1.2.0
              servers:
                - url: https://api.example-bank.test
              paths:
                /customers/{customerId}:
                  get:
                    summary: Get customer profile
                    security: [{ serviceToken: [customers:read] }]
                /customers/{customerId}/balance:
                  get:
                    summary: Get current balance
                    security: [{ serviceToken: [balances:read] }]
                    responses:
                      "200": { description: customerId, currency and balance }
                      "401": { description: Missing or invalid token }
                      "404": { description: No active account }
              components:
                securitySchemes:
                  serviceToken: { type: oauth2, flows: { clientCredentials: { tokenUrl: https://auth.example-bank.test/token, scopes: { balances:read: Read balances, customers:read: Read profiles } } } }
          ttlMs: 3600000
          cacheScope: public
          _meta:
            io.modelcontextprotocol/serverInfo:
              name: example-bank-mcp
              version: 1.0.0
