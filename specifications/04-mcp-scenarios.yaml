        status: 200
        headers:
          Content-Type: application/json
        body_ref: payload
      explanation: The server returns the document text.
    - id: res-06
      phase: discovery
      sender: mcp-client
      receiver: agent
      operation: Return resource contents
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: RESULT
      payload:
        uri: file:///docs/openapi.yaml
        mimeType: application/yaml
        characters: 797
      explanation: 'The agent now holds the document. A resource is application-controlled: the host decides
        whether to show it to the model. In this trace it stays in agent state and is never sent to the
        model.'
      context_changes:
      - target: agent_state
        action: append
        description: OpenAPI resource stored
        value_ref: payload
- id: mcp-not-found
  title: Backend 404 becomes a tool execution error
  lesson: A backend failure comes back as a tool result with isError true, so the model can explain it
    to the user.
  extends: mcp-balance
  question: What is the current balance of my bank account?
  fixture_overrides:
    ledger: No active account record exists for customer 123 in this variant.
  operations:
  - op: patch
    event: mcp-20
    set:
      payload:
        rows: []
      tracked_values:
        customerId: '123'
      explanation: The ledger has no active account for customer 123.
      operation: Return no account
  - op: replace
    event: mcp-21
    with:
      id: mcp-21
      phase: backend
      sender: rest-api
      receiver: mcp-server
      operation: HTTP 404 Not Found
      protocol: HTTP
      transport: https
      execution_type: NETWORK
      message_type: RESPONSE
      pair_id: mcp-17
      payload:
        error: account_not_found
        message: No active account for customer 123
      http:
        status: 404
        headers:
          Content-Type: application/json
        body_ref: payload
      explanation: The REST API reports that no active account exists.
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-22
    set:
      operation: Wrap backend error as tool execution error
      tracked_values:
        customerId: '123'
      explanation: 'A backend failure is a tool execution error: a successful JSON-RPC response whose
        result has isError true, so the model can react to it.'
  - op: patch
    event: mcp-23
    set:
      payload.result:
        resultType: complete
        content:
        - type: text
          text: 'Balance unavailable: no active account was found for customer 123 (backend HTTP 404).'
        isError: true
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
      tracked_values:
        customerId: '123'
      explanation: The MCP exchange itself succeeded (HTTP 200, JSON-RPC result); the tool reports isError
        true.
  - op: patch
    event: mcp-24
    set:
      payload:
        content:
        - type: text
          text: 'Balance unavailable: no active account was found for customer 123 (backend HTTP 404).'
        isError: true
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-25
    set:
      payload:
        role: tool
        tool_call_id: demo-call-1
        content: 'Balance unavailable: no active account was found for customer 123 (backend HTTP 404).'
        is_error: true
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-26
    set:
      payload.messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: What is the current balance of my bank account?
      - role: assistant
        tool_calls:
        - id: demo-call-1
          name: get_customer_balance
          arguments:
            customerId: '123'
      - role: tool
        tool_call_id: demo-call-1
        content: 'Balance unavailable: no active account was found for customer 123 (backend HTTP 404).'
        is_error: true
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-27
    set:
      payload.message.content: I couldn't find an active account for you, so I can't show a balance. Please
        contact Example Bank support if you think this is wrong.
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-28
    set:
      payload: I couldn't find an active account for you, so I can't show a balance. Please contact Example
        Bank support if you think this is wrong.
      tracked_values:
        customerId: '123'
  phase_overrides:
    backend:
      takeaway: 'The bank''s REST API answers 404: there is no active account, so there is no balance
        to read.'
    context:
      takeaway: The agent stores the error as a tool message; the model has not seen it yet.
    generation:
      takeaway: The agent sends the whole conversation, now including the error, back to the model.
    answer:
      takeaway: The simulated answer explains that no balance is available instead of inventing one.
- id: mcp-unauthorized
  title: Backend authentication failure
  lesson: When the MCP server's own backend credential fails, the tool reports an error without exposing
    the credential.
  extends: mcp-balance
  question: What is the current balance of my bank account?
  fixture_overrides:
    backend_service_token: expired
  operations:
  - op: patch
    event: mcp-18
    set:
      payload:
        tokenValid: false
        reason: expired
      explanation: The MCP server's backend service token has expired, so the REST API rejects the request.
  - op: remove
    events:
    - mcp-19
    - mcp-20
  - op: replace
    event: mcp-21
    with:
      id: mcp-21
      phase: backend
      sender: rest-api
      receiver: mcp-server
      operation: HTTP 401 Unauthorized
      protocol: HTTP
      transport: https
      execution_type: NETWORK
      message_type: RESPONSE
      pair_id: mcp-17
      payload:
        error: invalid_token
      http:
        status: 401
        headers:
          Content-Type: application/json
          WWW-Authenticate: Bearer error="invalid_token"
        body_ref: payload
      explanation: The REST API rejects the backend credential.
      technical_notes:
      - This failure is between the MCP server and its backend. The MCP request itself was authorized;
        an MCP transport 401 would fail the POST to /mcp instead.
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-22
    set:
      operation: Wrap backend error as tool execution error
      tracked_values:
