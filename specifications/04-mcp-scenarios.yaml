  - id: mcp-22
    scenario_id: mcp-balance
    phase: tool
    sequence: 22
    sender: mcp-server
    receiver: mcp-server
    operation: Wrap REST result as MCP tool result
    protocol: INTERNAL
    transport: in_process
    execution_type: IN_PROCESS
    message_type: ACTION
    explanation: The adapter returns the data as structuredContent matching the outputSchema, plus the
      same JSON as text for clients that only read content.
    tracked_values:
      customerId: '123'
      balance: 12500.75
  - id: mcp-23
    scenario_id: mcp-balance
    phase: tool
    sequence: 23
    sender: mcp-server
    receiver: mcp-client
    operation: tools/call result
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: RESPONSE
    correlation_id: '3'
    pair_id: mcp-14
    payload:
      jsonrpc: '2.0'
      id: 3
      result:
        resultType: complete
        content:
        - type: text
          text: '{"customerId":"123","currency":"CHF","balance":12500.75}'
        structuredContent:
          customerId: '123'
          currency: CHF
          balance: 12500.75
        isError: false
        _meta:
          io.modelcontextprotocol/serverInfo:
            name: example-bank-mcp
            version: 1.0.0
    http:
      status: 200
      headers:
        Content-Type: application/json
      body_ref: payload
    explanation: The tool succeeded. isError is false.
    technical_notes:
    - 'Had the call failed, it would fail in one of three kinds. A backend 404 or a
      rejected backend credential happens behind the MCP server, which reports it here as a tool execution
      error: a successful JSON-RPC response with isError true that the model can explain. A failure of the
      HTTP connection between MCP client and MCP server is a transport error: no MCP response arrives at
      all. An unknown tool, for example from a stale tool cache, is a protocol error: a JSON-RPC error
      object instead of a result.'
    tracked_values:
      customerId: '123'
      balance: 12500.75
    carries:
    - the balance as text, for clients that read only content
    - the same data as structured JSON that matches the output schema
    - 'isError false: the tool succeeded'
    - JSON-RPC id 3, matching the tools/call request
    annotations:
    - heading: JSON-RPC envelope
      sentence: The response repeats the request's id, so the client knows which of its requests this
        answers.
      paths:
      - jsonrpc
      - id
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: the id of the tools/call request, repeated
    - heading: Result type
      sentence: MCP says whether the request is finished or the server still needs input from the client.
      paths:
      - result.resultType
      values:
        result.resultType: 'complete: the request finished; the server needs nothing more from the client'
    - heading: Result content
      sentence: Content is what a client can pass on to a model, here the backend's JSON as one text block.
      paths:
      - result.content
      values:
        result.content.0.type: 'text: a plain text block'
        result.content.0.text: the same data as JSON text; the agent sends this to the model
    - heading: Structured result
      sentence: Structured content carries the same data as typed JSON that matches the tool's output
        schema.
      paths:
      - result.structuredContent
      values:
        result.structuredContent.customerId: the customer the result is for
        result.structuredContent.currency: 'CHF: Swiss francs'
        result.structuredContent.balance: the balance from the REST API, unchanged
    - heading: Outcome
      sentence: A failed tool would still answer, with isError true and a message the model can explain.
      paths:
      - result.isError
      values:
        result.isError: 'false: the tool succeeded'
    - heading: Server metadata
      sentence: MCP keeps the server's self-reported identity in _meta, apart from the result's data.
      paths:
      - result._meta
      values:
        result._meta["io.modelcontextprotocol/serverInfo"]: name and version the server reports about
          itself; not proof of who it is
