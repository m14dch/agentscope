- id: mcp-jsonrpc-error
  title: Unknown tool from a stale tool cache (JSON-RPC protocol error)
  lesson: An unknown tool is a protocol error, not a failing tool; a stale tool cache can cause it.
  extends: mcp-balance
  question: What is the current balance of my bank account?
