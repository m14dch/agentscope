  - id: mcp-14
    scenario_id: mcp-balance
    phase: tool
    sequence: 14
    sender: mcp-client
    receiver: mcp-server
    operation: tools/call
    protocol: MCP
    transport: streamable_http
    execution_type: NETWORK
    message_type: REQUEST
    correlation_id: '3'
    pair_id: mcp-23
    payload:
      jsonrpc: '2.0'
      id: 3
      method: tools/call
      params:
        name: get_customer_balance
        arguments:
          customerId: '123'
        _meta:
          io.modelcontextprotocol/protocolVersion: '2026-07-28'
          io.modelcontextprotocol/clientInfo:
            name: agentscope-demo
            version: 1.0.0
          io.modelcontextprotocol/clientCapabilities: {}
    http:
      method: POST
      path: /mcp
      headers:
        Accept: application/json, text/event-stream
        Content-Type: application/json
        MCP-Protocol-Version: '2026-07-28'
        Mcp-Method: tools/call
        Mcp-Name: get_customer_balance
        Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
      body_ref: payload
    explanation: Call the balance tool over Streamable HTTP.
    technical_notes:
    - Mcp-Method and Mcp-Name mirror the body so gateways can route without parsing JSON; the server rejects
      mismatches with HTTP 400 and error -32020.
    - JSON-RPC IDs only need to be unique among the client's outstanding requests.
    security_boundaries:
    - agent-to-mcp
    tracked_values:
      customerId: '123'
    carries:
    - the tool name the model chose
    - the customer ID, which the agent checked against the signed-in customer
    - the protocol revision, which the MCP-Protocol-Version header repeats
    - JSON-RPC id 3, which the result repeats
    annotations:
    - heading: JSON-RPC envelope
      sentence: 'Every MCP message is a JSON-RPC 2.0 message: a request names a method and an id, and
        its response repeats that id.'
      paths:
      - jsonrpc
      - id
      - method
      values:
        jsonrpc: the JSON-RPC version, the same in every message
        id: unique per request; the response repeats it
        method: 'tools/call: run one tool; the Mcp-Method header repeats it'
    - heading: Tool call
      sentence: The client names the tool to run exactly as the server listed it.
      paths:
      - params.name
      values:
        params.name: the tool the model chose; the Mcp-Name header repeats it
    - heading: Arguments
      sentence: The arguments must match the tool's input schema, and the agent has already checked them.
      paths:
      - params.arguments
      values:
        params.arguments.customerId: whose balance to read; the agent checked it against the signed-in
          customer
    - heading: Request metadata
      sentence: Revision 2026-07-28 has no handshake that would remember the client, so every request
        repeats the protocol revision and the client's identity here.
      paths:
      - params._meta
      values:
        params._meta["io.modelcontextprotocol/protocolVersion"]: the protocol revision; the MCP-Protocol-Version
          header must repeat it
        params._meta["io.modelcontextprotocol/clientInfo"]: the client's self-reported name and version
        params._meta["io.modelcontextprotocol/clientCapabilities"]: '{} declares no optional client features'
  - id: mcp-15
    scenario_id: mcp-balance
    phase: tool
