      operation: tools/call error
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: RESPONSE
      correlation_id: '3'
      pair_id: mcp-14
      payload:
        jsonrpc: '2.0'
        id: 3
        error:
          code: -32602
          message: 'Unknown tool: get_balance'
      http:
        status: 200
