    operation: Return final answer
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: RESPONSE
    pair_id: mcp-26
    payload:
      message:
        role: assistant
        content: Your current account balance is CHF 12,500.75.
      stop_reason: end_turn
    explanation: Simulated model output selected from a template for the available evidence.
    tracked_values:
      customerId: '123'
      balance: 12500.75
    carries:
    - the final answer, with the balance the tool returned
    - 'end_turn: the model asks for no further tool'
    annotations:
    - heading: Answer
      sentence: The model's last turn is plain text for the user, written from the tool result.
      paths:
      - message
      values:
        message.role: 'assistant: the model''s turn'
        message.content: states the balance from the tool result
    - heading: Stop reason
      sentence: The stop reason tells the agent why the model stopped and what it expects next.
      paths:
      - stop_reason
      values:
        stop_reason: 'end_turn: the model is done and asks for nothing more'
  - id: mcp-28
    scenario_id: mcp-balance
    phase: answer
    sequence: 28
    sender: agent
    receiver: user
    operation: Display final answer
    protocol: UI
    transport: in_process
    execution_type: IN_PROCESS
    message_type: RESPONSE
    payload: Your current account balance is CHF 12,500.75.
    explanation: The agent shows the answer to the user.
    tracked_values:
      customerId: '123'
      balance: 12500.75
requirements:
- Show the HTTP envelope separately from the JSON-RPC logical message
- Every MCP request carries _meta with protocolVersion and clientCapabilities, and the MCP-Protocol-Version
  header matches it
- Every MCP POST carries Mcp-Method; tools/call and resources/read also carry Mcp-Name
- Every MCP result carries resultType; list and read results carry ttlMs and cacheScope
- The agent invokes the MCP client; the LLM never invokes MCP directly
- Tool discovery is optional per turn and may be served from a cache within ttlMs
- Backend REST authorization is separate from MCP transport authorization
- Every LLM request after a tool call resends the full conversation
