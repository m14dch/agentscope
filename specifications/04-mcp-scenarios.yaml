            customerId: '123'
      - role: tool
        tool_call_id: demo-call-1
        content: 'Tool call failed: the server does not know the tool get_balance (JSON-RPC error -32602).'
        is_error: true
      payload.tools:
      - name: get_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-27
    set:
      payload.message.content: I couldn't retrieve your balance because the banking tool is temporarily
        unavailable. Please try again.
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-28
    set:
      payload: I couldn't retrieve your balance because the banking tool is temporarily unavailable. Please
        try again.
      tracked_values:
        customerId: '123'
  phase_overrides:
    tool:
      takeaway: The MCP server rejects the call as a protocol error because it does not know the tool;
        no backend is called.
    context:
      takeaway: The agent stores the failure as a tool message; the model has not seen it yet.
    generation:
      takeaway: The agent sends the whole conversation, now including the failure, back to the model.
    answer:
      takeaway: The simulated answer says the balance could not be retrieved instead of guessing it.
    discovery:
      takeaway: The agent reuses its cached tool list instead of asking the server again; the server's
        tools have changed since.
- id: mcp-multiple-tools
  title: Customer profile followed by balance
  lesson: The model can ask for several tools in turn; every result returns through the agent before the
    model sees it.
  extends: mcp-balance
  question: Which account type do I have, and what is its current balance?
  operations:
  - op: patch
    event: mcp-09
    set:
      payload: Which account type do I have, and what is its current balance?
  - op: patch
    event: mcp-10
    set:
      payload.messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: Which account type do I have, and what is its current balance?
  - op: patch
    event: mcp-11
    set:
      payload.message.tool_calls:
      - id: demo-call-1
        name: get_customer
        arguments:
          customerId: '123'
      explanation: 'Simulated model output: the model first asks for the customer profile.'
  - op: insert_after
    event: mcp-11
    events:
    - id: mt-01
      phase: planning
      sender: agent
      receiver: agent
      operation: Validate requested tool and policy
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: ACTION
      payload:
        tool: get_customer
        allowlisted: true
        schemaValid: true
        authorizedCustomerId: '123'
      explanation: The agent validates get_customer and the customer ID.
      security_boundaries:
      - agent-to-mcp
      tracked_values:
        customerId: '123'
    - id: mt-02
      phase: tool
      sender: agent
      receiver: mcp-client
      operation: Invoke selected tool
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: ACTION
      payload:
        name: get_customer
        arguments:
          customerId: '123'
      explanation: The agent asks the MCP client to call get_customer.
      tracked_values:
        customerId: '123'
    - id: mt-03
      phase: tool
      sender: mcp-client
      receiver: mcp-server
      operation: tools/call
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: REQUEST
      correlation_id: '3'
      pair_id: mt-09
      payload:
        jsonrpc: '2.0'
        id: 3
        method: tools/call
        params:
          name: get_customer
          arguments:
            customerId: '123'
          _meta:
            io.modelcontextprotocol/protocolVersion: '2026-07-28'
            io.modelcontextprotocol/clientInfo:
              name: agentscope-demo
              version: 1.0.0
            io.modelcontextprotocol/clientCapabilities: {}
      http:
        method: POST
        path: /mcp
        headers:
          Accept: application/json, text/event-stream
          Content-Type: application/json
          MCP-Protocol-Version: '2026-07-28'
          Mcp-Method: tools/call
          Mcp-Name: get_customer
          Authorization: Bearer <REDACTED_MCP_ACCESS_TOKEN>
        body_ref: payload
      explanation: Call the profile tool.
      security_boundaries:
      - agent-to-mcp
      tracked_values:
        customerId: '123'
    - id: mt-04
      phase: tool
      sender: mcp-server
      receiver: mcp-server
      operation: Validate, authorize and map to REST adapter
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: ACTION
      payload:
        headersMatchBody: true
        authorized: true
        adapter: GET /customers/{customerId}
      explanation: Same checks as for the balance tool; the adapter maps to GET /customers/{customerId}.
    - id: mt-05
      phase: backend
      sender: mcp-server
      receiver: rest-api
      operation: GET /customers/123
      protocol: HTTP
      transport: https
      execution_type: NETWORK
      message_type: REQUEST
      pair_id: mt-08
      http:
        method: GET
        path: /customers/123
        headers:
          Accept: application/json
          Authorization: Bearer <REDACTED_BACKEND_SERVICE_TOKEN>
      explanation: The adapter reads the customer profile.
      security_boundaries:
      - mcp-to-rest
      tracked_values:
        customerId: '123'
    - id: mt-06
      phase: backend
      sender: rest-api
      receiver: database
      operation: Query customer profile
      protocol: DB
      transport: simulated
      execution_type: SIMULATED_INTERNAL
      message_type: REQUEST
      pair_id: mt-07
      payload:
        query: customer_profile
        customerId: '123'
      explanation: Illustrative internal query.
      tracked_values:
        customerId: '123'
    - id: mt-07
      phase: backend
      sender: database
      receiver: rest-api
      operation: Return customer profile
      protocol: DB
      transport: simulated
      execution_type: SIMULATED_INTERNAL
      message_type: RESPONSE
      pair_id: mt-06
      payload:
        rows:
        - customerId: '123'
          name: Alex Example
          accountType: Everyday
      explanation: The profile row.
      tracked_values:
        customerId: '123'
    - id: mt-08
      phase: backend
      sender: rest-api
      receiver: mcp-server
      operation: HTTP 200 OK
      protocol: HTTP
      transport: https
      execution_type: NETWORK
      message_type: RESPONSE
      pair_id: mt-05
      payload:
        customerId: '123'
        name: Alex Example
        accountType: Everyday
      http:
        status: 200
        headers:
          Content-Type: application/json
        body_ref: payload
      explanation: The REST API returns the profile.
      tracked_values:
        customerId: '123'
    - id: mt-09
      phase: tool
      sender: mcp-server
      receiver: mcp-client
      operation: tools/call result
      protocol: MCP
      transport: streamable_http
      execution_type: NETWORK
      message_type: RESPONSE
      correlation_id: '3'
      pair_id: mt-03
      payload:
        jsonrpc: '2.0'
        id: 3
        result:
          resultType: complete
          content:
          - type: text
            text: '{"customerId":"123","name":"Alex Example","accountType":"Everyday"}'
          structuredContent:
            customerId: '123'
            name: Alex Example
            accountType: Everyday
          isError: false
          _meta:
            io.modelcontextprotocol/serverInfo:
              name: example-bank-mcp
              version: 1.0.0
      http:
        status: 200
        headers:
          Content-Type: application/json
        body_ref: payload
      explanation: The profile tool succeeded.
      tracked_values:
        customerId: '123'
    - id: mt-10
      phase: tool
      sender: mcp-client
      receiver: agent
      operation: Return tool result
      protocol: INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
      message_type: RESULT
      payload:
        content:
        - type: text
          text: '{"customerId":"123","name":"Alex Example","accountType":"Everyday"}'
        structuredContent:
          customerId: '123'
          name: Alex Example
          accountType: Everyday
        isError: false
      explanation: The agent stores the profile; the model has not seen it yet.
      tracked_values:
        customerId: '123'
      context_changes:
      - target: agent_state
        action: append
        value_ref: payload
        description: Profile tool result stored
    - id: mt-11
      phase: planning
      sender: agent
      receiver: llm
      operation: Submit conversation with first tool result
      protocol: LLM_API
      transport: https
      execution_type: NETWORK
      message_type: REQUEST
      pair_id: mt-12
      payload:
        messages:
        - role: system
          content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
            the available tools for current account data and never guess balances.
        - role: user
          content: Which account type do I have, and what is its current balance?
        - role: assistant
          tool_calls:
          - id: demo-call-1
            name: get_customer
            arguments:
              customerId: '123'
        - role: tool
          tool_call_id: demo-call-1
          content: '{"customerId":"123","name":"Alex Example","accountType":"Everyday"}'
        tools:
        - name: get_customer
          description: Return the customer's name and account type.
          parameters:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
        - name: get_customer_balance
          description: Return the current balance of the customer's account.
          parameters:
            type: object
            properties:
              customerId:
                type: string
                description: Example Bank customer ID
            required:
            - customerId
            additionalProperties: false
      explanation: The agent resends the conversation including the profile result.
      technical_notes:
      - Only the fields needed for the answer should be sent to the model. The name is included here to
        show that tool output becomes model-visible.
      security_boundaries:
      - agent-to-llm
      - tool-to-llm
      tracked_values:
        customerId: '123'
      context_changes:
      - target: model_visible_messages
        action: set
        value_ref: payload
        description: Profile result becomes model-visible
    - id: mt-12
      phase: planning
      sender: llm
      receiver: agent
      operation: Return second tool call
      protocol: LLM_API
      transport: https
      execution_type: NETWORK
      message_type: RESPONSE
      pair_id: mt-11
      payload:
        message:
          role: assistant
          tool_calls:
          - id: demo-call-2
            name: get_customer_balance
            arguments:
              customerId: '123'
        stop_reason: tool_use
      explanation: 'Simulated model output: the model now asks for the balance.'
      tracked_values:
        customerId: '123'
  - op: patch
    event: mcp-14
    set:
      payload.id: 4
      correlation_id: '4'
  - op: patch
    event: mcp-23
    set:
      payload.id: 4
      correlation_id: '4'
  - op: patch
    event: mcp-25
    set:
      payload.tool_call_id: demo-call-2
  - op: patch
    event: mcp-26
    set:
      payload.messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: Which account type do I have, and what is its current balance?
      - role: assistant
        tool_calls:
        - id: demo-call-1
          name: get_customer
          arguments:
            customerId: '123'
      - role: tool
        tool_call_id: demo-call-1
        content: '{"customerId":"123","name":"Alex Example","accountType":"Everyday"}'
      - role: assistant
        tool_calls:
        - id: demo-call-2
          name: get_customer_balance
          arguments:
            customerId: '123'
      - role: tool
        tool_call_id: demo-call-2
        content: '{"customerId":"123","currency":"CHF","balance":12500.75}'
  - op: patch
    event: mcp-27
    set:
      payload.message.content: You have an Everyday account. Its current balance is CHF 12,500.75.
      tracked_values:
        customerId: '123'
        balance: 12500.75
  - op: patch
    event: mcp-28
    set:
      payload: You have an Everyday account. Its current balance is CHF 12,500.75.
      tracked_values:
        customerId: '123'
        balance: 12500.75
  phase_overrides:
    backend:
      takeaway: The MCP server reads customer data from the bank's REST API with its own credentials.
requirements:
- Show the HTTP envelope separately from the JSON-RPC logical message
- Every MCP request carries _meta with protocolVersion and clientCapabilities, and the MCP-Protocol-Version
  header matches it
- Every MCP POST carries Mcp-Method; tools/call and resources/read also carry Mcp-Name
- Every MCP result carries resultType; list and read results carry ttlMs and cacheScope
- The agent invokes the MCP client; the LLM never invokes MCP directly
- Tool discovery is optional per turn and may be served from a cache within ttlMs
- Backend REST authorization is separate from MCP transport authorization
- Every LLM request after a tool call resends the full conversation
