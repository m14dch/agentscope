requirements:
- Show the HTTP envelope separately from the JSON-RPC logical message
- Every MCP request carries _meta with protocolVersion and clientCapabilities, and the MCP-Protocol-Version
  header matches it
- Every MCP POST carries Mcp-Method; tools/call and resources/read also carry Mcp-Name
- Every MCP result carries resultType; list and read results carry ttlMs and cacheScope
- The agent invokes the MCP client; the LLM never invokes MCP directly
- Tool discovery is optional per turn and may be served from a cache within ttlMs
- Backend REST authorization is separate from MCP transport authorization
- Every LLM request after a tool call resends the full conversation
