  - id: mcp-26
    scenario_id: mcp-balance
    phase: generation
    sequence: 26
    sender: agent
    receiver: llm
    operation: Submit full conversation with tool result
    protocol: LLM_API
    transport: https
    execution_type: NETWORK
    message_type: REQUEST
    pair_id: mcp-27
    payload:
      messages:
      - role: system
        content: You are Example Bank's assistant. The authenticated fictional customer ID is 123. Use
          the available tools for current account data and never guess balances.
      - role: user
        content: What is the current balance of my bank account?
      - role: assistant
        tool_calls:
        - id: demo-call-1
          name: get_customer_balance
          arguments:
            customerId: '123'
      - role: tool
        tool_call_id: demo-call-1
        content: '{"customerId":"123","currency":"CHF","balance":12500.75}'
      tools:
      - name: get_customer
        description: Return the customer's name and account type.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
      - name: get_customer_balance
        description: Return the current balance of the customer's account.
        parameters:
          type: object
          properties:
            customerId:
              type: string
              description: Example Bank customer ID
          required:
          - customerId
          additionalProperties: false
    explanation: Model APIs are stateless, so the agent resends the whole conversation (system prompt,
      question, assistant tool call and tool result) together with the tool definitions.
    security_boundaries:
    - agent-to-llm
    - tool-to-llm
    tracked_values:
      customerId: '123'
      balance: 12500.75
    context_changes:
    - target: model_visible_messages
      action: set
      value_ref: payload
      description: Tool result becomes model-visible for the first time
    carries:
    - 'the whole conversation again: system prompt, question and tool call'
    - the tool result with the balance, seen by the model for the first time
    - the same tool definitions
    annotations:
    - heading: System prompt
      sentence: The agent's own instructions come first and tell the model who the customer is and how
        to use the tools.
      paths:
      - messages.0
      values:
        messages.0.role: 'system: written by the agent, not by the user'
        messages.0.content: includes customer ID 123 from the signed-in session
    - heading: Question
      sentence: The user's words reach the model unchanged, as a user message.
      paths:
      - messages.1
      values:
        messages.1.role: 'user: the person asking'
        messages.1.content: the question as the user typed it
    - heading: Earlier tool call
      sentence: The model's own tool call is sent back, because the model API keeps no memory between
        requests.
      paths:
      - messages.2
      values:
        messages.2.role: 'assistant: the model''s earlier turn'
        messages.2.tool_calls.0.id: the call id the tool message below refers to
        messages.2.tool_calls.0.arguments.customerId: the customer the tool was called for
    - heading: Tool result
      sentence: The tool's result reaches the model only now, as a tool message that names the call it
        answers.
      paths:
      - messages.3
      values:
        messages.3.role: 'tool: a result the agent adds, not words of the user'
        messages.3.tool_call_id: matches the id of the tool call above
        messages.3.content: the text content of the tools/call result, with the balance
    - heading: Tool definitions
      sentence: The model can only ask for the tools listed here, and it sees only their name, description
        and input schema.
      paths:
      - tools
      values:
        tools.0.name: a tool for the customer's profile
        tools.1.name: a tool for the account balance
        tools.1.description: what the model reads to decide whether to use the tool
        tools.1.parameters: 'JSON Schema the arguments must match: one customerId string'
  - id: mcp-27
    scenario_id: mcp-balance
    phase: generation
    sequence: 27
    sender: llm
