  - id: mcp-21
    scenario_id: mcp-balance
    phase: backend
    sequence: 21
    sender: rest-api
    receiver: mcp-server
    operation: HTTP 200 OK
    protocol: HTTP
    transport: https
    execution_type: NETWORK
    message_type: RESPONSE
    pair_id: mcp-17
    payload:
      customerId: '123'
      currency: CHF
      balance: 12500.75
    http:
      status: 200
