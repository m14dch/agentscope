      message_type: REQUEST
      pair_id: hybrid-02
      payload:
        terms:
        - account
        - bank
        - conditions
        - maintaining
        - opening
        filter:
          visibility: public
      explanation: Search the same collection for exact query terms.
      security_boundaries:
      - vector-search
    - id: hybrid-02
      phase: retrieval
      sender: vector-db
      receiver: agent
      operation: Return keyword hits
      protocol: RAG_INTERNAL
      transport: simulated
      execution_type: SIMULATED_INTERNAL
      message_type: RESPONSE
      pair_id: hybrid-01
      payload:
        hits:
