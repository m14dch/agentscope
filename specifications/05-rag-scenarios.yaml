    account: Everyday
    aspect: suitability
    evidence:
      '*':
        span: suits customers who pay by card and need frequent access to their money
        statement: suits customers who pay by card and need frequent access to their money
  - id: savings-fee-interest
    documentId: savings-account.md
    account: Savings
    aspect: monthly fee and interest
    evidence:
      '1.2':
        span: It has no monthly fee and pays 0.50% annual interest
        statement: has no monthly fee and pays 0.50% annual interest
      '1.0':
        span: It has no monthly fee and pays 0.25% annual interest
        statement: has no monthly fee and pays 0.25% annual interest
  - id: savings-access
    documentId: savings-account.md
    account: Savings
    aspect: card access
    evidence:
      '*':
        span: has no debit card and cannot be used for card payments
        statement: has no debit card and cannot be used for card payments
  - id: savings-withdrawals
    documentId: savings-account.md
    account: Savings
    aspect: withdrawal rules
    evidence:
      '*':
        span: One withdrawal per month is free; further withdrawals cost CHF 2 each
        statement: allows one free withdrawal per month, with further withdrawals costing CHF 2 each
  - id: savings-fit
    documentId: savings-account.md
    account: Savings
    aspect: suitability
    evidence:
      '*':
        span: suits customers who want to earn interest and rarely need access to their savings
        statement: suits customers who want to earn interest and rarely need access to their savings
  answer_rules:
  - A fact is supported when its evidence span for the chunk's version (or '*') appears verbatim in a
    retained chunk from an official document.
  - Start with 'Example Bank offers the following accounts.'
  - For each account (Everyday, then Savings) list supported statements in fact order, each followed by
    a citation number. Number citations by first use.
  - If one fact is supported by different versions with different statements, write a conflict sentence
    that cites both and names the newest version.
  - For an account with some supported facts, name the unsupported aspects. For an account with none,
    say that no retrieved evidence covers it.
  - 'With no retained chunks, answer exactly: ''I could not find sufficiently relevant information in
    the indexed documents to answer this question.'''
  - Untrusted documents never supply facts. If a retained chunk contains the injected instruction, add
    the note that it was ignored.
  - List sources as '[n] <documentId> v<version>, chunk <chunkId>'. The model message appends them after
    'Sources:'.
