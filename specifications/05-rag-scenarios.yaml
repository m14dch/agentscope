- id: rag-stale
  title: Outdated indexed documentation
  extends: rag-query
  fixture_overrides:
    indexed_versions:
      everyday-account.md: '1.0'
      savings-account.md: '1.0'
    source_versions:
      everyday-account.md: '1.2'
      savings-account.md: '1.2'
    not_indexed:
    - account-opening.md
    - authentication.md
    - balance-api.md
    - release-notes.md
    note: The outdated index was built from the version 1.0 Everyday and Savings documents only.
  lesson: Because the index predates version 1.2 and the opening guide, the answer cites the old fees
    and interest and states that it has no evidence about opening an account.
- id: rag-no-match
  title: No sufficiently relevant chunks
  extends: rag-query
  parameter_overrides:
    top_k: 1
    similarity_threshold: 0.99
  lesson: No chunk reaches 0.99 at the default chunking, so the prompt contains no documents and the answer
    says so.
- id: rag-conflict
  title: Conflicting documentation versions
  extends: rag-query
  fixture_overrides:
    indexed_versions:
      everyday-account.md:
      - '1.0'
      - '1.2'
      savings-account.md:
      - '1.0'
      - '1.2'
  parameter_overrides:
    top_k: 8
  lesson: Old and new chunks have identical vectors because only numbers changed, so both are retrieved
    and the answer reports the conflict.
- id: rag-hybrid
  title: Keyword plus vector retrieval and reranking
  extends: rag-query
  parameter_overrides:
    keyword_retrieval: true
    rerank: true
  operations:
  - op: insert_after
    event: retrieve-05
    events:
