- id: rag-query
  title: Compare account conditions from bank documents
  question: What are the conditions for the different bank accounts you offer?
  participants:
  - user
  - agent
  - embedding-model
  - vector-db
  - document-store
  - llm
  phases:
  - id: question
    label: User question
    semantic_phase: user-request
  - id: embedding
    label: Embed query
    semantic_phase: information-acquisition
  - id: retrieval
    label: Search and filter
    semantic_phase: information-acquisition
  - id: context
    label: Assemble grounded prompt
    semantic_phase: context-assembly
  - id: generation
    label: Model request
    semantic_phase: model-generation
  - id: answer
    label: Answer
    semantic_phase: answer
  initial_state:
    retrieval:
      retained: []
    agent_state: []
    model_visible_messages: []
  parameters:
    top_k:
      min: 1
      max: 5
      default: 3
    similarity_threshold:
      min: 0
      max: 1
      default: 0.7
    rerank:
      default: false
    keyword_retrieval:
      default: false
    fetch_full_documents:
      default: false
  optional_steps:
    events:
    - retrieve-07
    - retrieve-08
    enabled_by: fetch_full_documents
  derived_events:
  - retrieve-05
  - retrieve-06
  - retrieve-07
  - retrieve-08
  - retrieve-09
  - retrieve-10
  - retrieve-11
  - retrieve-12
  context_rule: Retrieved text becomes model-visible only at retrieve-10
  events:
  - id: retrieve-01
    scenario_id: rag-query
    phase: question
    sequence: 1
    sender: user
    receiver: agent
    operation: Ask about account conditions
    protocol: UI
    transport: in_process
    execution_type: IN_PROCESS
    message_type: REQUEST
    payload: What are the conditions for the different bank accounts you offer?
    explanation: The user asks about the conditions of the available accounts.
    security_boundaries:
    - user-to-agent
  - id: retrieve-02
