- id: rag-query
  title: Conditions for opening and keeping an account
  question: What are the conditions for opening and maintaining a bank account?
  learning_question: How does an assistant ground its answer in the bank's own documents?
  headline: RAG retrieves relevant documents before generating an answer, so every statement can cite
    its source.
  participants:
  - user
  - agent
  - embedding-model
  - vector-db
  - document-store
  - llm
  phases:
  - id: question
    label: User question
    semantic_phase: user-request
    takeaway: The question reaches the agent, which searches the documents before asking the model.
  - id: embedding
    label: Embed query
    semantic_phase: information-acquisition
    takeaway: The question becomes a vector, made by the same model that embedded the chunks.
  - id: retrieval
    label: Search and filter
    semantic_phase: information-acquisition
    takeaway: Only the closest chunks above the threshold are kept; the rest never reach the model.
  - id: context
    label: Assemble grounded prompt
    semantic_phase: context-assembly
    takeaway: The kept chunks are wrapped as evidence, each labelled with its source and trust level.
  - id: generation
    label: Model request
    semantic_phase: model-generation
    takeaway: The model sees the evidence for the first time; its simulated answer is built only from
      that evidence.
  - id: answer
    label: Answer
    semantic_phase: answer
    takeaway: Each statement cites its chunk; gaps in the evidence are named, not filled in.
  initial_state:
    retrieval:
      retained: []
    agent_state: []
    model_visible_messages: []
  parameters:
    top_k:
      min: 1
      max: 8
      default: 5
    similarity_threshold:
      min: 0
      max: 1
      default: 0.7
    rerank:
      default: false
    keyword_retrieval:
      default: false
    fetch_full_documents:
      default: false
  optional_steps:
    events:
    - retrieve-07
    - retrieve-08
    enabled_by: fetch_full_documents
  derived_events:
  - retrieve-05
  - retrieve-06
  - retrieve-07
  - retrieve-08
  - retrieve-09
  - retrieve-10
  - retrieve-11
  - retrieve-12
  context_rule: Retrieved text becomes model-visible only at retrieve-10
  events:
  - id: retrieve-01
    scenario_id: rag-query
    phase: question
    sequence: 1
    sender: user
    receiver: agent
    operation: Ask about account conditions
