  answer_rules:
  - A fact is supported when its evidence span for the chunk's version (or '*') appears verbatim in a
    retained chunk from an official document.
  - 'For each answer group in order, write ''<label>: '' and its supported facts in fact order. Consecutive
    facts with the same subject form one phrase: the subject, then the predicates joined by commas and
    a final ''and''. Phrases are joined by ''; '' and the group ends with ''.''. Skip groups without supported
    facts.'
  - Write a citation '[n]' after a predicate only where the next predicate in the phrase is cited from
    a different chunk, or the phrase ends. When several chunks support the same predicate, cite the newest
    version, then the lowest chunk ID. Number citations in order of first appearance in the final answer
    text, so [1] comes first.
  - If one fact is supported by different versions with different predicates, write a conflict sentence
    after its group that cites each version and names the newest. In a conflict sentence each predicate
    stands alone, so its last comma becomes ' and '.
  - 'End with one sentence naming every unsupported aspect: ''The retrieved evidence does not cover <aspects>.'''
  - 'With no retained chunks, answer exactly: ''I could not find sufficiently relevant information in
    the indexed documents to answer this question.'''
  - Untrusted documents never supply facts. If a retained chunk contains the injected instruction, add
    the note that it was ignored.
  - List sources as '[n] <documentId> v<version>, chunk <chunkId>'. The model message appends them after
    'Sources:'.
scenarios:
- id: rag-index
  title: Ingest and index documents
  participants:
  - repository
  - pipeline
  - parser
  - chunker
  - embedding-model
  - vector-db
  learning_question: How does a document become searchable by meaning?
  headline: Before any question is asked, documents are split into chunks and indexed as vectors.
  phases:
  - id: load
    label: Load
    semantic_phase: preparation
    takeaway: The pipeline reads the official documents; no language model is involved.
  - id: parse
    label: Parse
    semantic_phase: preparation
    takeaway: Formatting is stripped so only text and its source metadata remain.
  - id: chunk
    label: Chunk
    semantic_phase: preparation
    takeaway: Each document is split into overlapping word windows that can be retrieved on their own.
  - id: embed
    label: Embed
    semantic_phase: preparation
    takeaway: Each chunk becomes a vector that places it by topic.
  - id: store
    label: Store
    semantic_phase: preparation
    takeaway: Vectors, text and metadata are stored together, so every search result can cite its source.
  initial_state:
    rag_index:
      sources: []
      indexed_chunks: 0
  parameters:
    chunk_size_words:
      options:
      - 25
      - 50
      - 100
      default: 50
    overlap_words:
      options:
      - 0
      - 10
      - 20
      default: 10
  derived_events:
  - index-05
  - index-07
  - index-08
  - index-09
  - index-10
  events:
  - id: index-01
    scenario_id: rag-index
    phase: load
    sequence: 1
    sender: repository
    receiver: pipeline
    operation: Load source documents
    protocol: RAG_INTERNAL
    transport: simulated
    execution_type: SIMULATED_INTERNAL
    message_type: ACTION
    payload:
      documents:
      - documentId: everyday-account.md
        version: '1.2'
        words: 79
      - documentId: savings-account.md
        version: '1.2'
        words: 88
      - documentId: account-opening.md
        version: '1.2'
        words: 89
      - documentId: authentication.md
        version: '1.2'
        words: 60
      - documentId: balance-api.md
        version: '1.2'
        words: 56
      - documentId: release-notes.md
        version: '1.2'
        words: 54
    explanation: The ingestion pipeline reads the official Markdown documents. openapi.yaml is exposed
      through MCP instead and is not indexed.
    state_changes:
    - path: rag_index.sources
      op: set
      value_ref: payload.documents
  - id: index-02
    scenario_id: rag-index
    phase: parse
    sequence: 2
    sender: pipeline
    receiver: parser
    operation: Parse Markdown
    protocol: RAG_INTERNAL
    transport: simulated
    execution_type: SIMULATED_INTERNAL
    message_type: REQUEST
    pair_id: index-03
    payload:
      documents:
      - everyday-account.md
      - savings-account.md
      - account-opening.md
      - authentication.md
      - balance-api.md
      - release-notes.md
      format: text/markdown
    explanation: Strip Markdown heading markers and join lines; keep document ID and version as metadata.
  - id: index-03
    scenario_id: rag-index
    phase: parse
    sequence: 3
    sender: parser
    receiver: pipeline
    operation: Return normalized text and metadata
    protocol: RAG_INTERNAL
