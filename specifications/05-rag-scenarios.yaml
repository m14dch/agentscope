        that the similarity threshold later removes.
    - id: hybrid-03
      phase: retrieval
      sender: agent
      receiver: agent
      operation: Merge candidates and rerank
      protocol: RAG_INTERNAL
      transport: in_process
      execution_type: IN_PROCESS
