product: AgentScope
spec_version: 3.0.0
event_schema:
  required:
  - id
  - scenario_id
  - phase
  - sequence
  - sender
  - receiver
  - operation
  - protocol
  - transport
  - execution_type
  - message_type
  - explanation
  fields:
    id: Unique string across the registry
    scenario_id: Scenario registry ID
    phase: ID of one of the scenario's phases
    sequence: Integer, strictly increasing from 1 within a scenario
    sender: Participant ID from the registry and listed in the scenario
    receiver: Participant ID from the registry and listed in the scenario
    operation: Method or internal action
    protocol: MCP | HTTP | LLM_API | RAG_INTERNAL | UI | DB | INTERNAL
    transport: streamable_http | https | in_process | simulated
    execution_type: NETWORK | IN_PROCESS | SIMULATED_INTERNAL (NETWORK denotes an
      illustrated wire exchange only)
    message_type: REQUEST | RESPONSE | NOTIFICATION | ACTION | RESULT
    correlation_id: JSON-RPC id as a string on MCP requests and responses; absent elsewhere
    pair_id: Optional matching event ID; pairs are reciprocal
    payload: Structured logical message or string
    http: Optional simulated HTTP envelope. body_ref points to the logical payload
      on the same event. Omit for in-process and simulated operations.
    explanation: Plain-language reason and outcome
    technical_notes: List of explanatory notes
    security_boundaries: List of boundary IDs from 07-security-protocols.yaml trust_boundaries
    tracked_values: Map of lineage keys (see lineage.tracked) to values or lists of
      values present in or produced by this event
    state_changes: 'List of {path, op: set | append, value | value_ref}. value_ref is
      a dotted path into this event (for example payload.result.tools). path is a dotted
      path into the snapshot; set replaces the value at path, append adds to the list at
      path.'
    context_changes: 'List of {target, action, description, value_ref}. target agent_state
      takes action append only; target model_visible_messages takes action set only, and
      only on LLM requests. Both need a value_ref.'
    prediction: 'Optional {prompt}: a question shown before this event runs, ending with
      "?"; the event itself answers it'
    carries: 'Optional list of short phrases (each at most 100 characters, no final full
      stop) naming what the message carries, shown under its explanation (02 inspector.carries).
      Example for tools/call: the tool name the model chose; the customer ID the agent checked
      against the signed-in customer; the JSON-RPC id the response repeats.'
    annotations: 'Optional list of annotation groups that explain the payload field by field
      (02 inspector.annotations; rules in annotation_rules). Each group is {heading, sentence,
      paths, values?}: heading names the group ("JSON-RPC envelope"), sentence says in one
      sentence why the group exists, paths lists the JSON paths of the payload members the
      group holds, and values maps a JSON path inside the group to its meaning, one bullet
      each.'
phase_schema:
  fields:
    id: Unique within the scenario
    label: Shown in architecture mode
    semantic_phase: One of 06-comparison-scenarios.yaml semantic_phases; drives Compare
      synchronization
    takeaway: Required. One sentence stating what the learner should understand from
      the phase; a message, not a noun
state_model:
  fields:
  - cursor
  - selected_event_id
  - playback_status
  - view_mode
  - agent_state
  - model_visible_messages
  - mcp_state
  - rag_index
  - retrieval
  - retrieval_config
  - lineage
  initial_state: Scenario-provided immutable fixture
  snapshot: 'The engine computes, for each cursor, a snapshot of cursor, selected_event_id,
    retrieval_config, lineage and state, which holds every initial_state field (agent_state,
    model_visible_messages, mcp_state, rag_index, retrieval and the fixture values).
    state_change paths address state. playback_status and view_mode belong to the player
    and the UI, not to snapshots. Every scenario replays without error at build and startup.'
  cursor: 0 is the initial state before any event; k is the state after events 1 to k.
    selected_event_id is the ID of event k, absent at 0.
  reducer: Replay state_changes and context_changes from initial state through cursor
  reducer_rules:
  - 'state_changes: set replaces the value at path; append adds the value to the list
    at path. The value is value, or value_ref resolved in the event. A path whose parent
    does not exist, or an append to a value that is not a list, is a scenario error.'
  - 'agent_state is the agent''s working memory in order: each agent_state change appends
    {event, description, value?}, where value is the resolved value_ref.'
  - 'model_visible_messages is what the model sees in its latest request: each LLM request
    replaces it with its resolved value_ref, the request payload (messages and tool definitions).'
  - 'lineage maps each tracked key to its occurrences {event, value} in events 1 to cursor,
    in order.'
  - 'retrieval_config maps each scenario parameter to its current value: the default,
    replaced by the learner''s changes. Values
    are finite, stay within the parameter''s min and max, are whole numbers when the default
    is one, and are one of the parameter''s options when it lists them.'
  random_access: Recompute from initial state or cached deterministic snapshots
  parameter_change: Regenerate derived events, optional steps and downstream snapshots
    with pure functions. The state of snapshots before the first changed event stays
    valid and only their retrieval_config is updated. Break score ties by stable chunk
    ID. Changing a parameter and changing it back yields identical snapshots.
  backward: No imperative reverse side effects
invariants:
- Event IDs unique across the registry
- Sequence strictly increasing within scenario
- Each pair_id resolves to exactly one event whose pair_id points back
- JSON-RPC request IDs match their responses; correlation_id equals the JSON-RPC id
- Every MCP payload validates against the pinned revision's schema.json
- MCP HTTP headers mirror the body (MCP-Protocol-Version, Mcp-Method, Mcp-Name)
- A tool result or retrieved chunk appears in model-visible context only from the next
  LLM request that submits it
- No HTTP envelope on in-process or simulated events
- Every participant and phase referenced by an event is declared by its scenario
- All tracked values resolve to fixture or event-derived data
- Same scenario and parameters yield identical results
lineage:
  tracked:
  - customerId
  - balance
  - sourceDocumentId
  - chunkId
  - retrievedText
  presentation: 'Tracked values are highlighted in the payload, and the annotation bullet of
    a tracked value says where it travels, with links to those steps (02 inspector.annotations.travel).
    There is no separate lineage view (issue 49).'
annotation_rules:
  paths: 'A JSON path is written in dots from the payload''s root: params.arguments.customerId,
    messages.0.content (array elements by index). A member name that contains a dot or a
    bracket is written as a JSON string in brackets: params._meta["io.modelcontextprotocol/protocolVersion"].
    $ alone is the whole payload (for example a string payload).'
  lines: 'The payload''s text is JSON.stringify(payload, null, 2), one member or element per
    line. A line of a member a group''s path holds (at any depth) belongs to that group. The
    line that opens an object or array not held by any path belongs to the group of the first
    line after it, the line that closes one to the group of the line before it.'
  checks:
  - Every path in paths and values exists in the payload.
  - No path is the same as or lies inside another path, in the same group or in another
    one (groups do not overlap).
  - 'Every leaf value and every empty object or array lies under exactly one path (no gaps),
    and they belong to the groups in the groups'' order, so the lines of the groups, taken
    in order, are exactly the payload''s text.'
  - Every key of values lies at or inside one of its own group's paths.
  - The heading is a non-empty phrase of at most 40 characters; the sentence is exactly one
    sentence ending with a full stop (no full stop, question or exclamation mark followed by
    a space and a capital letter inside it).
  - Each carries entry is a non-empty phrase of at most 100 characters without a final full stop.
  required: 'In the scenarios of 04, 05 and 06, every event with protocol MCP, LLM_API or HTTP
    has carries, and annotations when its payload is an object or an array (a GET request has
    no body to annotate). Other events may have them; the RAG pipeline''s requests and responses
    do.'
  derived_events: 'A derived event keeps the carries and annotations written in the YAML.
    Its paths therefore address only members that exist at every parameter value: an array
    whose length depends on the parameters is held and explained as a whole (chunks, matches,
    sources), never by an index that may not exist. The validators check annotations at the
    default parameters; a TypeScript unit test checks every derived event''s annotations
    against the payloads the RAG engine derives for every combination of option and boolean
    parameters and for top_k 1 to 8 with the similarity thresholds 0, 0.5, 0.7, 0.9 and 1.
    If the annotations still do not fit a derived payload, the inspector shows the payload
    without them (02 inspector.annotations.toggle).'
scenario_format:
  required:
  - id
  - title
  - learning_question
  - headline
  - participants
  - phases
  - events
  - initial_state
  learning_fields:
    learning_question: The question the scenario teaches, ending with "?"
    headline: One sentence stating the scenario's main message
  optional:
  - question
  - parameters
  - derived_events
  - optional_steps
  optional_fields:
    derived_events: Local (unprefixed) IDs of events whose payload values, explanation
      and tracked_values the scenario's engine recomputes from the fixtures and retrieval_config
      with pure functions (05-rag-scenarios.yaml
      derived_event_rules). Playback plays the derived events, never the YAML values,
      which show the base scenario at its default parameters (an optional step at its
      defaults with its enabling parameter on). Every other field of a derived event,
      such as state_changes and context_changes with their value_refs, stays as written.
    optional_steps: 'List of {events, enabled_by}: local event IDs that play only while
      the boolean parameter enabled_by is true. Otherwise playback omits them and numbers
      the remaining events from 1. A request and its response share one entry.'
  validation: 'At build and startup, check: required scenario and event fields; enum
    values of protocol, transport, execution_type and message_type; unique event IDs;
    sequence and scenario_id; declared phases and participants; reciprocal pairs; a
    correlation_id only on MCP requests and responses, equal to the JSON-RPC id; MCP
    headers mirroring the body; model-visible context rules; security boundary IDs;
    lineage keys; value_ref paths; carries and annotations (annotation_rules); learning
    fields and prediction prompts; derived_events
    and optional_steps naming the scenario''s events, each optional step enabled by a
    boolean parameter and holding both events of a pair. A failure stops the build.
    Errors identify scenario and event. validate_specs.py additionally validates MCP
    payloads against schema.json, recomputes the RAG reference results and recomputes
    every derived event of rag-index, rag-query and the Combined scenario at the default
    parameters (an optional step with its enabling parameter on): payloads, tracked values,
    the explanations of index-05, hybrid-02, hybrid-03 and retrieve-06, and the chunk-citation
    wording of the retrieve-09 system prompt. The other explanations that depend on parameters
    are checked by the TypeScript unit tests only.'
  encoding: 'YAML is the design specification. A Vite plugin parses it into a bundled
    JSON module at build time; the JSON is generated and never committed. Plain scalars
    are typed as PyYAML safe_load types them: booleans yes, no, on, off, true and false
    in any of their three spellings; null as ~, null or empty; integers in decimal,
    binary, octal and hexadecimal; floats need a dot. Scalars JSON cannot carry
    (timestamps, .inf, .nan, sexagesimal numbers), duplicate keys, keys that are not
    strings, anchors, aliases, explicit tags and merge keys are build errors.'
  golden_test: Every bundled file equals PyYAML safe_load of the same file, and the
    TypeScript registry (the scenarios of 04 and 05, then the composed scenario) equals the
    registry of validate_specs.py --dump-registry.
  one_scenario_per_use_case: 'Each use case has exactly one scenario: mcp-balance (MCP), rag-index
    and rag-query (RAG) and the composed Combined scenario. There are no variants: what a former
    variant taught (failures, resources, several tools, stale or conflicting documents, prompt
    injection, missing terms) is stated in a technical note of the base step it concerns, and
    what the RAG parameters show (no match, keyword retrieval and reranking) is reached with
    them (issue 46). A variants key in 04, 05 or 06 combined fails validation.'
composition_format:
  description: Used by the Combined scenario (06-comparison-scenarios.yaml).
  steps:
    copy: '{scenario, from, to, phase_map?, patch?}. Copies the inclusive event range
      of a scenario of 04 or 05. phase_map renames phases; patch applies field
      replacements keyed by source event ID.'
    insert: '{insert: [events]}. Adds new events written for the composed scenario.'
  expansion:
  - Process steps in order
  - Prefix every event ID and pair_id with '<composed id>:'
  - Set scenario_id and renumber sequence from 1
  - Take title, question, learning_question, headline, participants, phases, initial_state
    and derived_events from the composition
  - Copied ranges must contain complete request/response pairs
  - Validate the composed scenario
deterministic_model:
  behavior: Select prewritten response templates from evidence states. RAG answers
    follow 05-rag-scenarios.yaml answer_rules.
  label: Simulated model output
