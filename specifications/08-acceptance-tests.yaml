product: AgentScope
spec_version: 3.0.0
phases:
- id: 1
  name: Engine and diagram
  exit:
  - Step navigation and random access correct
  - Event inspector displays payload
  - Architecture/protocol modes preserve cursor
  - Variant and composition expansion validated
- id: 2
  name: MCP primary
  exit:
  - Discovery, tool listing, tool invocation, REST and response fully traced
  - JSON-RPC IDs correlated and MCP headers mirror the body
  - Context visibility correctly delayed
- id: 3
  name: RAG ingestion and retrieval
  exit:
  - Chunking and embedding inspection works
  - Computed vectors and scores match reference_results
  - topK and threshold recompute context and answer
- id: 4
  name: Compare and combined
  exit:
  - Semantic-phase sync works
  - Combined answer shows the simulated current balance and a conditional account
    comparison with document citations
- id: 5
  name: Security, errors and polish
  exit:
  - Errors correctly classified
  - Offline browser E2E passes
  - Accessible reduced-motion mode works
unit_tests:
- Event IDs unique; sequence monotonic
- All pair_id references reciprocal
- JSON-RPC request/response ids match and equal correlation_id
- Every MCP payload validates against the pinned schema.json
- MCP-Protocol-Version header equals params._meta protocolVersion; Mcp-Method equals
  method; Mcp-Name equals params.name or params.uri where required
- Previous/jump/reset reconstruct same state
- Parameter changes invalidate downstream snapshots
- No model-visible tool result or retrieved text before the LLM request that submits
  it
- Every LLM request after a tool call contains the full conversation including the
  assistant tool-call message
- Tracked customerId and balance remain consistent
- Chunk IDs, vectors, scores and selections reproduce 05-rag-scenarios.yaml reference_results
- Cosine similarity computed correctly
- Retrieval selection respects topK and threshold
- Simulated answers reproduce the reference answers and citations for every RAG reference
  and both Combined cases
- Document citations resolve to source fixtures
- No HTTP framing for in-process or simulated calls
- All three primary questions match 00-product.yaml primary_questions
- Every scenario has a learning question and headline, every phase a takeaway, every
  variant a lesson, and every prediction prompt ends with a question mark
- Expanded variants and compositions resolve scenario, participant, phase, event and
  pair references
- Every participant ID exists in the 01-architecture.yaml registry
- Every security_boundaries entry exists in 07-security-protocols.yaml
- Identical JSON fixtures and parameters yield identical snapshots, rankings and citations
e2e_tests:
- id: mcp-walkthrough
  steps:
  - Open MCP primary
  - Play through all events
  - Inspect server/discover, tools/list and tools/call with their HTTP headers
  - Verify REST GET and response
  - Verify final CHF 12,500.75
- id: mcp-errors
  steps:
  - Run mcp-not-found and mcp-unauthorized and verify isError results labelled as tool
    execution errors
  - Run mcp-jsonrpc-error and verify the JSON-RPC error labelled as a protocol error
- id: rag-walkthrough
  steps:
  - Run ingestion
  - Inspect chunks and vectors
  - Run retrieval
  - Change topK to 4
  - Inspect changed LLM prompt, answer and citations against reference_results
- id: navigation
  steps:
  - Jump to last step
  - Step backward
  - Switch architecture view
  - Reset and replay
  - Verify deterministic snapshots
- id: offline
  steps:
  - Load the production build under the Pages base path and wait for offline readiness.
  - Disable network access and reload the same URL.
  - Complete all three primary scenarios and inspect SVG, payloads and citations.
- id: combined-walkthrough
  steps:
  - Verify the exact combined question.
  - Trace MCP tool use and RAG evidence separately.
  - Verify CHF 12,500.75 and cited fee, interest and access trade-offs.
  - Run combined-missing-terms and verify the answer states the evidence gap.
- id: pages
  steps:
  - Build and serve dist under a repository subpath.
  - Verify shell, assets, hash navigation, service-worker scope and offline reload.
  - Fail on external requests or runtime API traffic.
quality_gates:
  min_supported_events: 100
  desktop_and_tablet: true
  keyboard_navigation: true
  reduced_motion: true
  scenario_schema_validation: true
  runtime_api_requests: 0
  external_requests: 0
  offline_reload_after_precache: true
definition_of_done:
- Static build and source delivered
- README includes run and extend instructions
- All primary scenarios deterministic and executable
- All protocol examples validated against the pinned revision
- No fictional model output represented as real inference
- GitHub Pages workflow deploys the Vite dist artifact at the configured base path
- Production build runs offline after precache with all fixtures and assets bundled
- No runtime backend, API keys or external services required
