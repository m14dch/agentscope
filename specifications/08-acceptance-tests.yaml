product: AgentScope
spec_version: 3.0.0
phases:
- id: 1
  name: Engine and diagram
  exit:
  - Step navigation and random access correct
  - Event inspector displays payload
  - Zoom levels (Overview, Architecture, Protocol) keep the learner's place
  - Composition expansion validated
- id: 2
  name: MCP primary
  exit:
  - Discovery, tool listing, tool invocation, REST and response fully traced
  - JSON-RPC IDs correlated and MCP headers mirror the body
  - Context visibility correctly delayed
- id: 3
  name: RAG ingestion and retrieval
  exit:
  - Chunking and embedding inspection works
  - Computed vectors and scores match reference_results
  - topK and threshold recompute context and answer
- id: 4
  name: Compare and combined
  exit:
  - Semantic-phase sync works
  - Combined answer shows the simulated current balance and a conditional account
    comparison with document citations
- id: 5
  name: Security and polish
  exit:
  - Offline browser E2E passes
  - Accessible reduced-motion mode works
unit_tests:
- Event IDs unique; sequence monotonic
- All pair_id references reciprocal
- JSON-RPC request/response ids match and equal correlation_id
- Every MCP payload validates against the pinned schema.json
- MCP-Protocol-Version header equals params._meta protocolVersion; Mcp-Method equals
  method; Mcp-Name equals params.name or params.uri where required
- Previous/jump/reset reconstruct same state
- Parameter changes invalidate downstream snapshots
- No model-visible tool result or retrieved text before the LLM request that submits
  it
- Every LLM request after a tool call contains the full conversation including the
  assistant tool-call message
- Tracked customerId and balance remain consistent
- Annotation validators (Python and TypeScript, with the same messages) reject paths that do
  not exist, overlapping groups, gaps, groups out of order, values outside their group and
  sentences that are not one sentence
- Every MCP, LLM_API and HTTP event of the scenarios has carries, and annotations when it has
  a body; the annotations of every derived event fit its payload at every parameter combination
  of 03 annotation_rules.derived_events
- With annotations closed the payload tree's text equals JSON.stringify(payload, null, 2); with
  them open the concatenated group lines equal it
- Chunk IDs, vectors, scores and selections reproduce 05-rag-scenarios.yaml reference_results
- Cosine similarity computed correctly
- Retrieval selection respects topK and threshold
- Simulated answers reproduce the reference answers and citations for every RAG reference
  and the Combined case
- Document citations resolve to source fixtures
- No HTTP framing for in-process or simulated calls
- All three primary questions match 00-product.yaml primary_questions
- Every scenario has a learning question and headline, and every phase a takeaway
- The composed scenario resolves scenario, participant, phase, event and pair references
- Each tab offers exactly its scenarios of 02 navigation.tab_contents, and only RAG has a
  scenario picker
- The TypeScript registry equals the Python validator's registry (golden test)
- A broken event fails the build with an error naming its scenario and event
- Every participant ID exists in the 01-architecture.yaml registry
- Every security_boundaries entry exists in 07-security-protocols.yaml
- Identical JSON fixtures and parameters yield identical snapshots, rankings and citations
- Every Compare step, and stepping either pane, keeps both panes on the same semantic phase
- Zooming maps the cursor both ways for every scenario (02 zoom_levels.cursor_mapping) - in to the
  first event of the current stage, out to the last event of the stage holding the event, unchanged
  between Architecture and Protocol - and Overview stepping stops at the end of every stage with
  played events
- Both validators report the same overview problems (03 overview_fields), and every scenario's
  overview passes
- At the Overview Compare steps stage by stage with both panes on the same semantic phase
- At Architecture the group the cursor enters expands (forward, back, jump, reset), and a
  group the learner collapsed stays collapsed until the cursor enters it again
e2e_tests:
- id: mcp-walkthrough
  steps:
  - Open MCP primary
  - Play through all events
  - Inspect server/discover, tools/list and tools/call with their HTTP headers
  - Verify REST GET and response
  - Verify final CHF 12,500.75
- id: rag-walkthrough
  steps:
  - Run ingestion
  - Inspect chunks and vectors
  - Run retrieval
  - Change topK to 4
  - Inspect changed LLM prompt, answer and citations against reference_results
- id: navigation
  steps:
  - Play mcp-balance from step 0 and verify it reaches the last step without stopping, and that
    Next from step 0 advances exactly one step per press
  - Jump to last step
  - Step backward
  - Switch to the Architecture level
  - Step through mcp-balance at Architecture and verify the current group is expanded
    with the current step in view at every step; collapse a group and verify it stays
    collapsed until the cursor enters it again
  - Reset and replay
  - Verify deterministic snapshots
- id: zoom-levels
  steps:
  - Open the MCP tab as a first-time visitor and verify the Overview of mcp-balance with its parties
    and 3 to 5 stage sentences, and that no protocol name (MCP, HTTP, JSON-RPC, LLM API, REST) appears
    anywhere on the page before zooming in.
  - Step through the stages with Next, then zoom in and out at a few representative steps with the
    zoom control and with + and -, and verify that zooming in opens the first event of the current
    stage, zooming out the stage holding the current event, and that Architecture and Protocol keep
    the event; verify the level change is announced.
  - Open a deep link at each level (none, /architecture, /protocol) and verify level and position,
    including an old address without a level that opens the stage holding its step.
  - Verify the RAG, Compare and Combined tabs offer all three levels, and Compare at the Overview
    shows both stories side by side stage by stage.
  - Scan the Overview of MCP, RAG and Compare with axe-core at desktop and phone width.
- id: offline
  steps:
  - Load the production build under the Pages base path and wait for offline readiness.
  - Disable network access and reload the same URL.
  - Complete all three primary scenarios and inspect SVG, payloads and citations.
- id: compare-sync
  steps:
  - Open Compare and step through every compare step with Next.
  - Verify both panes always show the same semantic phase and the RAG placeholder during preparation.
  - Step each pane with its own slider and verify the other pane follows to the same phase.
  - Verify both panes stack at tablet width without page-level horizontal scroll.
- id: combined-walkthrough
  steps:
  - Verify the exact combined question.
  - Trace MCP tool use and RAG evidence separately.
  - Verify CHF 12,500.75 and cited fee, interest and access trade-offs.
- id: annotated-payload
  steps:
  - Open mcp-balance at the tools/call request in protocol mode at 1440 px; the carries list is
    under the message line.
  - Open Annotations; verify the groups' headings, that the lines of all groups read as the
    payload, and that the customer ID bullet links to the step where it was first seen.
  - Follow that link and verify the cursor moves there; the toggle stays open on the next
    annotated step.
  - At 390 px open the same step's row and its annotations; nothing scrolls sideways.
  - axe reports no violations with annotations open.
- id: phone-steps
  steps:
  - At 390 × 844 and 360 × 800, open each kept scenario (mcp-balance, rag-query, rag-index,
    combined-balance-explanation) and Compare at each zoom level, press Open all where rows open,
    and verify that every row's body is shown, that nothing scrolls horizontally, on the page or
    inside any element, that no element other than the page scrolls vertically and that nothing
    is fixed to the screen.
  - Verify the rows of each level (stages at the Overview; one row per group at Architecture; one
    row per played event at Protocol with its step number, glyph, operation label and both
    participants, the glyph hidden from assistive technology and its meaning in words), that rows
    are buttons with aria-expanded, and that Compare marks each row RAG or MCP under its semantic
    phase.
  - Open and close rows by touch and with the keyboard (Tab, Enter, Space) and verify that
    several stay open, focus stays on the row, Close all closes every row, and the address names
    the last row opened.
  - Verify that the panels sit in the rows of their steps (scores and projection at retrieve-06, prompt at
    retrieve-10, answer at retrieve-12, the Combined answer at c-08, the model context at LLM
    requests) with the projection in its compact form.
  - Open a deep link and verify its row is open at the top of the screen; zoom and verify the
    mapped row opens.
  - Verify every control outside running text is at least 44 × 44 px, that there is no menu,
    bottom bar or step slider, and that from 48rem the diagram and the control row are unchanged.
- id: pages
  steps:
  - Build and serve dist under a repository subpath.
  - Verify shell, assets, hash navigation, service-worker scope and offline reload.
  - Verify the header wordmark and the favicon load under the subpath and after an offline
    reload.
  - Fail on external requests or runtime API traffic.
- id: accessibility
  steps:
  - At desktop, tablet and phone width, scan every tab and representative scenarios and steps at every zoom
    level with axe-core, as loaded and with the step details, the model context, a group and the scenario
    picker open (on phones, with every row open), and fail on any serious or critical finding.
  - At desktop and tablet width, on every tab at Architecture and Protocol, move through the page with Tab and verify
    that every control is reached, on screen and shows a visible focus indicator, that each playback
    icon button shows its name while focused, and that the arrow keys and Enter on Next step.
  - With reduced motion, verify on every tab that nothing animates or transitions and that the diagram
    regions jump to each step at once.
- id: quality-gate-events
  steps:
  - Step through every scenario and Compare with the arrow key at the default parameters and verify
    that the scenarios play at least min_supported_events events and that 95% of steps, Compare's
    included, are handled within 100 ms.
quality_gates:
  min_supported_events: 80
  min_supported_events_rule: 'Counted over the events played at each scenario''s default
    parameters, so optional steps that are off do not count, and Compare, which replays
    rag-query and mcp-balance, does not count either. The gate was 100 while the variants
    counted; with one scenario per use case (issue 46) the four scenarios play 83 events
    (mcp-balance 28, rag-index 10, rag-query 10, Combined 35), so the gate is 80: every
    scenario still counts, and a few events may be merged without lowering it again.'
  desktop_and_tablet: true
  phone: true
  keyboard_navigation: true
  reduced_motion: true
  scenario_schema_validation: true
  runtime_api_requests: 0
  runtime_api_requests_rule: Every e2e test counts as a runtime API request any same-origin
    request for a path that is not the base URL, sw.js, asset-manifest.json or a file it lists
  external_requests: 0
  offline_reload_after_precache: true
definition_of_done:
- Static build and source delivered
- README includes run and extend instructions
- All primary scenarios deterministic and executable
- All protocol examples validated against the pinned revision
- No fictional model output represented as real inference
- GitHub Pages workflow deploys the Vite dist artifact at the configured base path
- Production build runs offline after precache with all fixtures and assets bundled
- No runtime backend, API keys or external services required
