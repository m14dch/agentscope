name: Pages

# Deploys main to GitHub Pages: run all CI checks, build with the base path
# from the repository's Pages settings, deploy, then check the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails clearly if Pages is not enabled with GitHub Actions as its source.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # '/agentscope' for this project site, '' for a root site or custom domain.
          AGENTSCOPE_BASE: ${{ steps.pages.outputs.base_path || '/' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the live site
        run: node scripts/check-deployment.ts "$PAGE_URL"
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
