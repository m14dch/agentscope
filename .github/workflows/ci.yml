name: CI

# Runs on every pull request, and is called by pages.yml before each deployment.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs called by a deployment never are.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: specifications/tools/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r specifications/tools/requirements.txt

      - name: Validate specifications
        run: npm run validate:specs

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The runner image ships Google Chrome, so Chromium's system libraries are already
      # there; installing them with --with-deps goes through apt mirrors that have stalled
      # for the whole job. The browser download is cached per lockfile.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: npx playwright install chromium

      - name: End-to-end tests
        timeout-minutes: 6
        run: npm run test:e2e
