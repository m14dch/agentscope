name: CI

# Runs on every pull request, and is called by pages.yml before each deployment.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs called by a deployment never are.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: specifications/tools/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r specifications/tools/requirements.txt

      - name: Validate specifications
        run: npm run validate:specs

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
