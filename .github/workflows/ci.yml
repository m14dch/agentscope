name: CI

# One workflow for checks and deployment. Every run builds dist/ once and runs the browser
# tests against it; runs on main other than pull requests then deploy exactly that dist/.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # deploys only when started from main

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main queue so that a newer deployment
# waits instead of cancelling one in progress. Per-ref groups keep other runs out of that queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # The job keeps its name: it is the check pull requests report.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # configure-pages on deployable runs
    outputs:
      deploy: ${{ env.DEPLOY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: specifications/tools/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r specifications/tools/requirements.txt

      - name: Validate specifications
        run: npm run validate:specs

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Unit tests
        run: npm test

      # Fails if Pages is not enabled. The base path is '/agentscope' for this project
      # site and '' for a root site or custom domain.
      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6

      # The build and the browser tests share the base path, so the tests load the site
      # under the URL structure it is deployed to. Pull requests use /agentscope/.
      - name: Base path and version
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$DEPLOY" = true ]; then base="${PAGES_BASE:-/}"; else base=/agentscope/; fi
          echo "AGENTSCOPE_BASE=$base" >> "$GITHUB_ENV"
          echo "AGENTSCOPE_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # The runner image ships Google Chrome, so Chromium's system libraries are already
      # there; installing them with --with-deps goes through apt mirrors that have stalled
      # for the whole job. The browser download is cached per lockfile.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: npx playwright install chromium

      # About 7 minutes with the accessibility and quality tests (two workers: Playwright's
      # default of half the runner's four cores in CI).
      - name: End-to-end tests
        timeout-minutes: 12
        run: npm run test:e2e

      # Only after every check passed: the deployed site is the tested dist/.
      - uses: actions/upload-pages-artifact@v5
        if: env.DEPLOY == 'true'
        with:
          path: dist

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Longer than deploy-pages' own 10-minute timeout, so its error is reported.
    timeout-minutes: 15
    # Deployments never overlap, even with runs from other refs.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the live site
        run: node scripts/check-deployment.ts "$PAGE_URL" --expect-version "$GITHUB_SHA"
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
